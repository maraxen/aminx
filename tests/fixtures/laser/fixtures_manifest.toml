selection_rule = "Deterministic selection of 20 complexes for laser_score_parity: read the LASEr split json(s) from <laser-root>/databases/dataset_split_info.zip (prefer a held-out/test split if one exists, else the lexicographically first split json and record that fallback), keep entries whose PDB in the zip has >=1 non-water, non-ion HETATM ligand with >=6 heavy atoms, and 50..300 protein residues (count CA atoms), sort assembly stems lexicographically, take the first 20 satisfying entries; entries 1-4 of that list are the B0 extras. Water resnames: DOD, H2O, HOH, SOL, TIP, TIP3, TIP4, WAT. Ion resnames: BA, BR, CA, CD, CL, CO, CS, CU, F, FE, HG, IOD, K, LI, MG, MN, NA, NH4, NI, NO3, PO4, RB, SO4, SR, ZN. A protein residue is one unique (chain, resSeq, iCode) with an ATOM CA (altLoc blank or A) in the first MODEL only. A heavy atom is a HETATM whose element is not H or D (altLoc blank or A), grouped by (chain, resSeq, iCode, resName). Split ids have the form <pdb>_<assembly>-<segment>-<chain> (cluster keys and members); each maps to its bioassembly stem (the id up to its first '-'), stems are deduplicated, and archive members <pdb>_<assembly>.pdb are matched by filename stem, so the selection unit is one whole bioassembly file. Selection reads zip members in-archive and does not extract the full dataset."
split_file = "val_streptavidin_heldout_split_30pct_main_clusters.json"
split_name = "val_streptavidin_heldout_split_30pct_main_clusters"
split_fallback = false
split_choice_note = "Prefer a split JSON whose filename contains 'test'. The pinned LASEr dataset_split_info.zip has none (probe finding B2; databases/README.md: LigandMPNN reconstruction is train-only, and the streptavidin held-out split ships train/val at 30% and 70% sequence identity). Held-out fallback: a filename containing both 'val' and 'held', preferring '30pct' main clusters, else the lexicographically first such file. If no test, val, or held-out JSON exists, use the lexicographically first JSON and set split_fallback."
