# Integer LASEr decoding orders. Equality is exact; there is no band.
[port]
wave_id = "laser_order"
oracle_id = "ref:tests/port/reference/laser_order:v1"
symbol_qualname = "aminx.families.laser_mpnn.driver.decoding_order"
reference_subtree = "reference/laser_order"

[capabilities]
stochastic = false
dynamic_shape = false

[parity]
ad_critical = false
ad_critical_justification = ""
tolerance_policy_f64 = "exact"
tolerance_policy_f32 = "exact"
max_traces = 1

[access]
reference_write_identities = ["reference-vendor"]
fixer_read_only_on_reference = true
