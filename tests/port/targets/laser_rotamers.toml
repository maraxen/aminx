# laser_rotamers: post-decode RotamerBuilder sidechain frame.
# oracle_id hashes tests/port/reference/laser_rotamers/{algo.py,sealed.py}.
# The npz files stay outside this tree; sealed.load checks oracle_manifest.toml.
#
# atol is the house pairing for the declared rtol. It is NOT a measured deviation.
[port]
wave_id = "laser_rotamers"
oracle_id = "ref:tests/port/reference/laser_rotamers:v1:sha256:6283ef9362d19c1467c6a870bce4debc1600e70f0c16b042775e57a5854ec5dc"
symbol_qualname = "aminx.model.laser.rotamers.build_rotamers"
reference_subtree = "reference/laser_rotamers"

[capabilities]
stochastic = false
dynamic_shape = true

[parity]
ad_critical = false
ad_critical_justification = ""
tolerance_policy_f64 = "rtol=1e-8,atol=1e-11"
tolerance_policy_f32 = "rtol=1e-4,atol=1e-7"
max_traces = 1

[access]
reference_write_identities = ["reference-vendor"]
fixer_read_only_on_reference = true

[tolerance_basis]
f64_atol_basis = "house-paired and NOT measured"
f32_atol_basis = "house-paired and NOT measured"
