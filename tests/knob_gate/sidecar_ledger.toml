# T0.4 shipped no rows. Owning tasks record [sidecar.<slug>] after the vehicle run.
#
# Every id here is a bathos run checked against the step 1c conditions BEFORE
# being written: outcome == 'pass', status 'completed', git_dirty FALSE, git_hash
# an ancestor of HEAD that does not touch scoped paths, sidecar_sha256 matching
# the sidecar on disk, --mutants present in argv and equal to the manifest row
# ids, --output-paths containing /<slug>/<git sha8>/branch_controls.json, and
# every weights key resolving in tests/knob_gate/checkpoint_registry.json.
#
# FIVE TRAPS, each of which produces a run that looks entirely successful and
# fails step 1c for a reason unrelated to the measurement:
#   1. --mutants MUST BE IN ARGV. _argv_mutants returns None when the flag is
#      absent, so a run relying on the script's default mutant list fails.
#   2. THE TREE MUST BE CLEAN. .praxia/audits.jsonl is TRACKED and is appended to
#      by anything running pytest, so a gate run leaves every later vehicle run
#      recording git_dirty = true until it is restored.
#   3. THE WEIGHTS KEY MUST BE THE STABLE IDENTIFIER, not an absolute path.
#      scripts/parity/artifact_key.py derives it; controls written before
#      6cb81d49 carry absolute paths and will never validate.
#   4. A POSITIVE CONTROL MUST NOT RIDE ALONG ON A GRADED RUN. _argv_mutants
#      reads the RAW --mutants string, so laser_proofread_parity's
#      scalar_both_off lands in `listed` even though the script excludes it
#      from n_listed, n_failed and the controls mutants dict. It has no
#      manifest row (it must PASS, and every manifest row must report
#      "failed"), so listed != row_ids and the run is ineligible. Run the
#      positive control as its own separate invocation.
#   5. THE ID BELOW MUST BE THE FULL UUID. default_resolve_run stats
#      run_<id>.parquet by exact filename, so the 8-char prefix that every log
#      line and bth listing prints does not resolve. verify_wave.py globs the
#      prefix and prints the full id rather than blaming the catalog.
#
# AND ONE SCHEDULING CONSTRAINT that is not a per-run trap: _touches_scoped is
# GLOBAL, not per-slug, so ONE commit under src/aminx/ (or scripts/parity/,
# scripts/recapture/, tests/port/, aminx-oracles/, pyproject.toml, uv.lock)
# invalidates EVERY row in this file at once. Ledger rows cannot be collected
# incrementally: the whole vehicle wave runs after the last such commit.

