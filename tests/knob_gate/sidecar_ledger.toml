# T0.4 shipped no rows. Owning tasks record [sidecar.<slug>] after the vehicle run.
#
# Every id below is a bathos run that was verified against the step 1c conditions
# BEFORE being written here: outcome == 'pass', status 'completed', git_dirty
# FALSE, git_hash an ancestor of HEAD, sidecar_sha256 matching the sidecar on
# disk, and --output-paths containing /<slug>/<git sha8>/branch_controls.json.
#
# Two traps cost real time here and are worth stating, because both produce runs
# that look entirely successful and fail step 1c for reasons unrelated to the
# measurement:
#   1. --mutants must be PRESENT IN ARGV. _argv_mutants returns None when the
#      flag is absent, so a run that relies on the script's default mutant list
#      fails outright. Three Potts vehicles passed this way and had to be re-run.
#   2. The tree must be CLEAN. .praxia/audits.jsonl is TRACKED and is appended to
#      by anything that runs pytest, so a gate run leaves the tree dirty and every
#      vehicle run after it records git_dirty = true until it is restored.

