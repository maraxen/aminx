# T0.4 shipped no rows. Each stage task appends its own [[branch]] entries.
#
# For a sidecar-backed vehicle the row `id` MUST equal the mutant name:
# _coverage.py:427 collects sidecar_ids[slug] from the `id` field, and :309
# requires that set to equal _argv_mutants(run.argv). So a row whose id differs
# from the mutant it names silently fails step 1c with no other symptom.
#
# A row only grades once its vehicle has a run that is outcome == 'pass',
# status 'completed', NOT git_dirty, at a commit that is an ancestor of HEAD and
# does not touch scoped paths, whose sidecar_sha256 still matches the sidecar on
# disk, and whose --output-paths include /<slug>/<git sha8>/branch_controls.json.

