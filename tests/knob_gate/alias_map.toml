# Alias map for tests/knob_gate/reference_surfaces.py (spec 6.3/6.4).
# One row per reference field; test_rows_bijective enforces the bijection.
# Every row carries its own evidence in `note` -- spec section, upstream
# file:line, or the generated reference_surfaces.py comment it rests on.
#
# The header used to say "parity_test_ids are still empty for every live row;
# the Potts knob_semantics suite does not exist yet". Both halves are stale as
# of 261003: the suite exists and `unwired` measures 0 of 212 live rows.
#
# TWO OPTIONAL MARKERS, ADDED 261003, EACH DOING EXACTLY ONE JOB. They are
# orthogonal and a row may carry both, which is why they are not one enum --
# emit_dense_hJ is aminx-only AND inert.
#
#   upstream = false   This field has no upstream analogue, so no reference
#                      surface names it. Exempts the row from
#                      test_rows_bijective's `== REF_F` and from the
#                      superset hypothesis (there is no upstream side to map
#                      from). The ref must be spelled `__aminx_only__<field>`
#                      and must not collide with a real reference field.
#                      Default: true.
#
#   kind = "inert"     This knob reaches nothing, so it has no semantics to
#                      pin and a test_knob_semantics_ test would be a false
#                      claim. Coverage is instead satisfied by a
#                      test_knob_inert_ test, which PROVES the inertness.
#                      Default: "semantics".
#
#                      SAFEGUARDED, so this is not a way to wave a knob
#                      through: every inert target that the gate actually
#                      demands coverage for (i.e. is in NEW_FIELDS) must ALSO
#                      be listed not_plumbed in
#                      tests/lint/options_plumbing_allowlist.toml, and
#                      test_allowlist_has_no_fixed_entries deletes that row
#                      the moment the field becomes plumbed. So the credit
#                      cannot outlive the defect. The defect stays tracked as
#                      debt either way -- the gate is not what tracks defects.

