]
note = """\
eval augment_eps on all backbone atoms; knob test is iid Gaussian N/CA/C/O. \
IMPLEMENTED 261003, closing debt 2442. Until then the bundle was built from \
backbone_noise and consumed nowhere on the Potts path -- measured 261002, the \
energy was identical at 0.02 through 10.0 while displacing the same \
coordinates on disk by 0.02 moved it -- and this row named a tripwire that \
asserted the defect. driver.apply_potts_backbone_noise now implements \
X = X + augment_eps * randn_like(X) per potts_mpnn_utils.py:1169-1171, applied \
after featurize so masks still see clean coordinates as upstream's ordering \
requires. The per-atom shape is the load-bearing half: a (L,1,3) rigid draw is \
REFUSED rather than broadcast, because broadcasting it is LASEr's rule and \
would otherwise pass silently (spec 6.3 names each family's rule as the \
other's negative control)."""

