# --- AMINX-ONLY ROWS, added 261003 (upstream = false). ------------------------
# Two PottsMPNNOptions fields had NO row at all and could not have one: every
# ref must be a reference_surfaces.py field name, and neither `etab` nor
# `dense_hJ` appears anywhere in that file. So `covered` could never contain
# them however many tests existed, and `uncovered` reported them as a coverage
# hole that no test could close. emit_etab in particular was already
# implemented AND already tested and the gate still could not see it.
#
# Reading that list as a test backlog would have generated work that could not
# have closed the blocker, which is the whole reason the two markers exist.

[[row]]
ref = "__aminx_only__emit_etab"
upstream = false
targets = ["emit_etab"]
equivalence = "aminx_extension"
parity_test_ids = ["tests/knob_semantics/test_potts_driver_knobs.py::test_knob_semantics_emit_etab"]
note = "aminx-only: emits the Potts energy table and its neighbour index into the output (sample_host.py:394-400 declares potts_etab / potts_E_idx, :483-486 produces them). Upstream has no analogue -- it writes etab to disk from sample_seqs.py rather than exposing a knob -- so no reference surface names it. NOT inert: read outside options.py, which the plumbing allowlist header calls out explicitly as the contrast case. The existing test_knob_semantics_emit_etab pins both declared shapes (6,6,20,20) and (60,48,20,20), so this row needed only to exist."

[[row]]
ref = "__aminx_only__emit_dense_hJ"
upstream = false
kind = "inert"
targets = ["emit_dense_hJ"]
equivalence = "aminx_extension"
parity_test_ids = ["tests/knob_semantics/test_potts_driver_knobs.py::test_knob_inert_emit_dense_hJ"]
note = "aminx-only AND inert, which is why upstream and kind are separate markers rather than one enum. Declared at run/options.py:33 and read NOWHERE in src/; allowlisted not_plumbed, whose note says it 'is inert all the same'; spec line 638 says it converts host-side only. Covered by test_knob_inert_emit_dense_hJ, which uses emit_etab=True on the same harness as its control -- so 'adds no keys' cannot be confused with a test that cannot detect keys. Credit is tied to the allowlist row and dies with it (debt 2435)."

