# Each decoded residue is readable by later residues only after this step
# writes its sequence embedding, χ RBF and decoder row.
[[entries]]
path = "src/aminx/model/laser/joint_decode.py"
qualname = "_scan_residues"
reason = "sequential_dependency"

# Tied step t reads the shared sequence embedding and each structure's χ RBF
# that step t-1 wrote. Structure 2's χ draw also waits on structure 1's draw
# so the (step, χ, structure) uniform stream stays in upstream order.
[[entries]]
path = "src/aminx/model/laser/tied.py"
qualname = "_scan_tied"
reason = "sequential_dependency"

# ProtonPotts block descent: each block's joint move is conditioned on the sequence the previous block wrote
# (Gauss-Seidel over blocks), and the outer loop repeats sweeps until a sweep changes nothing.
[[entries]]
path = "src/aminx/families/protonpotts_mpnn/ph_descent.py"
qualname = "_sweep_to_convergence"
reason = "sequential_dependency"

[[entries]]
path = "src/aminx/families/protonpotts_mpnn/ph_descent.py"
qualname = "_sweep_to_convergence.sweep"
reason = "sequential_dependency"

# ProtonPotts greedy: each accepted mutation changes the sequence the next step's energies are computed on.
[[entries]]
path = "src/aminx/families/protonpotts_mpnn/ph_greedy.py"
qualname = "greedy_energy_block"
reason = "sequential_dependency"

# ProtonPotts block_zscales: one pass over the independent blocks with no carry. Not a sequential dependency; it
# is a lax.scan only so that one block's V**B joint is live at a time (a vmap would hold all N, and R1 bans vmap).
[[entries]]
path = "src/aminx/families/protonpotts_mpnn/ph_descent.py"
qualname = "block_zscales"
reason = "memory_bounded_map"
