# L-DRV R3 allowlist. Each [[entries]] row permits lax.scan / lax.while_loop /
# lax.fori_loop at one (path, enclosing qualname). reason must be
# "sequential_dependency". Potts AR steps, refine sweeps, and the converge
# while_loop are sequential: each step reads the sequence or hidden state the
# previous step wrote.

