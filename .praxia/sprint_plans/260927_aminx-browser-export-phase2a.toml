- T3b needs T3a (params plus the pre-registration commit).
- T4 needs T2 (helpers, campaign, manifest, `BV_ARTIFACTS`) and T3a/T3b (`ctrl_effect`,
  `min_effect`, and the T3a manifest re-copy).
