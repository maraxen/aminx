[plugin]
name = "aminx"
# cisternal overrides this from the installed distribution version
version = "0.0.0"
description = "JAX ProteinMPNN/LigandMPNN inverse folding -- design, score and inspect protein sequences from structure files"
skills_delivered_by_plugin = true
requires_praxia = false

[plugin.mcp]
command = ["aminx-mcp"]
launch = "uvx"
# The default spec `{name}=={version}` would omit the agent extra.
uvx_from = "aminx[agent]=={version}"

[[plugin.skills]]
name = "using-aminx"
path = "agent_assets/skills/using-aminx/SKILL.md"
description = "Router for aminx: install, MCP tools versus the CLI versus the Python API, checkpoints, and which task skill to load next."
triggers = [
  "aminx",
  "proteinmpnn",
  "ligandmpnn",
  "inverse folding",
  "sequence design",
]

[[plugin.skills]]
name = "aminx-sampling"
path = "agent_assets/skills/aminx-sampling/SKILL.md"
description = "Design sequences with sample: temperature, fixed and tied positions, bias, multi-state design, ligand context, and side files."
triggers = [
  "design sequences",
  "sample sequences",
  "fixed positions",
  "tied positions",
]

[[plugin.skills]]
name = "aminx-scoring"
path = "agent_assets/skills/aminx-scoring/SKILL.md"
description = "Score sequences, inspect conditional and unconditional logits, and compute a Jacobian. Covers shapes, npz keys, and residue trimming."
triggers = [
  "score sequence",
  "logits",
  "pseudo-perplexity",
  "jacobian",
  "conditional probabilities",
]

[[plugin.skills]]
name = "aminx-run-specs"
path = "agent_assets/skills/aminx-run-specs/SKILL.md"
description = "JSON run specs: MCP spec_emit and spec_validate, aminx spec verbs, and fields that cannot serialize. Specs are JSON, not TOML."
triggers = [
  "run spec",
  "spec json",
  "reproducible run",
  "emit spec",
]

[[plugin.skills]]
name = "aminx-campaigns"
path = "agent_assets/skills/aminx-campaigns/SKILL.md"
description = "Campaign plan, worker, run, gates, ramp-plan, and ramp-evaluate, plus cluster use and git provenance fields."
triggers = [
  "campaign",
  "design campaign",
  "sweep",
  "ramp",
]

[[plugin.skills]]
name = "aminx-potts"
path = "agent_assets/skills/aminx-potts/SKILL.md"
description = "Potts emit and run from a GeometryBundle, including k_neighbors and the JSON result fields."
triggers = [
  "potts",
  "coupling",
  "TRW",
]
