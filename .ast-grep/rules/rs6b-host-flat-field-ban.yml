---
id: rs6b-host-flat-field-ban
language: python
severity: error
message: |
  RS-6b Host Migration: Direct flat-field reads of SamplingSpecification-exclusive
  fields in host/ are prohibited.

  After RS-6b, sampling-exclusive fields must be read via run_spec sub-configs:
    - spec.num_samples              → spec.run_spec.sampling.num_samples
    - spec.bias                     → spec.run_spec.sampling.bias
    - spec.fixed_positions          → spec.run_spec.sampling.fixed_positions
    - spec.fixed_tokens             → spec.run_spec.sampling.fixed_tokens
    - spec.use_unified_driver       → spec.run_spec.plan.use_unified_driver
    - spec.compute_pseudo_perplexity → spec.run_spec.sampling.compute_pseudo_perplexity
    - spec.omit_aa                  → spec.run_spec.sampling.omit_aa
    - spec.omit_aa_per_position     → spec.run_spec.sampling.omit_aa_per_position

  NOTE — ast-grep limitation: fields declared on the base RunSpecification
  (backbone_noise, random_seed, fixed_mask, cache_path) and fields shared
  between spec types (temperature, return_logits, return_decoding_orders,
  output_h5_path) CANNOT be syntactically gated here — spec.output_h5_path
  is identical whether the object is a SamplingSpec or a ScoringSpec.
  Only fields exclusive to SamplingSpecification (lines 440-548 of specs.py)
  are safe to ban without false-positives on runner.py and other callers of
  non-sampling spec types.

  See sprint plan 260618_rs6b-host-migration.toml and ADR for details.

files:
  - 'src/aminx/host/**/*.py'

# prep.py contains protein-only flat reads that are intentionally exempt.
ignores:
  - 'src/aminx/host/prep.py'

rule:
  any:
    # Fields declared ONLY in SamplingSpecification (specs.py lines 440-548).
    # These are safe to ban because no other spec subclass declares them,
    # so syntactic matches are guaranteed to be SamplingSpec flat reads.
    - pattern: spec.num_samples
    - pattern: spec.bias
    - pattern: spec.fixed_positions
    - pattern: spec.fixed_tokens
    - pattern: spec.use_unified_driver
    - pattern: spec.compute_pseudo_perplexity
    - pattern: spec.omit_aa
    - pattern: spec.omit_aa_per_position
