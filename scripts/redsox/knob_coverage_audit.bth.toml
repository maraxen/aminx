[metadata]
title = "redsox knob coverage: test debt or decision debt"
created = "261003"
schema_version = "0.3"

[experiment]
hypothesis = """
The gate's `uncovered` blocker (test_knob_superset.py:148-156) is a DECISION backlog, not
a test backlog: every new Options field that no passing test_knob_semantics_* nodeid
reaches is unreached for a structural reason -- the field has no upstream reference field
and so cannot be named by any alias row (NO_REFERENCE_FIELD), or its only naming test is
not prefixed (PREFIX_MISMATCH) -- and ZERO fields are unreached merely because a test was
never written (MISSING_TEST).

This is the claim that decides what to do next, and the two answers are not
interchangeable: MISSING_TEST > 0 is work to be done, while the other mechanisms are
questions only the user can settle, because both remedies (narrowing NEW_FIELDS, or
renaming a test that records a knob as inert so it claims knob semantics) change
pre-registered gate scope.

An exploratory in-conversation probe checked the prefixed-id condition alone and counted 3
unreached fields. It produced no classification and no control, and none of its numbers
are cited anywhere; this is the tracked measurement that replaces it.
"""
stage_name = "confirmation"
novel = false

[outcomes.pass]
condition = "control_detected = true AND n_missing_test = 0 AND n_unreached > 0"
decision = "The gate blocker is entirely structural. Do not open test tasks for it; put the unreached fields to the user as a scope decision."
reasoning = "control_detected proves the classifier can return MISSING_TEST at all, so n_missing_test = 0 is evidence rather than an artefact. n_unreached > 0 is required because a zero there would mean the gate is not blocked on coverage at all, which would make this run answer a question nobody asked -- a different outcome, not a pass."
is_residual = false
adversarial_check = "NOT (control_detected = true AND n_missing_test = 0 AND n_unreached > 0)"

[outcomes.fail]
condition = "control_detected = true AND n_missing_test > 0"
decision = "There IS genuine test debt. Write a test_knob_semantics_* test for each MISSING_TEST field before asking the user anything."
reasoning = "A field with a live alias row, an upstream reference field and no test named at all is reachable by writing one test. That is work, and it must not be escalated to the user as a scope question."
is_residual = true
adversarial_check = "n_missing_test = 0"

[outcomes.inconclusive]
condition = "control_detected != true"
decision = "Discard the counts. Fix the classifier before drawing any conclusion from a zero."
reasoning = "The control injects a synthetic field that IS test debt and requires the label MISSING_TEST, then requires COVERABLE once a prefixed test is named. A classifier failing either direction can report n_missing_test = 0 without that zero meaning anything."
is_residual = true
adversarial_check = "control_detected = true"

[result_schema]
n_new_fields = "int"
n_coverable = "int"
n_unreached = "int"
n_missing_test = "int"
n_no_reference_field = "int"
n_prefix_mismatch = "int"
n_excluded_only = "int"
control_detected = "bool"

[dependencies]
aminx_version = { type = "git_sha", required = true, doc = "aminx commit SHA" }
