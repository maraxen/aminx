[metadata]
title = "protonpotts_ph_greedy wave: the aminx JAX centre-free greedy pH design vs the upstream engine, on replayed uniforms"
created = "261008"
schema_version = "0.3"

[experiment]
hypothesis = """
The aminx port of upstream's `_greedy_energy_block` (src/aminx/families/protonpotts_mpnn/ph_greedy.py, built on the graded
block-descent helpers in ph_descent.py) reproduces the upstream PottsMPNNPHEngine on the sealed P4e merged tables,
against the sealed P4g dump (run cbb47878), for four cells (1BVC, 6m0j binder chain E, 1OLR, 1EL1), both precisions, and
the three greedy calls per cell (T=0; T=0.05 twice) in the centre-free configuration of the dump (center_count 0,
infill_scope chain, block size 3, cv_patience 1, cv_max 2, production forbidden-token list and repetitive-window penalty).

The aminx side is given only what upstream was given (the sealed table and E_idx, the native sequence, the binder mask,
the configuration, and the dump's recorded uniforms, replayed in upstream's CDF token order as the graded block-descent
wave does) and must match, per (cell x precision x call):

  1. the centre-free plan: the designable set, EXACTLY (no pins);
  2. the final (best) sequence token for token, EXACTLY, in float64 and in float32 (the dump measured identical final
     sequences in f32 and f64 for every call, so no f32 slack is registered);
  3. the number of uniforms consumed, EXACTLY;
  4. the final Potts energy of the designed sequence: float64 within 1e-9 relative to max(1, |value|); float32 within 10x
     the measured upstream f32-vs-f64 spread of that design's energy, never below 1e-6 relative.

The dump records no greedy z-scale (upstream's greedy uses a single-mutation scale, not `_block_zscales`), so the scale is
checked through the sequence it determines rather than as a number.

The comparison is an INSTRUMENT only if deliberate errors are rejected by the same comparison (spec §6). Six must be:
uniforms shifted by one draw; block size 2 for 3; the forbidden-token list not applied; the repetitive-window penalty
off; the sampler's CDF in aminx token order instead of upstream's; and a correct energy nudged just outside its float64
band. A control is rejected when the comparison fails on at least one of the control cell's three calls.

PREDICTION, stated before the run so it can be wrong: all 24 comparisons pass exactly and all six controls are rejected.
The risks: the step's block is the improving positions (variable size, sorted by (delta, position)), the best-sequence
tracking and patience/cap termination, the initial canonicalisation of microstates to their parent residue, and the
single-mutation z-scale. A control that does not fire is a finding that the instrument cannot discriminate that error, and
fails the wave rather than being retuned.
"""
stage_name = "confirmation"
novel = false

[outcomes.pass]
condition = "clean = 'pass' AND n_calls = 24 AND n_calls_ok = 24 AND n_plans_ok = 24 AND n_tokens_exact = 24 AND n_draws_ok = 24 AND dump_flags_pass AND n_listed = 6 AND n_failed = n_listed"
decision = "protonpotts_ph_greedy is graded: the aminx centre-free greedy pH design reproduces upstream's plan, sequences, draw counts and energies in both precisions, and each error is rejected."
reasoning = "Every call matches on plan, tokens, draw count and energy; the dump itself passed; and all six controls fail the same comparison."
is_residual = false
adversarial_check = "NOT (clean = 'pass' AND n_calls = 24 AND n_calls_ok = 24 AND n_plans_ok = 24 AND n_tokens_exact = 24 AND n_draws_ok = 24 AND dump_flags_pass AND n_listed = 6 AND n_failed = n_listed)"

[outcomes.fail]
condition = "NOT (clean = 'pass' AND n_calls = 24 AND n_calls_ok = 24 AND n_plans_ok = 24 AND n_tokens_exact = 24 AND n_draws_ok = 24 AND dump_flags_pass AND n_listed = 6 AND n_failed = n_listed)"
decision = "Do not treat the greedy port as graded. Read per_call: a plan miss names the centre-free plan; tokens off with the draw count right names the block selection, the objective or the z-scale; draws off names the step count, patience or cap; an undetected control means the comparison cannot discriminate that error."
reasoning = "Some call differs from upstream, the dump did not pass, or a control was not rejected."
is_residual = true
adversarial_check = "clean = 'pass' AND n_calls = 24 AND n_calls_ok = 24 AND n_plans_ok = 24 AND n_tokens_exact = 24 AND n_draws_ok = 24 AND dump_flags_pass AND n_listed = 6 AND n_failed = n_listed"

[result_schema]
clean = "str"
n_cells = "int"
n_calls = "int"
n_calls_ok = "int"
n_plans_ok = "int"
n_tokens_exact = "int"
n_draws_ok = "int"
n_scores_ok = "int"
dump_flags_pass = "bool"
worst_energy_rel_f64 = "float"
n_listed = "int"
n_failed = "int"
mutants = "dict"
undetected = "list"
per_call = "dict"

[dependencies]
aminx_version = { type = "git_sha", required = true, doc = "aminx commit SHA" }

[data]
oracle = "P4g pH-design dump (run cbb47878): upstream PottsMPNNPHEngine on the sealed P4e tables with an injected-uniform inverse-CDF shim"
inputs = "sealed P4e merged tables and E_idx; the dump's per-cell context arrays"
configuration = "centre-free greedy_energy_block: center_count 0, infill_scope chain, block_size 3, cv_patience 1, cv_max 2, T 0 and 0.05, forbidden HIS-A ASP-A GLU-A UNK, repetitive window weight 1.0 radius 2"
tolerances = "plan, tokens and draw count exact; energy f64 1e-9 relative, f32 10x measured upstream f32-vs-f64 spread (min 1e-6 relative)"

[provenance]
note = "Graded invocation: bth run --project-slug aminx -- uv run --no-sync python scripts/protonpotts/protonpotts_ph_greedy_parity.py --encoder-dir <P4e out dir> --ph-dir <P4g out dir> --features-dir ~/projects/aminx-oracles-protonpotts, in a venv where aminx is importable, from a clean checkout of the commit that adds the script. The sidecar is committed before the script and before any aminx greedy result exists. Not a redsox ledger row (ProtonPotts has none until P10)."
