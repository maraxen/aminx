[metadata]
title = "Does GPU + batched LASEr sampling draw the same distribution as CPU unbatched?"
created = "261006"
schema_version = "0.3"

[experiment]
hypothesis = "The distributional confirm pays ~4.02 s/design because laser_sample_dist_pilot._sample_once draws ONE design per forward pass: it calls output_batch_data with the default num_copies=1 (upstream documents num_copies > 1 as its parallel-design facility, run_inference.py:305) and the oracle venv pins CPU torch. A throwaway spike measured GPU + num_copies=50 at 0.091 s/design, roughly 30-45x. That speedup is only usable if batched sampling draws from the SAME distribution as the unbatched CPU sampler, because batching changes which samples a given seed produces. If GPU-batched draws are distributionally equivalent, the cross total variation against the already-completed CPU reference unit will sit inside the sampling floor that the reference shows against ITSELF at the same sample size; if batching perturbs the distribution, the cross TV will sit above that floor."
stage_name = "diagnosis"
novel = true

[outcomes.batched_equivalent]
condition = "self_test_passed AND refusal IS NULL AND control_fired AND within_floor"
decision = "Record that GPU + num_copies batching is distributionally indistinguishable from the CPU unbatched sampler at this sample size, for the UNSHIMMED arm only, on this structure and cell. This licenses a follow-up proposal to batch the unshimmed arms of the confirm; it does NOT license batching the shimmed arm, which needs a batch-aware injected_uniform_draws cursor and is a separate question. Any change to scripts/parity/ is scoped and rides the post-merge re-wave."
reasoning = "Two independent draws from one distribution do not give TV = 0, they give the sampling floor at that n. A cross-TV at or below the 97.5th percentile of the reference-against-itself TV is inside the noise this many samples can resolve, so it is not evidence of a different distribution. The control firing is what makes that statement meaningful rather than a statement about a blunt metric."
is_residual = false
adversarial_check = "NOT (self_test_passed AND refusal IS NULL AND control_fired AND within_floor)"

[outcomes.batched_not_equivalent]
condition = "self_test_passed AND refusal IS NULL AND control_fired AND NOT within_floor"
decision = "Do NOT batch the confirm. Report the cross TV and the floor so the size of the discrepancy is on the record, and treat the ~30-45x spike number as unusable for the confirm until the cause is found. The confirm continues unbatched."
reasoning = "A sampler that is faster and draws a different distribution is a defect, not a speedup, and the confirm's entire purpose is to measure a distribution. Speed cannot buy a wrong answer."
is_residual = false
adversarial_check = "NOT (self_test_passed AND refusal IS NULL AND control_fired AND NOT within_floor)"

[outcomes.control_did_not_fire]
condition = "self_test_passed AND refusal IS NULL AND NOT control_fired"
decision = "No conclusion about equivalence. A deliberately-different draw (the same sampler at control_temperature_scale x the cell temperature) failed to separate from the floor on REAL data, so this instrument cannot distinguish distributions on this structure at this sample size. Raise n or the control separation and re-run; do not report equivalence."
reasoning = "A metric too blunt to detect a distribution it is TOLD is different would report equivalence for anything, including a broken sampler. The synthetic self-test checks the metric in principle; this checks it on the actual structure, sample size and alphabet occupancy of the real comparison, where it could still be underpowered."
is_residual = true
adversarial_check = "NOT self_test_passed OR refusal IS NOT NULL OR control_fired"

[outcomes.cuda_unavailable]
condition = "self_test_passed AND refusal IS NOT DISTINCT FROM 'cuda_unavailable'"
decision = "No conclusion. Re-run where the requested CUDA device resolves."
reasoning = "A cuda request that silently fell back to CPU would compare the CPU sampler against itself and return a reassuring verdict about a question that was never asked. Refusing is the only safe behaviour."
is_residual = true
adversarial_check = "NOT self_test_passed OR refusal IS DISTINCT FROM 'cuda_unavailable'"

[outcomes.reference_absent]
condition = "self_test_passed AND refusal IS NOT DISTINCT FROM 'reference_absent'"
decision = "No conclusion. Re-run where the completed U2 unit JSON resolves."
reasoning = "A missing reference is an environment fact and must not be reported as agreement."
is_residual = true
adversarial_check = "NOT self_test_passed OR refusal IS DISTINCT FROM 'reference_absent'"

[outcomes.instrument_unverified]
condition = "NOT self_test_passed"
decision = "Discard every number from this run. Fix the instrument and re-run."
reasoning = "Ten synthetic checks run before any real sample is read. The decisive pair is a NEGATIVE control (two draws from one distribution must sit INSIDE the floor, or the metric false-alarms and would call a correct sampler broken) and a POSITIVE control (two genuinely different distributions must sit ABOVE it, or the metric is blind and would call a broken sampler correct). Neither alone is sufficient; a check that can only pass is not a check."
is_residual = true
adversarial_check = "self_test_passed"

[result_schema]
verdict = "str"
refusal = "str"
self_test_passed = "bool"
self_test_n_checks = "int"
self_test_failed = "list"
floor_median = "float"
floor_edge_q97_5 = "float"
cross_median = "float"
control_median = "float"
control_fired = "bool"
within_floor = "bool"
n_reference = "int"
n_gpu = "int"
script_sha256 = "str"

[data]
reference = "The already-completed CPU unit U2 from the running distributional confirm: unshimmed, 1000 designs, structure 4jnj-1_prot, T = 1.0, min_p = 0, at /home/solab/projects/laser-confirm-gpu2/units/348b09c3....json. It is reused rather than recomputed: it is a finished artifact of the confirm itself, which is exactly the distribution batching would have to reproduce. The SHIMMED sibling unit (U1) is explicitly refused by the loader."
comparison = "1000 designs drawn GPU-batched with num_copies = 50 at the SAME temperature, min_p, checkpoint and PDB, on an idle GPU so the running confirm is not disturbed."
statistic = "sample_dist_stats.mean_tv -- the confirm's OWN sequence total-variation statistic, over its designed-position mask, at alphabet size 21. Reused rather than reimplemented so the answer is in the units the confirm already grades in."
floor_is_measured_not_assumed = "The floor is the TV the reference shows against ITSELF over 200 random disjoint 500/500 splits. Its 97.5th percentile is the pre-registered upper edge. Both sides of every comparison are resampled to the SAME size, because TV is biased upward at small n and comparing a 1000-vs-1000 number against a 500-vs-500 floor would manufacture a difference out of sample size alone."
negative_control_required_to_fire = "A second GPU batch drawn at control_temperature_scale (default 1.5) x the cell temperature must land ABOVE the floor edge. This is a real-data power check, distinct from the synthetic self-test: it establishes that the metric can separate distributions at THIS structure, sample size and alphabet occupancy. If it does not fire the run reports no conclusion."
what_is_deliberately_not_measured = "The SHIMMED arm (U1). injected_uniform_draws expects a (1, _DRAWS_PER_RESIDUE * length) stream and asserts the cursor consumed exactly that many draws; batching needs a (copies, ...) stream and a batch-aware cursor. That is real implementation work and a separate question, and nothing in this run licenses running a shimmed arm batched. Also not measured: chi1 distributional equivalence beyond recording that chi1 bins were produced, and equivalence on structures other than the one reference unit available."
instrument_self_test = "10 checks on synthetic multinomials before any real sample is read: self-distance exactly zero, a NEGATIVE control (two draws from one Dirichlet distribution must sit inside the floor), a POSITIVE control (draws from a visibly different Dirichlet must sit above it), symmetry of the metric, mask-is-honoured, and five grader controls proving every verdict is reachable."
why_it_does_not_disturb_the_confirm = "The confirm is CPU-bound (two workers at ~8 cores each on a 20-core box, load 22.4) and its GPUs sit at 0% utilisation. This run uses an idle GPU and ~2000 designs total, a few minutes of wall clock. It reads a completed unit file and writes nothing into the confirm's work directory."

[dependencies]
aminx_version = { type = "git_sha", required = true, doc = "aminx commit SHA" }

[provenance]
note = "Prompted by a throwaway timing spike that measured GPU + num_copies=50 at ~30-45x. That spike produced an ANSWER, not a finding, and its numbers are not cited as findings here; this run is the pre-registered instrument for the decision-bearing question the spike could not answer. Lives in scripts/analysis/, outside _SCOPED_PREFIXES (verified at tests/knob_gate/_coverage.py:21-28), so it costs the frozen ledger nothing. NOT a redsox vehicle; no manifest row. It amends no file, changes no tolerance, and proposes no band."
invocation = "bth run --project-slug aminx -- <spike-venv-python> scripts/analysis/laser_batch_equivalence.py --reference-unit <U2 unit json> --laser-root <dir> --checkpoint <pt> --pdb <pdb> --device cuda:2 --out <json>"

[resume]
unit = "none -- two 1000-design GPU draws, a few minutes total; a re-run redraws from the recorded seed"
max_attempts = 2
