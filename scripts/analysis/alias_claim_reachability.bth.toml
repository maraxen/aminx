[metadata]
title = "Are the alias map's equivalence claims reachable in the implementation?"
created = "261002"
schema_version = "0.3"

[experiment]
hypothesis = "alias_map.toml records, for each upstream knob, the aminx field it corresponds to, and test_parity_ids_passed enshrines those claims by requiring each live row to name a passing test; a row whose target field is never read by the family it is mapped from asserts a correspondence the code does not make, so the knob is accepted and silently ignored. ONE INSTANCE IS ALREADY KNOWN, found by hand before this probe was written and declared here so it cannot be mistaken for a prediction: the seven backbone_noise / bb_noise rows map to `noise` and the LASEr path never reads it (aminx debt 2434); `noise` IS read elsewhere in src/aminx (utils/coordinates.py:44), so it is an instance of question B, not question A. The open question this probe exists to settle is whether that is isolated or a pattern and what the complete list is, and the prediction is that question A finds NOTHING -- every target field exists somewhere, since the fields were taken from real dataclasses -- while question B finds `noise` plus an unknown number of others."
stage_name = "diagnosis"
novel = true

[outcomes.no_unreachable]
condition = "n_unreachable = 0 AND n_outside_family = 0"
decision = "Treat every live alias row's target as reachable and stop looking for this defect class. Re-open only if debt 2434's own row set is shown to be a false negative of this probe, which would mean the ast walk credits a read that does not exist."
reasoning = "Both questions clean means no live row maps to a field the implementation never reads, and no single-family non-runner knob is handled only by the generic path."
is_residual = false
adversarial_check = "noise must NOT appear clean: it is a confirmed instance of question B, so this outcome firing is evidence the probe is broken rather than evidence the codebase is sound."

[outcomes.unreachable_targets]
condition = "n_unreachable > 0 AND n_outside_family = 0"
decision = "File each unreachable target as debt and correct or exclude its alias rows before the gate enshrines them. A target no file reads is an unsupported claim with no judgement needed."
reasoning = "Zero reads anywhere under src/aminx means the alias row names a field the implementation does not consume at all."
is_residual = false
adversarial_check = "Confirm each hit by reading the named rows' target against the dataclass and by grep, since an ast walk that failed to parse a file would under-count reads and manufacture this outcome."

[outcomes.family_knob_handled_generically]
condition = "n_unreachable = 0 AND n_outside_family > 0"
decision = "Review each hit against the spec: a family whose upstream rule differs from the generic one (LASEr noise is the known case) needs its own stage, and until it has one the alias row's claim is unsupported. File debt per family-specific rule, not per row."
reasoning = "The field is consumed somewhere, so the claim is not vacuous, but not by the family it is mapped from -- which is exactly the shape of the confirmed noise defect."
is_residual = false
adversarial_check = "For each hit, confirm the field is genuinely family-specific rather than a runner knob the exclusion list missed; the list is recorded in the payload precisely so this can be checked and the probe re-run against a corrected one."

[outcomes.both]
condition = "n_unreachable > 0 AND n_outside_family > 0"
decision = "Apply both decisions above, handling the unreachable set first since it needs no judgement."
reasoning = "Independent defect classes; neither masks the other."
is_residual = false
adversarial_check = "As for each outcome separately."

[result_schema]
outcome = "str, one of no_unreachable / unreachable_targets / family_knob_handled_generically / both"
n_rows = "int, total alias_map rows"
n_live_rows = "int, rows whose equivalence is not exclusion"
n_target_fields = "int, distinct target fields named by live rows"
n_unreachable = "int, question A hits"
n_outside_family = "int, question B hits"
unreachable = "dict, target field -> families whose rows map to it"
unreachable_rows = "dict, target field -> the refs asserting it"
outside_family = "dict, target field -> {family, rows}"
runner_knobs_excluded_from_question_b = "list, the judgement call recorded verbatim so it can be audited"

[dependencies]
inputs = ["tests/knob_gate/alias_map.toml", "src/aminx/**/*.py"]

[data]
method = "For every live row, attribute its targets to the family of its reference surface (laser_ -> laser, potts_/pottsmpnn_ -> potts). Question A: is the target read anywhere under src/aminx? Question B: for a field mapped from exactly one family, is it read inside that family's own subtree (families/<f>_mpnn, model/<f>, potts/)?"
why_ast_not_grep = "Reads are collected by an ast walk over Name / Attribute / keyword / arg nodes. A substring grep for `noise` matches any file saying backbone_noise_mode or naming it in a docstring, which would credit the exact claim under test to code that never consumes the field."
why_two_questions = "Only question A is mechanical. Runner-level knobs (paths, batching, seeds, checkpoint resolution) are resolved by the host before a driver runs, so living outside a family subtree is correct for them; they are excluded from B through an explicit list, and not from A."
known_instance = "noise, 7 rows: laser_run_inference__backbone_noise, laser_run_inference_ligandmpnn__backbone_noise, laser_run_inference_tied__backbone_noise, and four *_sample_model__bb_noise -- aminx debt 2434"
upstream_rule_for_noise = "pdb_dataset.py:412-415 -- when bb_noise > 0, round coords to 2 decimals then add one randn((N,1,3)) per residue shared by all 5 backbone atoms. aminx's only noise is iid per atom (utils/coordinates.py:44), which is the negative control spec 6.3 says must FAIL for LASEr."
limitation = "A field read inside its family subtree is credited as handled without checking the handling is CORRECT. This probe can show a claim is unsupported; it can never show one is sound."
freeze_safety = "scripts/analysis/ is not in _SCOPED_PREFIXES, so this does not invalidate the running sidecar ledger wave."
first_sidecar_was_invalid = "The first version of this file omitted the required [experiment] section, so bth refused it and the script NEVER RAN (exit 1, run_id empty). This rewrite is therefore still a pre-registration, not a receipt."

[provenance]
task_id = "260929_potts-laser-xtrax-compose"

[resume]
strategy = "none -- a single ast pass over one repo, seconds, nothing to checkpoint"
