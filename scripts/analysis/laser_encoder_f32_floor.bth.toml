[metadata]
title = "LASEr float32 parity floor for the laser_encoder wave"
created = "261006"
schema_version = "0.3"

[experiment]
hypothesis = "The laser_encoder port wave fails its float32 band (rtol=1e-4, atol=1e-7) on every (checkpoint, fixture) pair while passing the ~1e4x tighter f64 band (rtol=1e-8, atol=1e-11) on every pair; so the disagreement is float32 accumulation rather than an algorithmic defect, and a band derived by moving ONLY the term the measurement shows to bind -- atol to ceil_one_significant_figure(10 * measured absolute floor), or rtol to ceil_one_significant_figure(10 * relative floor conditioned on |ref| > 0.1) -- will admit every element of every float field of every pair while still rejecting an injected 1e-2 relative defect with a 10x margin."
stage_name = "diagnosis"
novel = false

[outcomes.pass]
condition = "self_test_passed AND f64_passes AND f32_violated AND all_admitted AND control_rejected AND below_control_scale"
decision = "Propose amending [parity] tolerance_policy_f32 and [tolerance_basis] f32_atol_basis in tests/port/targets/laser_encoder.toml to the band this run derives, moving ONLY the binding term and citing this run. tests/port/ is a scoped path under the freeze, so the amendment lands in the single post-merge re-wave, never on its own."
reasoning = "f64 passing at 1e-8 while f32 fails at 1e-4 localises the disagreement to float32 accumulation: math that agrees to one part in 1e8 in double is not computing a different function. Admitting every element at the proposed band shows the band is a floor over the population the tier actually asserts on, not a fit to the single worst element. Rejecting a 1e-2 relative defect, with the proposed band at least 10x below that defect's absolute size, shows the widened band still has teeth."
is_residual = false
adversarial_check = "NOT (self_test_passed AND f64_passes AND f32_violated AND all_admitted AND control_rejected AND below_control_scale)"

[outcomes.defect_not_tolerance]
condition = "self_test_passed AND NOT f64_passes"
decision = "Do NOT touch any tolerance. Escalate: the f64 tier is also failing, so the port disagrees with upstream for a reason float32 does not explain. Fix the port."
reasoning = "This is the outcome that stops a real defect being laundered into a tolerance, and it is why f64 is RE-MEASURED here rather than assumed. It is a live possible result, not a formality: the belief that laser_encoder's f64 tier is green comes from a pytest run in a different tree than this measurement."
is_residual = true
adversarial_check = "NOT self_test_passed OR f64_passes"

[outcomes.tolerance_was_fine]
condition = "self_test_passed AND f64_passes AND NOT f32_violated"
decision = "Do NOT change the tolerance. The wave's f32 tier went red for something other than the numeric band -- a tier-1 dtype or shape mismatch, or one of the four _EXACT index/edge fields. Go read the failures and find it."
reasoning = "If no element is outside atol + rtol*|ref| then the band is not what failed, and widening it would be both unjustified and leave the real failure in place. This outcome is genuinely reachable: the premise comes from a wave-level pytest result, and test_laser_encoder._run also compares four _EXACT fields (pr_pr_idx, lig_pr_idx, sequence_indices, chain_mask) by exact equality, which no tolerance governs."
is_residual = true
adversarial_check = "NOT self_test_passed OR NOT f64_passes OR f32_violated"

[outcomes.noise_reaches_defect_scale]
condition = "self_test_passed AND f64_passes AND f32_violated AND NOT below_control_scale"
decision = "Escalate. Do NOT widen. float32 noise in this wave is within 10x of a defect worth catching, which is a numerical-stability question about the port, not a test-tolerance question."
reasoning = "A proposed band within 10x of a 1e-2 relative defect cannot separate accumulation noise from a real error, so widening there deletes the assertion's value instead of calibrating it."
is_residual = true
adversarial_check = "NOT self_test_passed OR NOT f64_passes OR NOT f32_violated OR below_control_scale"

[outcomes.instrument_unverified]
condition = "NOT self_test_passed"
decision = "Discard every number from this run. Fix the instrument and re-run."
reasoning = "29 synthetic checks run before any oracle is touched: 22 from the shared instrument (including its two grader negative controls) and 7 from this driver. If any fails, the instrument is not known to be able to return a non-pass, and a floor measured by such an instrument is worthless."
is_residual = true
adversarial_check = "self_test_passed"

[outcomes.oracle_absent]
condition = "self_test_passed AND oracle_absent != []"
decision = "No conclusion. Re-run where the sealed dumps resolve."
reasoning = "The dumps live outside the tree and are checked by oracle_manifest.toml; their absence is an environment fact and must not be reported as a measurement. This wave has already produced one false 'defect' from an environment gap (a dropped AMINX_PORT_WAVE made the oracle fixture resolve to port_selftest and 126 tier-1 tests fail with a confident AttributeError in 14 seconds)."
is_residual = true
adversarial_check = "NOT self_test_passed OR oracle_absent == []"

[outcomes.fail]
condition = "self_test_passed AND f64_passes AND f32_violated AND below_control_scale AND NOT (all_admitted AND control_rejected)"
decision = "Do not change the tolerance. The derivation rule did not produce a usable band."
reasoning = "Either an element falls outside a band derived with 10x headroom over the measured floor -- meaning one maximum does not characterise the population -- or the injected defect was admitted, meaning the band is too wide to test anything. Both say the rule failed, not that the band should move anyway."
is_residual = true
adversarial_check = "NOT self_test_passed OR NOT f64_passes OR NOT f32_violated OR NOT below_control_scale OR (all_admitted AND control_rejected)"

[result_schema]
verdict = "str"
