[metadata]
title = "laser_layers float32 parity floor, measured under BOTH the element-wise and the scale-relative rule"
created = "261006"
schema_version = "0.3"

[experiment]
hypothesis = "For laser_layers at tier 3, the CURRENT element-wise band (atol=1e-6 + rtol=1e-5*|ref|) is violated on every pair, and at least one of two candidate rules has a measured floor far enough below a 1e-2 relative defect that a band derived as ceil_one_significant_figure(10 * floor) clears a 10x margin. The two candidates are (a) the SAME element-wise rule with rtol held at 1e-5 and atol re-derived from measurement, and (b) the per-(field, pair) SCALE-RELATIVE rule max|got-ref| <= tol * max|ref| that the user chose for laser_score on 261006. Both are measured in one pass over the same statistics. The run reports which clear the margin; it does NOT pick one, and it does NOT move any band."
stage_name = "diagnosis"
novel = true

[outcomes.elementwise_suffices]
condition = "self_test_passed AND oracle_absent == [] AND f64_passes AND f32_violated_elementwise AND degenerate_fields == [] AND elementwise_clears_margin"
decision = "Report the measured atol to the user as a same-FORM amendment to tests/port/targets/laser_layers.toml and tests/port/test_laser_layers.py::_ATOL['f32']. This is the cheap outcome and the one the target file already authorised in advance: its f32_atol_basis says 'If the f32 tier shows a deviation above this bound, measure it and amend separately rather than widening this value', and a measured atol at a cleared 10x margin is exactly that -- a measurement, not a widening. NO user decision is required on the rule's FORM, because the form does not change. Still do NOT edit either file on the strength of this run alone: tests/port/ is a _touches_scoped path, so the amendment lands in the post-merge re-wave with A1, not on its own."
reasoning = "laser_score needed a rule change because its worst violations sat on near-zero elements, which makes atol bind and collapses the margin. That is a property of laser_score's magnitudes, not a general fact about LASEr f32. laser_layers is only ~4x over its atol (3.933907e-06 observed against 1e-06), so the element-wise rule may well still separate noise from a 1e-2 defect here. Measuring both rules in one pass is what stops the laser_score precedent being applied by analogy instead of by evidence."
is_residual = false
adversarial_check = "NOT (self_test_passed AND oracle_absent == [] AND f64_passes AND f32_violated_elementwise AND degenerate_fields == [] AND elementwise_clears_margin)"

[outcomes.scale_relative_needed]
condition = "self_test_passed AND oracle_absent == [] AND f64_passes AND f32_violated_elementwise AND degenerate_fields == [] AND NOT elementwise_clears_margin AND below_control_scale AND loo_all_admitted AND control_rejected"
decision = "Report BOTH numbers to the user and escalate the FORM question, exactly as laser_score's was escalated on 261003 and decided on 261006. Do NOT adopt the scale-relative rule unilaterally: changing the form of an assertion is the user's call, and the 261003 decision doc explicitly recorded that moving every LASEr f32 tier to the scale-relative rule 'is a larger change than this wave needs'. Supply the band option 3 would use here, and say plainly that the element-wise rule could not clear the margin."
reasoning = "This is the laser_score finding reproduced on a second wave, which would be new information: it would mean the near-zero-element problem is not peculiar to laser_score and the house element-wise pairing is structurally unsuited to this family. That is a bigger claim than one wave's band and must reach the user rather than being absorbed into a quiet amendment."
is_residual = false
adversarial_check = "NOT (self_test_passed AND oracle_absent == [] AND f64_passes AND f32_violated_elementwise AND degenerate_fields == [] AND NOT elementwise_clears_margin AND below_control_scale AND loo_all_admitted AND control_rejected)"

[outcomes.defect_not_tolerance]
condition = "self_test_passed AND oracle_absent == [] AND NOT f64_passes"
decision = "Do NOT touch any tolerance and do NOT report a band. Escalate: the f64 tier is also failing, so the port disagrees with upstream for a reason float32 does not explain. Fix the port."
reasoning = "Re-measuring f64 in THIS tree rather than inheriting it is what stops a real defect being laundered into a tolerance change. A floor measured over a defect describes the defect. Not a formality: f64 is believed green from graded run 0f08f15a, but that ran at 6ab1bc62 and this run will not."
is_residual = true
adversarial_check = "NOT self_test_passed OR oracle_absent != [] OR f64_passes"

[outcomes.elementwise_was_fine]
condition = "self_test_passed AND oracle_absent == [] AND f64_passes AND NOT f32_violated_elementwise"
decision = "Do NOT change anything. The element-wise band is not violated in this tree, so there is nothing for an amendment to fix, and the 63 tier-3 failures in run 0f08f15a came from something other than the band. Go read that run's junit XML again."
reasoning = "This run's whole premise is that the current band is violated. The premise was established at 6ab1bc62 on a worktree whose venv had just changed (prody added); re-checking it here costs nothing and an unverified premise would let this run propose a band for a problem that no longer exists."
is_residual = true
adversarial_check = "NOT self_test_passed OR oracle_absent != [] OR NOT f64_passes OR f32_violated_elementwise"

[outcomes.noise_reaches_defect_scale]
condition = "self_test_passed AND oracle_absent == [] AND f64_passes AND f32_violated_elementwise AND degenerate_fields == [] AND NOT elementwise_clears_margin AND NOT below_control_scale"
decision = "Escalate. Adopt NEITHER rule. If both the element-wise and the scale-relative floor are within 10x of a 1e-2 defect, the problem is numerical stability in the port, not the shape of the band, and no band can be justified on this wave."
reasoning = "This is the outcome that stops either amendment being a dressed-up widening. It is the same outcome e47bfaab returned for laser_score under the element-wise rule, and it must remain reachable for both rules here or the run cannot fail."
is_residual = true
adversarial_check = "NOT self_test_passed OR oracle_absent != [] OR NOT f64_passes OR NOT f32_violated_elementwise OR degenerate_fields != [] OR elementwise_clears_margin OR below_control_scale"

[outcomes.scale_is_degenerate]
condition = "self_test_passed AND oracle_absent == [] AND f64_passes AND degenerate_fields != []"
decision = "Do NOT adopt the scale-relative rule for the degenerate fields, and report them by name. A field whose max|ref| over a pair is at or near zero has no scale to be relative to; dividing by it reproduces, in a new place, the near-zero denominator problem that made atol bind under the element-wise rule."
reasoning = "The scale-relative rule's own version of the failure it is meant to cure. It must be a declared outcome rather than something noticed while reading results. Threshold fixed here before the run: a (pair, field) is degenerate when its max|ref| is <= 1e-6 of the largest field scale in that pair. This outcome deliberately OUTRANKS elementwise_suffices in the grader, so a degenerate scale cannot be hidden by the cheap rule happening to work."
is_residual = true
adversarial_check = "NOT self_test_passed OR oracle_absent != [] OR NOT f64_passes OR degenerate_fields == []"

[outcomes.band_does_not_generalise]
condition = "self_test_passed AND oracle_absent == [] AND f64_passes AND f32_violated_elementwise AND degenerate_fields == [] AND NOT elementwise_clears_margin AND below_control_scale AND NOT loo_all_admitted"
decision = "Do NOT adopt the scale-relative band. One pair's maximum does not characterise the population, so a band derived from the observed worst case is a fit to it."
reasoning = "Under a single scale-relative statistic, admitting the same pairs the floor was derived from is TRUE BY CONSTRUCTION -- the floor is the maximum of exactly the quantity admission tests -- so plain all_admitted is not a check and is deliberately not an outcome term. Leave-one-out is the version that can fail: derive from 62 pairs, admit the 63rd, for all 63 choices."
is_residual = true
adversarial_check = "NOT self_test_passed OR oracle_absent != [] OR NOT f64_passes OR NOT f32_violated_elementwise OR degenerate_fields != [] OR elementwise_clears_margin OR NOT below_control_scale OR loo_all_admitted"

[outcomes.instrument_unverified]
condition = "NOT self_test_passed"
decision = "Discard every number from this run. Fix the instrument and re-run."
reasoning = "The synthetic checks include EIGHT negative controls on the grader that force it to refuse -- an f64 violation must grade defect_not_tolerance, a clean element-wise f32 must grade elementwise_was_fine, a planted outlier must grade band_does_not_generalise, a zero-scale field must grade scale_is_degenerate, a noise-at-defect-scale case must grade noise_reaches_defect_scale, and two precedence checks confirm that a degenerate scale and an f64 defect each OUTRANK the cheap elementwise_suffices verdict -- plus a leave-one-out that must refuse a planted outlier. If any check fails the instrument is not known to be able to return a non-pass, and a floor from such an instrument is the #2432 revision-1 failure repeated."
is_residual = true
adversarial_check = "self_test_passed"

[outcomes.oracle_absent]
condition = "self_test_passed AND oracle_absent != []"
decision = "No conclusion. Re-run where the sealed dumps resolve."
reasoning = "The dumps live outside the tree and are checked against oracle_manifest.toml; their absence is an environment fact and must not be reported as a measurement."
is_residual = true
adversarial_check = "NOT self_test_passed OR oracle_absent == []"

[outcomes.fail]
condition = "self_test_passed AND oracle_absent == [] AND f64_passes AND f32_violated_elementwise AND degenerate_fields == [] AND NOT elementwise_clears_margin AND below_control_scale AND loo_all_admitted AND NOT control_rejected"
decision = "Do not adopt the band. The derivation produced a band that admits the injected defect."
reasoning = "A band that stays 10x below the defect's scale-relative size but still admits the defect when it is actually injected means the admission arithmetic and the margin arithmetic disagree, which is an instrument fault surfacing as a result. Report it rather than reconciling it by hand."
is_residual = true
adversarial_check = "NOT self_test_passed OR oracle_absent != [] OR NOT f64_passes OR NOT f32_violated_elementwise OR degenerate_fields != [] OR elementwise_clears_margin OR NOT below_control_scale OR NOT loo_all_admitted OR control_rejected"

[result_schema]
verdict = "str"
self_test_passed = "bool"
self_test_n_checks = "int"
self_test_failed = "list"
oracle_absent = "list"
f64_passes = "bool"
f32_violated_elementwise = "bool"
degenerate_fields = "list"
elementwise_clears_margin = "bool"
proposed_atol_elementwise = "float"
floor_abs_excess = "float"
n_control_admitted_elementwise = "int"
control_band_defect_ratio_elementwise = "float"
below_control_scale = "bool"
control_scale_ratio = "float"
control_rejected = "bool"
floor_scale_relative = "float"
proposed_scale_rel = "float"
second_worst_scale_relative = "float"
floor_pair = "str"
