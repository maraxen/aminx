[experiment]
title = "MS-L fused-vs-single residual: aminx-only minimal reproduction with one-factor-at-a-time arms (sample key, decoding order, batch row, padding)"
campaign = "fixed-position-context"

hypothesis = """
PRE-REGISTRATION, committed BEFORE the graded run (this aminx-side copy is the same script and arms as the tev_design unit whose graded run is 0a276d88; the numbers cited from THIS copy come only from its own run). Follow-up to run 94640a48 (pass): that run graded the fix modes of aminx PR maraxen/aminx#266 on the real
checkpoint; it did not test WHICH factor produces the fused-vs-single probe-logit residual, and the earlier key, batch-row and padding spikes were throwaway and are not citable.
This unit is the citable replacement and the standalone repro: NO external-repo import, NO checkpoint; it needs only an aminx install (>= 0.4.0, with the #266 branch for the
fixed_position_context argument) and numpy. Synthetic random-weight Aminx (weights scaled x4 so the order dependence is visible, a TEST CHOICE, not a model property), one free probe,
fused row of k = 3 identical states against the single row, relative L2 of the centred probe logits, the same statistic as the aminx tests (fused/k vs single).

HYPOTHESIS UNDER TEST. The residual is produced by the decoding order of the fixed positions and by nothing else: not by the sample key outside its role in drawing the order, not by the
batch row, not by padding. Each arm changes ONE factor against a stated control, on three geometries (coordinate seeds 5, 6, 7).

ARMS (R = residual, k = 3, probe = position 7 of 16):
 A1 control: random_order, single key 0, fused key 1 (what two campaign rows have). Predicted R > 1e-3 on at least 2 of 3 geometries.
 A2 pin the key only: random_order, SAME key 0 for single and fused. Predicted R <= 1e-4 (same key => same order, since the order draw does not depend on k).
 A3 pin the order, vary the key: canonical_order, keys 0 and 1. Predicted R <= 1e-4 (key differences outside the order draw do not matter).
 A4 pin the order by seed: random_order with decoding_order_seed = 11, keys 0 and 1. Predicted R <= 1e-4.
 A5 batch row, 4 samples in one call, one key: A5a spread across samples of the probe logits (max relative distance of any sample to sample 0) under random_order is > 1e-3 on at least 2
    of 3 geometries and A5b under canonical_order is <= 1e-4 (the probe is free, so a spread under pinned order would mean the batch row leaks). A5c canonical_order, sample 0 of a 4-sample
    call versus the 1-sample call with the same key: <= 1e-4 (batch size does not matter under a pinned order). The A5a spread is a within-call quantity reported for this contrast only; it
    is NOT used as a noise floor for any other comparison.
 A6 padding: canonical_order, the 16-position design versus the same design padded with 8 masked positions, same key. Predicted R <= 1e-4 (padding inert). random_order padded vs unpadded
    is reported, not graded (extra fixed positions change the order draw by construction).
 Mode liveness: rel(single@canonical, single@random) > 1e-3 on at least 2 of 3 geometries.

PREDICTIONS (my lean, NOTHING IS RETUNED after seeing values): all of A1 reproduces, A2-A4 remove, A5a>1e-3 with A5b and A5c removed, A6 removed. I am LEAST sure of A6: padded positions
join the k-NN graph unless the mask excludes them everywhere, and production rows are padded (256 vs 214).

CONTROLS (instrument_ok): all logits finite; single-path probe-logit norm > 1e-6 on every geometry; each geometry has exactly one free position; backend, device and aminx version recorded
with version >= 0.4.0 and the aminx module inside the distribution it claims (editable installs checked against the recorded project directory); the three geometries give different
single-path logits (so the arms are not repeating one fixture); and A1 and A2 use the same model weights and bundles, differing only in the fused key.

WHAT THIS CANNOT SAY. A synthetic scaled-weight model on 16 positions; it shows which factor produces the residual THERE, not on the real checkpoint (run 94640a48 covers that, for the
fix modes only) and not for production rows. A pass supports the order of the fixed block as the sole source in this fixture; it does not by itself establish the neighbour-hidden-state
mechanism, which stays a hypothesis. The aminx change is a draft PR.

EXECUTION PROVENANCE. Run on titanix under bathos from the committed script; recorded script sha256 must equal the committed file. aminx commit under test passed via --aminx-commit and
recorded as a CLAIM.
"""

[outcomes.pass]
condition = "instrument_ok = true AND reproduces_control = true AND modes_are_live = true AND key_alone_removes = true AND pinned_order_removes = true AND seed_removes = true AND batch_spread_is_order_induced = true AND batch_size_inert = true AND padding_inert = true"
decision = """In this fixture the residual is produced by the decoding order of the fixed positions and by none of: the sample key outside the order draw, the batch row, padding. Next: confirm on production-shaped (padded) real-checkpoint rows; the mechanism stays a hypothesis."""
reasoning = """Each arm changes one factor against a control on three geometries; every removal arm is at or below 1e-4 while the control exceeds 1e-3."""
is_residual = false

[outcomes.marginal]
condition = "instrument_ok = true AND reproduces_control = true AND modes_are_live = true AND (key_alone_removes = false OR pinned_order_removes = false OR seed_removes = false OR batch_spread_is_order_induced = false OR batch_size_inert = false OR padding_inert = false)"
decision = """The residual reproduces but at least one removal arm leaves it above 1e-4: read the per-arm booleans and max residuals. A failed arm names a factor besides order (key, batch row or padding) that contributes in this fixture; that factor is the next thing to localise. No cause is claimed for it."""
reasoning = """The pre-registered tolerances do not let a partial removal count as either the whole cause or no cause."""
is_residual = false

[outcomes.fail]
condition = "instrument_ok = false OR reproduces_control = false OR modes_are_live = false"
decision = """INSTRUMENT OR PREMISE FAILURE: non-finite or degenerate logits, a geometry with the wrong free-position count, aminx below 0.4.0 or not in its distribution, repeated fixtures, the control not reproducing a residual, or the modes not changing the single-path logits. No verdict on which factor matters. Fix the instrument; do not retune thresholds."""
reasoning = """Residual branch: the exact complement of the pass and marginal branches taken together."""
is_residual = true

