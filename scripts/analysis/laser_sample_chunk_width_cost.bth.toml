[metadata]
title = "Two levers on the ~223 h LASEr confirm: padding to max_length=512, and samples_chunk_size (sizing the confirm)"
created = "261006"
schema_version = "0.3"

[experiment]
hypothesis = "PADDING IS THE LARGER LEVER, added 2026-10-06 after reading host/runner.py:124-205. The confirm sets NO max_length, so it inherits the 512 default, while tests/fixtures/laser/103m_1.pdb spans 154 resolved residues. aminx states the cost model in its own warning text: 'Autoregressive decode cost grows roughly with the square of the padded length', and it already WARNS on exactly this configuration -- a warning the first revision of this script swallowed in its subprocess capture. The square law predicts (512/160)^2 = 10.24x more work than needed. So: per-sample wall time at max_length=160 (ceil(154/32)*32, the value runner.py's own warning suggests) will be at most 0.50x of per-sample wall time at max_length=512 on the same structure at the same n and chunk width; if instead it is within 10%, the square-law cost model in runner.py is wrong for the LASEr path and that is worth knowing on its own. SECOND, SMALLER LEVER: The LASEr distributional confirm is priced at ~223 h, measured at ~88% sampling and ~12% compile on a CPU-only jaxlib. laser_sample_dist_confirm.py:557 sets samples_chunk_size=8, and host/plan.resolve_chunk_size (plan.py:450-454) makes that value win outright -- without it the chunk defaults to the full sample count, which the planner separately accepts at Vmap width 1000 for these structures. So the confirm issues ~125 sequential dispatches of width 8 at n=1000 where its own memory budget permits one. If that serialisation is a material part of the cost, then per-sample wall time at width 32 will be at most 0.70x of per-sample wall time at width 8 on the same structure at the same n, and the ~223 h figure is partly a script constant rather than irreducible compute; if per-sample wall time is within 10% across those widths, the cost is real per-sample compute and only different hardware can reduce it."
stage_name = "diagnosis"
novel = true

[outcomes.pass]
condition = "self_test_passed AND instrument_ok AND verdict == 'dispatch_bound'"
decision = "Do NOT provision GPU hardware yet. Re-time the confirm with samples_chunk_size raised (or unset, letting resolve_chunk_size default to the full count) and re-price it before deciding anything about Engaging. Raising the width also weakens per-chunk failure isolation, so the new width must be chosen against the preemption-safety rule, not maximised."
reasoning = "A >=30% per-sample improvement from widening alone means a measurable fraction of the bill is dispatch overhead that a one-line spec change removes. Buying GPU time to run a serialised workload faster would be paying for hardware to hide a configuration default. The decision this run exists to inform is whether to spend hours provisioning Engaging, and this outcome says: not yet, re-price first."
is_residual = false
adversarial_check = "NOT self_test_passed OR NOT instrument_ok OR verdict != 'dispatch_bound'"

[outcomes.compute_bound]
condition = "self_test_passed AND instrument_ok AND verdict == 'compute_bound'"
decision = "Treat the ~223 h as real compute. The chunk width is not the lever, so leave samples_chunk_size=8 (it buys failure isolation for free) and move the decision to hardware: a CUDA jaxlib plus a 40-way job array on Engaging, against the four prerequisites recorded in the readiness doc."
reasoning = "If a 4x wider vmap does not move per-sample cost, the work is not dispatch-starved and the remaining explanations are the ones this project has not yet separated: a genuinely heavier per-sample computation than Potts (rotamer and chi sampling), or a CPU-bound kernel mix that only a different device changes. This is the outcome that JUSTIFIES the provisioning work rather than deferring it, which is why it is graded rather than treated as a null."
is_residual = true
adversarial_check = "NOT self_test_passed OR NOT instrument_ok OR verdict != 'compute_bound'"

[outcomes.inconclusive]
condition = "self_test_passed AND instrument_ok AND verdict == 'inconclusive'"
decision = "No decision. The widen ratio landed between 0.70 and 0.90, so widening helps some but not enough to redirect the plan. Record the number and decide the Engaging question on the other evidence; do not re-run at more widths hoping to cross a threshold."
reasoning = "A 10-30% effect is real but too small to either justify re-pricing the whole confirm or to rule out hardware. Declaring a direction from it would be reading a decision into a band that was pre-registered as undecided. The explicit instruction not to re-run is here because sweeping more widths after seeing a near-miss is how a pre-registered band becomes a fitted one."
is_residual = true
adversarial_check = "NOT self_test_passed OR NOT instrument_ok OR verdict != 'inconclusive'"

[outcomes.instrument_unverified]
condition = "NOT self_test_passed OR NOT instrument_ok"
decision = "Discard every timing number from this run. Diagnose the instrument before re-running, and do not cite the widen ratio for any purpose."
reasoning = "Three controls must all fire. The LOAD-STABILITY control is a DISCLOSED AMENDMENT, added 2026-10-06 before any graded number existed: titanix is a shared host, and it was observed at load 17.47 on 20 cores while another session ran a 125-thread staging job. A ratio measured across configurations that ran under materially different CPU contention is not a measurement of chunk width -- and contention that DRIFTS monotonically between two adjacent configurations manufactures a ratio in whichever direction it drifts. So every unit records the 1-minute load average before and after its timed call, and the graded units' max/min spread must be <= 1.50. The amendment can only cause a REFUSAL, never a pass, which is why adding it mid-flight is legitimate; it was added after a smoke that had produced no timing and before any graded unit ran. The other two controls follow. The POSITIVE control is C4 vs C5: width 1 against width 8 at equal n, where width 1 must be at least 1.20x worse per sample -- if the narrowest possible width is not measurably worse than width 8, the knob does not reach the computation this script claims to time, and the widen ratio measures nothing. The LINEARITY control is C3 vs C1: halving n at fixed width must leave per-sample cost within [0.80, 1.25], which is inherited from the independently measured scaling exponent of 0.975; failing it means the timing is dominated by a fixed per-call cost this design does not model. A missing configuration also lands here. This outcome is live, not decorative: a confident story about this same axis (that the planner silently demotes N_SAMPLES to width 1 on a CPU 4 GiB budget) was probed and FALSIFIED on 2026-10-06 before this script was written."
is_residual = true
adversarial_check = "self_test_passed AND instrument_ok"

