[dependencies]
aminx_version = { type = "git_sha", required = true, doc = "aminx commit SHA" }

[data]
structure = "ONE structure, tests/fixtures/laser/103m_1.pdb, resolved against the aminx repo (not laser_root) exactly as laser_sample_dist_confirm.py:355-359 does, and checked against the digest that file pins. One structure is correct here because the question is about dispatch width, not about across-structure variance."
checkpoint = "laser_weights_0p1A_nothing_heldout.pt, digest-checked through the pilot's own _require_checkpoint, so the model is pinned to the one the confirm would use."
temperature_and_min_p = "T=0.3, min_p=0.0, held constant across every configuration. These are timing conditions, not a parity cell; min_p=0 avoids the min_p0.05@0.3 cell that upstream NaNs on, and no distributional claim is made."
superseded_configurations = "An earlier revision of this sidecar ran five INDEPENDENT configurations and compared them across the whole run. That design was abandoned before it graded anything, because titanix's 1-minute load average was measured moving from 17.47 to 9.55 on 20 cores within minutes: a 1.8x swing in available CPU swamps the ~30% effect being resolved, so configurations run hours apart are not comparable at all. Replaced by the PAIRED design below. The verdict bands were NOT touched -- only the way the ratio is formed. Original text: Five, fixed before the run: C1 n=32 width=8 (the confirm's own setting), C2 n=32 width=32 (one full-width dispatch), C3 n=16 width=8 (linearity control), C4 n=8 width=1 and C5 n=8 width=8 (the positive control pair). No configuration is selected after seeing a number."
padding_lever = "Pair 'padding' runs FIRST and is the headline: (n=8, w=8, max_length=512) against (n=8, w=8, max_length=160), x2 repeats with the order reversed on the second. It is also the CHEAPEST pair, so the larger question is answered in the first ~20 minutes even though the whole run is ~3.5 h. Bands fixed before the run: padding_dominates at ratio <= 0.50, padding_irrelevant at >= 0.90, padding_partial between. These are reported as a SEPARATE padding_verdict rather than folded into the chunk-width verdict, because the two levers are independent and a reader needs both. padding_speedup (1/ratio) is reported next to padding_speedup_predicted_by_square_law (10.24) so the measurement can confirm or refute runner.py's own cost model rather than merely agreeing with it."
padding_is_not_a_free_change_for_the_confirm = "DO NOT read a padding_dominates verdict as permission to re-run the confirm at max_length=160. host/runner.py:127-131 states that sampling draws random numbers at the PADDED shape, so changing max_length MAY CHANGE THE SAMPLED SEQUENCES for the same seed. For a timing measurement that is irrelevant -- only wall clock is read here. For the confirm it is a sampling-configuration change, which (a) invalidates graded_resume reuse because input_sha256 changes, (b) means the already-complete pilot units were drawn at 512, and (c) is a question about whether the DISTRIBUTIONAL claim is preserved, which this run does not address and must not be read as addressing. Scoring, by contrast, is documented as max_length-independent in value."
aminx_already_warned = "host/runner.py:_PaddingCheck emits a UserWarning naming the ratio and suggesting max_length=160 for exactly this batch. Every unit now records the warnings raised during its timed call and a padding_warning_seen flag, because the first revision of this script captured subprocess stderr and only surfaced it on failure -- so aminx told us about an ~10x factor on every single unit and the instrument discarded it. That is the measurement bug this pair exists to repair."
paired_design = "Every comparison is an ADJACENT PAIR: two configurations run back to back, with the ratio formed WITHIN the pair, so a monotone drift in contention cancels because both members see nearly the same machine. Three pairs, fixed before the run: lever (n=32 w=8 vs n=32 w=32, x2 repeats) is the question; control (n=8 w=8 vs n=8 w=1, x1) is the positive control; linearity (n=32 w=8 vs n=16 w=8, x1) is the scaling control. On odd repeats the member ORDER IS REVERSED, so even a drift inside one pair cannot bias the ratio in a fixed direction. The reported ratio is the MEDIAN over a pair's repeats. Load stability is checked PER PAIR INSTANCE over the four recorded load samples, which is the physically meaningful window and is strictly tighter per comparison than a whole-run check."
warmup_is_per_width = "One warm-up per distinct chunk WIDTH, at n == width. The compiled shape is set by the chunk width, not by n -- n samples at width w is ceil(n/w) dispatches of the same shape -- and every (n, width) pair here divides evenly, so no remainder chunk introduces a second shape. Warming per width rather than per configuration costs 41 sample-draws instead of 96."
grader_self_test = "NINE synthetic checks (was six; three padding-verdict checks added with the padding pair) run BEFORE the model is touched, so a broken grader costs seconds rather than three hours. Three are positive (the bands either side of 0.70 and 0.90); THREE REQUIRE A REFUSAL -- an inert width control, a broken linearity control, and a load drift injected inside the lever pair must each force instrument_unverified despite a strong lever ratio. A grader that can only return one answer is not a grader. Verified passing 2026-10-06 before the graded run; self_test_passed is recorded in the result and gates every outcome."
superseded_passes = "Two per configuration. Pass 0 pays that shape's compile into a shared JAX_PERSISTENT_CACHE; ONLY pass 1 is graded. Each width is a distinct shape and therefore a distinct compile, so a single global warm-up would have left the first width carrying a compile the others did not."
why_the_bands_are_ratios = "Every criterion is a RATIO between two configurations of this same run -- widen_ratio, width_control_ratio, linearity_ratio -- so none of them depends on absolute per-sample wall time. That is deliberate: an ungraded smoke mode exists to SIZE this run, and sizing reveals absolute seconds. Because the bands are ratios fixed in the script before any smoke ran, a sizing number cannot move a criterion."
shared_host_contention = "titanix is shared and was measured at load 17.47 on 20 cores during this run's smoke, almost all of it another session's 125-thread job. Absolute per-sample seconds from this run are therefore NOT a clean figure for the host and must not be quoted as one. Every criterion here is a ratio between configurations run minutes apart, and the load-stability gate (max/min of the recorded 1-minute load average across graded units <= 1.50) is what makes those ratios defensible rather than assumed. Processes belonging to other sessions were NOT killed to make room."
what_is_timed = "The runner_sample call and nothing else. Process start, model load and featurisation sit outside the timer, measured per unit in a separate subprocess."
compile_is_observed_not_assumed = "Each unit records the XLA persistent-cache entry count before and after, and a compiled_during_unit flag. A graded pass-1 unit that reports compiled_during_unit=true means the warm-up did not warm that shape, which is visible in the record rather than silently inflating the time."
cost = "Bounded by construction: 273 sample-draws (192 graded across three pairs, 41 in per-width warm-ups). Against the ~41 s/sample prior from the smoke that priced the confirm, that is ~2.2 h, and the dominant uncertainty is C4 (width 1), which is the configuration the positive control expects to be slowest."

[provenance]
note = "Ungraded-by-default diagnostic prompted by a direct question on 2026-10-06: why does the LASEr confirm take ~223 h, has it been profiled, and could Engaging do it instead. The honest answer to the second was no -- the compile/sampling split was measured at the UNIT level but nothing had looked inside sampling, and the readiness doc's explanation ('LASEr sampling is intrinsically far heavier') was a hypothesis written as a conclusion. Lives in scripts/analysis/ because scripts/parity/ and tests/port/ are _touches_scoped paths and a new file in either would invalidate every sidecar_ledger.toml row mid-freeze; scripts/analysis/ is outside _SCOPED_PREFIXES (tests/knob_gate/_coverage.py:21-28). NOT a redsox vehicle; no manifest row. It reads laser_sample_dist_confirm and laser_sample_dist_pilot for structure, checkpoint and LaserOptions construction rather than re-expressing them, so a drift in the confirm fails loudly here. Invocation: bth run --project-slug aminx -- uv run --no-sync python3 scripts/analysis/laser_sample_chunk_width_cost.py --work-dir <dir> --out <json>."

[resume]
unit = "one (configuration, pass) pair"
cache_key = "sha256 over the script bytes, the checkpoint digest, the structure digest, the configuration label, n, width and the pass index"
stamp_order = "the per-unit JSON body is written first and its .done stamp second, so a crash between them leaves an unstamped body that is recomputed rather than trusted"
invalidation = "the script hash is part of the key, so editing a configuration or a band recomputes every unit"
timeout_scope = "per unit, in its own subprocess, 7200 s. There is deliberately NO whole-run timeout: a timeout must cost one configuration, never hours of completed work."
max_attempts = 1
