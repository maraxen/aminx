[experiment]
hypothesis = "Aminx pack shim binds xtrax.pack with complete roundtrip fidelity across standard and custom record_name, and xtrax.eda plan panel rendering and manifest sha256 verification function with positive and negative controls."
stage_name = "confirmation"
novel = false
task_id = "261105_xtrax-adopt-aminx"

[outcomes.pass]
condition = "pack_ok = true AND eda_ok = true AND controls_ok = true"
decision = "Aminx xtrax pack and eda adoption is verified. Proceed with PR opening."
reasoning = "All pack roundtrips, custom record_name handling, member byte-identical readback, eda panel rendering, and manifest sha256 verifications succeed, and all negative controls (empty unit, collision, bit corruption, tampered export) correctly reject."
is_residual = false

[outcomes.fail]
condition = "pack_ok = false OR eda_ok = false OR controls_ok = false"
decision = "Adoption verification failed. Check result.json for failing component."
reasoning = "Either pack roundtrip, eda rendering, manifest sha256 verification, or a negative control failed."
is_residual = true

[result_schema]
pack_ok = "bool"
eda_ok = "bool"
controls_ok = "bool"
custom_record_name_ok = "bool"
eda_render_svg_ok = "bool"
eda_manifest_sha256_ok = "bool"
negative_controls_ok = "bool"
xtrax_version = "str"
