[experiment]
hypothesis = "With native residues taken from tables built by the campaign's own parser (aminx 0.1.0a19, proxide 0.1.0a11), a knob-faceted library EDA over the tev_design AR campaign reproduces tev_design's recorded JSD statistics exactly (positive control), and on the instrument arms (ProteinMPNN, SolubleMPNN) recovery against a composition-preserving shuffle of native stays at chance while true recovery stays at or above 0.25 in every state x temperature x seed cell (negative control), with padding and fixed positions excluded."
stage_name = "validation"
novel = true
task_id = "261106_campaign-eda-respec"
# Follows run 64c6845b (v1, outcome fail). Its two causes:
#  (1) v1 re-parsed inputs with proxide 0.2.0, which reorders 1LVB's chains (214,214,10,10 vs the
#      campaign's 214,10,214,10), misaligning residues after index 214. v2 reads tables from
#      build_campaign_residue_tables.py, run in the campaign's pinned environment, and refuses others.
#  (2) All four LigandMPNN arms recover near chance (0.10-0.15, composition L 0.25 / A 0.17). They
#      were produced by aminx 0.1.0a19, which predates the LigandMPNN backbone-O fix 82c4ea9b (#2326).
#      The negative control tests the instrument, so v2 scopes it to the ProteinMPNN and SolubleMPNN
#      arms; this scoping was chosen AFTER seeing v1. LigandMPNN arms are reported descriptively.
# The degenerate_flag margin (true minus shuffled recovery < 0.10) was also chosen after seeing v1
# and gates nothing. Library statistics are descriptive only (4 seeds per cell, no spike-in, no MDE).

[outcomes.pass]
condition = "positive_control_ok = true AND negative_control_ok = true AND designable_mask_ok = true AND all_rows_ok = true"
decision = "Use v2's tables for the review page and as reference behaviour for the xtrax.eda campaign spec."
reasoning = "Exact reproduction of an independent analysis shows a faithful reader; the instrument-arm shuffle control shows recovery measures agreement with native under the campaign's own residue order."
is_residual = false

[outcomes.fail]
condition = "positive_control_ok = false OR negative_control_ok = false OR designable_mask_ok = false OR all_rows_ok = false"
decision = "Do not use the tables; read results.json for the failing control."
reasoning = "A control or the row coverage check failed."
is_residual = true

[result_schema]
rows_read = "int"
rows_total = "int"
all_rows_ok = "bool"
positive_control_max_abs_diff = "float"
positive_control_ok = "bool"
negative_control_shuffled_recovery_max = "float"
true_recovery_min = "float"
negative_control_ok = "bool"
designable_mask_ok = "bool"
row_knobs_detected = "str"
fixed_pin_differs_from_native_states = "str"
n_fixed_pin_differs_from_native_states = "int"
degenerate_arms = "str"
n_degenerate_arms = "int"
parser_aminx = "str"
parser_proxide = "str"

[outputs]
roots = ["outputs/campaign_eda_prototype_v2"]
