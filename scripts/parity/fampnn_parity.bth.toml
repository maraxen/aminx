[metadata]
title = "FAMPNN parity against the real upstream code and released weights"
created = "261104"
schema_version = "0.3"

[experiment]
hypothesis = "aminx FAMPNN (structure prep, FAEncoder, sidechain denoiser and EDM loop, confidence head, linear-K masked-autoregressive sampler with psce re-mask and overrides, fixed-position parsing) reproduces a sealed dump of the real upstream fampnn code (commit aaf788b) loaded with the released weights fampnn_0_0, fampnn_0_3 and fampnn_0_3_cath, on 1ubq and a two-chain split of 1ubq, with every continuous array within 1e-7 absolute in float64 for the parse, encoder and single-denoiser-call stages and within 2e-6 absolute in float64 for the EDM-loop and sampler stages, and within max(1e-4, 5 x the sealed upstream's own float32-vs-float64 deviation) in float32, every discrete array (aatype, neighbour indices, masks, orders) exact, and every one of nine aminx-side code perturbations leaving the float64 band by more than 1e-4 or flipping a discrete value."
stage_name = "validation"
novel = false

[outcomes.pass]
condition = "clean = 'pass' AND oracle_sealed = 1 AND oracle_f32_content_sha256 = 'c903b3808b3f30fc491e4feb8407a9c1d60492836a325185e3712c8fed456b4c' AND oracle_f64_content_sha256 = '9494f1531e7b6a7c482883d82f933cfdeda5f360dd0ceeca626b66d601a9e553' AND weights_sha_ok = 1 AND fixture_sha_ok = 1 AND weight_source = 'upstream_checkpoint' AND leaf_provenance_max_abs = 0.0 AND f64_n_over_band = 0 AND f32_n_over_band = 0 AND f64_discrete_mismatches = 0 AND f32_discrete_mismatches = 0 AND parse_discrete_mismatches = 0 AND fixed_pos_mismatches = 0 AND n_listed = 9 AND n_failed = n_listed"
decision = "FAMPNN parity holds against the real upstream; the alias_map and branch_manifest rows for this vehicle may enter a ledger wave."
reasoning = "Every graded array of every stage is inside its band in both precisions, no leaf of the converted model is random-initialised and live, and all nine negative controls trip."
is_residual = false
adversarial_check = "NOT (clean = 'pass' AND oracle_sealed = 1 AND weights_sha_ok = 1 AND n_listed = 9 AND n_failed = n_listed)"

[outcomes.fail]
condition = "NOT (clean = 'pass' AND oracle_sealed = 1 AND oracle_f32_content_sha256 = 'c903b3808b3f30fc491e4feb8407a9c1d60492836a325185e3712c8fed456b4c' AND oracle_f64_content_sha256 = '9494f1531e7b6a7c482883d82f933cfdeda5f360dd0ceeca626b66d601a9e553' AND weights_sha_ok = 1 AND fixture_sha_ok = 1 AND weight_source = 'upstream_checkpoint' AND leaf_provenance_max_abs = 0.0 AND f64_n_over_band = 0 AND f32_n_over_band = 0 AND f64_discrete_mismatches = 0 AND f32_discrete_mismatches = 0 AND parse_discrete_mismatches = 0 AND fixed_pos_mismatches = 0 AND n_listed = 9 AND n_failed = n_listed)"
decision = "Do not claim FAMPNN parity. Read stage_f64_worst_max_abs and the .rows.json breakdown to find the first stage that leaves its band; a control that did not trip means that stage is not under test."
reasoning = "Any array outside its band, a discrete mismatch, an unsealed oracle or wrong weights, a live random leaf, or a negative control that fails to trip falsifies the vehicle."
is_residual = true
adversarial_check = "clean = 'pass' AND oracle_sealed = 1 AND weights_sha_ok = 1 AND n_listed = 9 AND n_failed = n_listed"

