[data]
registered = """
Registered 261104 before any REGISTERED run of this script against the sealed dumps. The oracle dumps
(scripts/parity/dump_fampnn_oracle.py, run by scripts/parity/launch_fampnn_oracle.sh on titanix) were produced
and hashed first. Bands, mutant count, hashes and the pass rule are fixed here and are not edited after a run.
"""
supersedes = """
DISCLOSURE (261104, before any registered run). This file replaces the first version committed at commit f5df6593 on
history of branch wt/261104-p4-fampnn, which set 1e-7 for every float64 array. That version never produced a
bth run. Between the two, development diagnostics (stage-by-stage throwaway scripts, .praxia/spikes/, not
registered runs, results not cited) found two real aminx defects, now fixed, and one property of the sealed
oracle that makes a uniform 1e-7 unattainable: upstream builds its positional-embedding angles and sinusoidal
frequencies in float32 whatever the model dtype (data.py:427-442, dit_utils.py:261), so even the "float64"
upstream carries a float32 trig floor of about 4e-8 in its edge features; the 50-step EDM loop and the MAR
sampler amplify that by roughly 10 to 15 times (measured per-step in the diagnostics; worst observed 7e-7). The
loop and sampler stages therefore carry 2e-6 in float64. The parse, encoder and single-denoiser-call stages
keep 1e-7 (observed at most 3.4e-8 and 2e-9). The negative-control trip threshold (1e-4) is unchanged and sits
at least 50 times above the loop band.
"""
upstream = "~/repos/fampnn @ aaf788b (titanix /home/solab/repos/fampnn); fampnn code is imported unmodified"
oracle_inputs = "real released checkpoints; real fixtures tests/data/1ubq.pdb and a two-chain relabel of it (scripts/parity/fampnn_fixtures.py)"
oracle_f32_file_sha256 = "d8b38894a48c09d6808008e13d7c7ee1c02aa8cd898b017863d35870289f5a2c"
oracle_f64_file_sha256 = "c68eaac50213c3eb85530940e4816ae841c5457c4540ad583039eff7c9596fe2"
oracle_f32_content_sha256 = "c903b3808b3f30fc491e4feb8407a9c1d60492836a325185e3712c8fed456b4c"
oracle_f64_content_sha256 = "9494f1531e7b6a7c482883d82f933cfdeda5f360dd0ceeca626b66d601a9e553"
oracle_reproducibility = "two f32 dumps from the same inputs on titanix had identical content_sha256 (261104)"
weights_sha256_fampnn_0_0 = "afbdfda29e6f2a1bd340971bb226638afb1bf460cfbc29f115d3b5964622c006"
weights_sha256_fampnn_0_3 = "8969b3f1f3c941178076c7800952595a18b56fd3828d15bb993d3ef537938a05"
weights_sha256_fampnn_0_3_cath = "81112a9b8d436d9baf5233a3603bac911c75b9782ced59dae5a2726316802218"
fixture_sha256_1ubq = "d4a6812d8951cf6594e6a0763f089e35f5a80b62acb3c117b2c5565228a7b161"
fixture_sha256_1ubq_AB = "f080c6ce0621195b61040ea297f3efca726071ae1f54714d1e2c49d51783d7dd"
injection_points = """
Every torch RNG primitive upstream uses is served from a recorded queue and any other RNG primitive raises:
torch.rand_like at fampnn/sampling_utils.py:25 (decoding order); torch.multinomial at
fampnn/model/fampnn_denoiser.py:129 (replaced by an inverse-CDF draw on injected uniforms, the only change of
mechanism); torch.randn in fampnn/interpolants/edm_interpolant.py sample_prior (EDM prior, scaled by sigma(0)
by upstream itself); torch.randn_like in edm_interpolant.py churn (only when s_churn != 0).
"""
f64_oracle = """
The float64 oracle sets torch's default dtype to float64 after import, casts the model and the module-level
float32 reference-conformer table, and routes Tensor.float() to float64 (upstream hard-codes .float() at
fampnn/model/fampnn.py:360). Values are unchanged. Upstream builds its timestep-frequency table in float32
(dit_utils.py:261), so that table is float32-rounded in the float64 oracle; aminx reproduces the same float32 table.
"""
env_stubs = """
Oracle environment: omegaconf, torchtyping (typeguard 2.13.3), gemmi, rdkit, torch_geometric installed with
uv pip install --target; torchvision-free timm stub in scripts/parity/fampnn_oracle_env (verbatim copy of timm
1.0.31 Mlp, the only timm symbol upstream uses besides use_fused_attn).
"""
bands = """
float64: 1e-7 absolute on every continuous array of the parse, enc and scn1 stages; 2e-6 absolute on every
continuous array of the edm and sample stages (derivation in supersedes). float32: max(1e-4, 5 x floor) per array, floor = max abs
difference between the sealed upstream float32 and float64 dumps of that array. Discrete arrays exact.
Negative control tripped when its targeted stage exceeds 1e-4 in float64 or flips a discrete value.
"""
mutants = """
sigma_min_old_default (scn1, edm): s_min 0.002 instead of the checkpoint's 0.01.
cosine_unmask_schedule (sample): cosine-warped K schedule instead of linear.
rank_decoding_order (sample): rank (double argsort) instead of upstream's argsort permutation.
selfcond_off (scn1, edm): drop the self-conditioning input.
step_scale_one (edm): step_scale 1.0 instead of 1.5.
conf_bins_0_8 (edm psce): bin range 0-8 instead of 0-4.
ghost_atoms_to_origin (edm): ghost sidechain atoms at the origin instead of CA.
chain_embedding_off (enc, two-chain fixture): all residues on one chain.
categorical_reversed_cdf (sample): inverse-CDF draw with 1-u.
"""
wall_time_estimate = "<= 40 min on titanix CPU (JAX_PLATFORMS=cpu), dominated by float64 sampler compilation and the 32 sampler arm-runs; to be profiled and amended (estimate only, outcomes untouched) before the registered run"
