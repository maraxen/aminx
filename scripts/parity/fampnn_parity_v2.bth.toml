[data]
registered = """
Registered 261105 before the graded run of scripts/parity/fampnn_parity_v2.py (a wrapper that runs fampnn_parity.py
with --band-rule floor). The sealed oracle dumps (f32, f64) are the ones of fampnn_parity.bth.toml, unchanged. Bands,
mutant count, hashes and the pass rule are fixed here and are not edited after the run.
"""
supersedes = """
DISCLOSURE (261105). This file supersedes fampnn_parity.bth.toml (v1), whose registered run recorded clean = 'fail'
(titanix ~/.aminx/sidecars/fampnn_parity/33fcfc42): every other check passed (1375 checks, 9 of 9 controls tripped,
every discrete array exact) and one held-out float64 check missed: 3e1r / fampnn_0_3 / sample D_churn_hot / psce_t_traj
3.11e-6 against the 2e-6 loop band. v1 is not edited and its record stands.

What the diagnosis found (plain verification runs, not pre-registered; scripts/parity/dump_fampnn_oracle_f64tables.py and
scripts/parity/fampnn_diag_floor.py; numbers are in the commit history and the task report):
 1. The v1 band rationale was wrong. v1 assumed a ~4e-8 float32 trig floor amplified 10-15x. The float32 positional table
    differs from its float64 truth by up to 1.7e-6 (offsets to 127; ~1e-6 at |offset| 80-100, i.e. on 3e1r), because the
    angle d * freq is rounded to float32. aminx reproduces that rounded angle exactly; the only table disagreement is torch's
    float32 cos/sin kernel against correctly rounded: 196 of 4080 entries, 1 ulp (5.96e-8), and 3 of 128 timestep
    frequencies (exp, <= 8.8e-8 relative).
 2. One real porting discrepancy, fixed at commit f8dcb58c (src/aminx/families/fampnn/sampler.py local_to_global_scn):
    upstream's openfold Rigid/Rotation force float32 on the backbone frame whatever the model dtype (rigid_utils.py:320-322,
    :860), so the float64 oracle applies a float32-rounded frame; aminx applied a float64 frame (2e-7 in x_final/xt_traj).
    A no-op in float32 runs.
 3. With that fix and upstream's own torch table values installed in aminx, aminx matches the sealed float64 oracle to
    <= 1.6e-12 on every stage and fixture of fampnn_0_3 (enc 3e-14, scn1 8e-15, edm 2e-13, sample 1.6e-12); with float64 tables
    on both sides (aminx and the f64-table oracle) <= 8.9e-13. The 3.11e-6 miss is therefore entirely the torch float32 cos/sin
    rounding of 196 table entries, amplified by the churn-hot sampler loop (the same entry changes move the sealed oracle itself
    by 1.5e-5 on that array when its tables are made exact, 5x more than the miss).
 4. After fix 2 the shipped arm's worst sampler deviation is 3.3e-6 (1ubq_AB, A_default, psce_t_traj), above v1's 2e-6: the
    flat loop band of v1 was not a stable rule and would fail on a dev fixture too.

DEVELOPMENT RUN OF THIS VEHICLE (plain run, not the graded one; commit ee913a21, titanix, 1276 s): clean = 'pass', 9 of 9 controls
tripped, 534 identity-arm checks over all three checkpoints and fixtures with worst deviation 1.63e-12 (none over 1e-9, discrete exact),
683 float64 shipped-arm checks all inside band (worst edm 4.4e-7, sample 3.3e-6; bands edm 3.5e-6 / 7.2e-7 and sample 1.5e-5 / 1.6e-6 for
fampnn_0_3 / fampnn_0_3_cath), 692 float32 checks inside band. No band, rule or parameter was changed because of that run. Between that
run and the graded run only this sidecar and the gate rows (branch_manifest.toml slug, closure_edges.toml, test_closure_selftest.py) change.

REVISION HISTORY OF THESE BANDS. v1 (261104): parse/enc/scn1 1e-7, edm/sample 2e-6, float32 10 x floor. The 2e-6 was set from
a development run, the float32 multiplier was refit (5 to 10) after seeing a development run; both are disclosed in v1. v2
(this file) was designed after the v1 FAIL, using data from all three fixtures including 3e1r, so 3e1r is no longer an
independent held-out fixture and the shipped-arm loop bands (which pool the floors over all three) are not a held-out
prediction. The heldout_* fields are kept for continuity of the result schema only. The claim that carries weight is the
identity arm (1e-9, observed ~1e-12), which has no tuned parameter: it is the statement that every difference between aminx
and upstream is accounted for by one input, the torch float32 trig kernels.

The shipped-arm loop band is deliberately the reference's own sensitivity (it must be, as aminx's tables are a different
rounding of the same tables); it is not a precision claim about aminx beyond what the identity arm shows. The ratio
dev / floor per (fixture, stage) on the development data was 0.09 to 0.36 for every pair except 1ubq_AB sampler (2.9), which
is why the rule pools the floor over fixtures per (checkpoint, stage) rather than applying it per array or per fixture.
"""
upstream = "~/repos/fampnn @ aaf788b (titanix /home/solab/repos/fampnn); fampnn code is imported unmodified (the f64-table oracle wrapper replaces only two table functions)"
oracle_inputs = "real released checkpoints; real fixtures tests/data/1ubq.pdb, a two-chain relabel of it (scripts/parity/fampnn_fixtures.py) and upstream data/pdbs/3e1r.pdb"
oracle_f32_file_sha256 = "2c6fba9889b235eb97076e825ddf3807ff0245392f52aea5a139a9b43d1b0a16"
oracle_f64_file_sha256 = "491ab6753a2fa7d86cf726caf63f66c4c616a6cd4384ff2828119168b13e13f5"
oracle_f32_content_sha256 = "ce11f3f60846d243df1f28cb8d46f7b9cd9c7fba3b4b6637ffe48d8250a238fb"
oracle_f64_content_sha256 = "3c46bff41a0c7cbc6d0a6184288d8290d885a8c26c823d5f286b4ee6779882dd"
oracle_f64tab_file_sha256 = "d5ac0d3f50bb14597ca3fc7d2300c36be300eddc28f8e6a0b2ecafc04c73d72c"
oracle_f64tab_content_sha256 = "2f4c6304c1d263e60a05de2ba78f02ab8b8e7257b6e9b6687fa1fee5bba02b92"
diag_tables_content_sha256 = "1b1de8934225ff510ccde053c03481f858d5d768803bba2bd892773a31ce3465"
oracle_reproducibility = "the f64-table oracle was produced twice on titanix (261105): identical file and content sha256; the sealed dumps were reproduced identically on 261104"
weights_sha256_fampnn_0_0 = "afbdfda29e6f2a1bd340971bb226638afb1bf460cfbc29f115d3b5964622c006"
weights_sha256_fampnn_0_3 = "8969b3f1f3c941178076c7800952595a18b56fd3828d15bb993d3ef537938a05"
