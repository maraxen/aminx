injection_points = """
Unchanged from v1. Every torch RNG primitive upstream uses is served from a recorded queue and any other RNG primitive raises:
torch.rand_like at fampnn/sampling_utils.py:25 (decoding order); torch.multinomial at fampnn/model/fampnn_denoiser.py:129 (inverse-CDF
draw on injected uniforms); torch.randn in fampnn/interpolants/edm_interpolant.py sample_prior; torch.randn_like in edm_interpolant.py
churn. The f64-table oracle uses the same seed and draw order: all 96 injected-noise arrays are bit-identical to the sealed f64 dump,
and the sealed f32 dump's draws equal the float32 cast of the f64 draws (checked 261105; no shared-float32-draw defect).
"""
identity_arm = """
Identity arm (arm label id64 in the .rows.json): the float64 stages re-run with aminx's two host-side tables (gvp.positional_embedding_table,
sidechain_diffusion.timestep_frequency_table) replaced, for the duration of the arm, by the arrays the real torch code produced in the
f64-table oracle process (diag_tables.npz: upstream positional_embeddings on offsets -127..127 and the timestep frequencies, both torch
float32). Band 1e-9 absolute on every continuous array (enc, scn1, edm, sample; every checkpoint and fixture the float64 arm covers);
discrete arrays exact. The table arrays are pinned by canonical content digest (diag_tables_content_sha256).
"""
bands = """
float64 shipped arm: parse, enc, scn1: 1e-7 absolute (observed <= 5.5e-8). edm and sample: per (checkpoint, stage) band = max(1e-7, max over
all continuous arrays and fixtures of |sealed f64 dump - f64-table dump|), the sealed upstream's own sensitivity to exact tables (observed
on fampnn_0_3: edm 3.5e-6, sample 1.5e-5). Identity arm: 1e-9. float32: max(1e-4, 10 x floor) per array, floor = max abs difference between
the sealed upstream float32 and float64 dumps of that array (unchanged from v1; the Rigid rounding fix is a no-op in float32). Discrete
arrays exact in every arm. Negative control tripped when its targeted stage exceeds 1e-4 in float64 (shipped tables, v1 stage set) or flips a
discrete value; unchanged from v1 (observed 3.3 to 44; the 1e-4 trip sits at least 30 times above the largest shipped-arm deviation).
"""
mutants = """
Unchanged from v1: sigma_min_old_default, cosine_unmask_schedule, rank_decoding_order, selfcond_off, step_scale_one, conf_bins_0_8,
ghost_atoms_to_origin, chain_embedding_off, categorical_reversed_cdf (definitions in scripts/parity/fampnn_parity.py _mutant_ctx).
"""
heldout = """
See supersedes: 3e1r is no longer independent of the band design. The heldout_* result fields are computed as before.
"""
wall_time_estimate = "about 21 minutes on titanix CPU (JAX_PLATFORMS=cpu, 4 threads), measured 1276 s for a development run; allow 40 minutes"
