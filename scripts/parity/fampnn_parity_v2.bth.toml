[metadata]
title = "FAMPNN parity v2: identity arm against the real upstream, loop bands from the reference's own table sensitivity"
created = "261105"
schema_version = "0.3"

[experiment]
hypothesis = "aminx FAMPNN is a faithful port of the real upstream fampnn code (commit aaf788b, released weights fampnn_0_0, fampnn_0_3, fampnn_0_3_cath) on 1ubq, a two-chain split of 1ubq and the three-chain 3e1r: (1) IDENTITY ARM: with upstream's two host-side float32 trig tables (positional embedding data.py:427-442, timestep frequencies dit_utils.py:266) replaced by the values the real torch code produces, every continuous array of every stage (encoder, single denoiser call, 50-step EDM loop, MAR sampler incl. psce re-mask and overrides) is within 1e-9 absolute of the sealed float64 dump and every discrete array is exact; (2) SHIPPED ARM: with aminx's own correctly rounded float32 tables, float64 parse/encoder/denoiser-call arrays stay within 1e-7 and loop-stage (EDM, sampler) arrays stay within the sealed upstream's own sensitivity to making those tables exact (max |sealed f64 - f64-table oracle| pooled per checkpoint and stage, floor 1e-7); (3) float32 arm within max(1e-4, 10 x the sealed upstream's float32-vs-float64 deviation); (4) all nine aminx-side code perturbations leave the float64 band by more than 1e-4 or flip a discrete value."
stage_name = "validation"
novel = false

[outcomes.pass]
condition = "clean = 'pass' AND band_rule = 'floor' AND oracle_sealed = 1 AND oracle_f32_content_sha256 = 'ce11f3f60846d243df1f28cb8d46f7b9cd9c7fba3b4b6637ffe48d8250a238fb' AND oracle_f64_content_sha256 = '3c46bff41a0c7cbc6d0a6184288d8290d885a8c26c823d5f286b4ee6779882dd' AND f64tab_sealed = 1 AND tables_sha_ok = 1 AND weights_sha_ok = 1 AND fixture_sha_ok = 1 AND weight_source = 'upstream_checkpoint' AND leaf_provenance_max_abs = 0.0 AND f64_n_over_band = 0 AND f32_n_over_band = 0 AND f64_discrete_mismatches = 0 AND f32_discrete_mismatches = 0 AND parse_discrete_mismatches = 0 AND fixed_pos_mismatches = 0 AND identity_n_checks > 0 AND identity_n_over_band = 0 AND identity_discrete_mismatches = 0 AND heldout_n_checks > 0 AND heldout_f64_n_over_band = 0 AND heldout_f32_n_over_band = 0 AND heldout_identity_n_over_band = 0 AND heldout_discrete_mismatches = 0 AND n_listed = 9 AND n_failed = n_listed"
decision = "FAMPNN parity holds against the real upstream; the alias_map and branch_manifest rows for this vehicle may enter a ledger wave."
reasoning = "The identity arm shows the port reproduces upstream to machine precision once the one unreproducible input (torch float32 cos/sin rounding in two tables) is shared; the shipped arm stays inside the reference's own sensitivity to that input; no converted leaf is random and live; all nine negative controls trip."
is_residual = false
adversarial_check = "clean = 'pass' AND oracle_sealed = 1 AND f64tab_sealed = 1 AND weights_sha_ok = 1 AND identity_n_checks > 0 AND identity_n_over_band = 0 AND heldout_n_checks > 0 AND heldout_identity_n_over_band = 0 AND n_listed = 9 AND n_failed = n_listed"

[outcomes.fail]
condition = "NOT (clean = 'pass' AND band_rule = 'floor' AND oracle_sealed = 1 AND oracle_f32_content_sha256 = 'ce11f3f60846d243df1f28cb8d46f7b9cd9c7fba3b4b6637ffe48d8250a238fb' AND oracle_f64_content_sha256 = '3c46bff41a0c7cbc6d0a6184288d8290d885a8c26c823d5f286b4ee6779882dd' AND f64tab_sealed = 1 AND tables_sha_ok = 1 AND weights_sha_ok = 1 AND fixture_sha_ok = 1 AND weight_source = 'upstream_checkpoint' AND leaf_provenance_max_abs = 0.0 AND f64_n_over_band = 0 AND f32_n_over_band = 0 AND f64_discrete_mismatches = 0 AND f32_discrete_mismatches = 0 AND parse_discrete_mismatches = 0 AND fixed_pos_mismatches = 0 AND identity_n_checks > 0 AND identity_n_over_band = 0 AND identity_discrete_mismatches = 0 AND heldout_n_checks > 0 AND heldout_f64_n_over_band = 0 AND heldout_f32_n_over_band = 0 AND heldout_identity_n_over_band = 0 AND heldout_discrete_mismatches = 0 AND n_listed = 9 AND n_failed = n_listed)"
decision = "Do not claim FAMPNN parity. Read identity_worst_max_abs, stage_f64_worst_max_abs and the .rows.json breakdown (arm id64 first): an identity-arm miss is a porting discrepancy, a shipped-arm miss with a clean identity arm is table sensitivity."
reasoning = "Any array outside its band, a discrete mismatch, an unsealed oracle, tables or weights, a live random leaf, or a negative control that fails to trip falsifies the vehicle."
is_residual = true
adversarial_check = "clean = 'pass' AND oracle_sealed = 1 AND f64tab_sealed = 1 AND weights_sha_ok = 1 AND identity_n_checks > 0 AND identity_n_over_band = 0 AND heldout_n_checks > 0 AND heldout_identity_n_over_band = 0 AND n_listed = 9 AND n_failed = n_listed"

