[experiment]
hypothesis = "Through the public run API (SamplingSpecification/ScoringSpecification -> runner -> sample()/score()), aminx reproduces upstream LigandMPNN on 1BC8 chain C for protein_mpnn (proteinmpnn_v_48_020) and ligand_mpnn (ligandmpnn_v_32_020_25) under each of six knob settings (base, temperature 0.5, omit_AA CW, bias_AA A:1.5,E:-2.0, fixed residues C1-C10, redesigned residues C20-C60): (T) per-position conditional log-probabilities of aminx's own samples, teacher-forced through the reference under the injected decoding order, agree within 1e-3; (D) aminx's first-designed-step token frequencies are consistent with the reference's exact sampling_probs (chi-square p > 1e-3 at N=512); (C) at temperature 1e-3 every token up to the first near-tie matches exactly; (S) aminx score() logits and NLL agree within 1e-3 with the reference decoder layers run under an explicit full-context mask. Each lane has a control that must be rejected, and the CLI carries every CLI-reachable knob into the emitted spec"
stage_name = "confirmation"
novel = false
task_id = "260930_resolve-issues-debt"

[outcomes.pass]
condition = "cells_ok = true AND controls_rejected = true AND instrument_ok = true AND cli_ok = true AND single_code_commit = true"
decision = "Relabel the parity matrix path 'end-to-end-run-apis' as runner-level reference parity scoped to exactly the knobs_varied list, list knobs_declared_unvaried alongside it in the matrix and README, and keep the self-consistency check under its own comparison kind. Attach this run id as the evidence. The claim covers 1BC8 chain C, proteinmpnn_v_48_020 and ligandmpnn_v_32_020_25 on CPU float32 only."
reasoning = "A pass requires every lane of every knob cell to agree with the oracle AND every must-fail control to be rejected AND the distributional test to have measured false-reject rate <= 0.005 and power >= 0.9 at TV 0.10. Without the controls and the instrument cell a pass could be a comparison that cannot fail. The oracle for lane S is the reference's own decoder layers under an explicit full-context mask, because the stock single_aa_score depends on the injected randn and is not the same conditional (shown by ctl_S_stock_single_aa); this choice was fixed after a spike on one structure, before any counted run."
is_residual = false

[outcomes.marginal]
condition = "cells_ok = true AND single_code_commit = true AND (controls_rejected = false OR instrument_ok = false OR cli_ok = false)"
decision = "Do NOT cite the cell agreement as parity. The instrument cannot discriminate (a control was not rejected, or the chi-square test lacks the stated power) or the CLI drops a knob. Fix the instrument or the CLI wiring, re-register, and re-run; name which control/cell flagged it."
reasoning = "Agreement under an instrument that also accepts a known-wrong configuration carries no information, and a CLI that drops a declared knob is itself a dispatch-layer defect."
is_residual = false

[outcomes.fail]
condition = "cells_ok = false OR single_code_commit = false"
decision = "At least one lane disagrees with the reference (or the cells ran against different code). Each entry in failing_cells is a finding about the aminx run path, not yet a bug: triage by lane (T: model/conditioning, D: sampling distribution, C: decode loop, S: score path) against the recorded maxima, decide whether aminx or the harness mapping is wrong with a minimal reproduction, fix aminx where it is wrong, and re-run only the affected cells under a documented deviation."
reasoning = "The point of the experiment is to find runner-level divergences the model-level parity cannot see. A cell failure is the outcome the experiment exists to surface; it is recorded as such and is not averaged away."
is_residual = true

[result_schema]
cells_ok = "bool"
n_cells_ok = "int"
n_cells_expected = "int"
controls_rejected = "bool"
n_controls_rejected = "int"
instrument_ok = "bool"
cli_ok = "bool"
single_code_commit = "bool"

[result_schema.provenance]
script_commit = "git log --oneline -1"
related_debt = "aminx #2326 (this), bathos #2322/#2323, xtrax #2324/#2325; aminx lessons #544/#545"
hardware_targets = ["titanix GPU 2 (NVIDIA TITAN RTX, shared with a long-running production calibration job; JAX_PLATFORMS=cuda,cpu, XLA_PYTHON_CLIENT_MEM_FRACTION=0.35, one job at a time) -- added after the CPU runs, see notes; the reference oracle stays on CPU", "titanix CPU (JAX_PLATFORMS=cpu, CUDA_VISIBLE_DEVICES empty) -- the reference is driven in-process with torch on CPU; GPU 3 is held by the #2158 run"]
notes = "GPU AMENDMENT (after the CPU runs): the experiment can now run with E2E_PLATFORM=gpu on ONE explicitly named titanix GPU (E2E_GPU, no default), the JAX pool capped; the upstream reference oracle is pinned to CPU in every mode (run.py would otherwise pick CUDA and change the oracle). The platform is part of every cell's inputs hash, is asserted at run time (a cell registered for gpu that finds only cpu records an error, never a plausible CPU result under a GPU label), is recorded per cell (platform, device_kind, bytes limit, memory cap), and a directory mixing platforms cannot pass (it is folded into single_code_commit). (A first GPU attempt with JAX_PLATFORMS=cuda alone produced no result: aminx's sampler needs a CPU device for jax.io_callback, so every sampling cell errored before any comparison; GPU mode now sets cuda,cpu.) A GPU run is a SEPARATE run record and a SEPARATE claim ('GPU float32 on TITAN RTX, XLA CUDA backend'): it re-derives the same criteria on different hardware and says nothing more about the CPU runs, whose registered outcomes are unchanged; the 1e-3 tolerances were set on CPU and are unverified on GPU, so a GPU failure is a finding to triage, not a reason to loosen them. AMENDMENT AFTER THE TWO REGISTERED RUNS (counted fail 0f282f6a at 3a31203b; confirmation pass 55ce2877 at f47f7939, both under the earlier text of this sidecar), from two code reviews; it affects FUTURE runs only and changes neither registered outcome: (1) the marginal condition now also requires single_code_commit = true, because marginal and fail overlapped when cells_ok = true, single_code_commit = false and a control was unrejected (neither registered run was in that state); (2) lane D's p-value is now a Monte Carlo exact-multinomial p-value, because the Pearson chi-square used in the registered runs false-rejected 5.1% (nominal 0.1%) on 0.9999-peaked distributions and 0.9% on 0.9997-peaked ones -- an over-rejecting test, so every lane-D PASS in the registered runs stands, but the instrument cell had only measured spread-out distributions, so its 'false-reject <= 0.005' claim did not cover the regime lane D runs in; the instrument now measures both regimes; (3) lane D counts all 21 tokens (a drawn X was dropped before) and reads the first designed rank from the decoding order; (4) a fifth control, ctl_CLI_dropped_knob, exercises the CLI lane's checker, and the CLI lane reads top-level spec fields only; (5) the verdict counts only non-smoke records matching their own .done stamp, errored cells are retried, writes are atomic, and an aminx source-tree hash joins the reuse key and the single-code-state check. EXPLORATORY RESULTS SEEN BEFORE THIS REGISTRATION (uncounted smoke, small draw counts; disclosed so the criteria below are not post hoc): all protein_mpnn cells, the protein_mpnn score cell, the pad512 cell and all four controls behaved as the criteria expect (lane T <= 5e-5, lane C exact, controls rejected, instrument false-reject 0.0005 and power 0.99). The ligand_mpnn cells ran but DISAGREED with the reference (lane T max 5.1 nats, lane D TV ~1, lane S max logit 7.2), and a throwaway diagnostic showed aminx's MODEL-level sampler function (no spec/runner) also differs from the reference by ~1.2-1.4 nats at the first decoded position under real ligand windows, with real, all-ones and no ligand masks alike, while existing model-level ligand parity only ever used synthetic geometry. So the ligand cells are EXPECTED TO FAIL; the registered response is the fail branch (triage by lane with a minimal reproduction, decide aminx-vs-harness, re-run affected cells under a documented deviation). No criterion was changed in light of this. LIGAND (added before any counted run, after a smoke run): aminx with ligand_conditioning=True refuses to run without ligand tensors (Y, Y_t, Y_m) or a ligand_context_path; it did not derive them from the PDB's HETATM records. So for the ligand_mpnn cells aminx is handed the reference's own featurized per-residue ligand windows (Y (1,L,M,3), Y_t, Y_m from the reference's feature dict, zero-padded to the padded length) through ligand_context_path, persisted per cell with sha256 in the record. Ligand PARSING, atom selection and the cutoff are therefore declared unvaried; what is compared is the ligand-conditioned model and run path given identical ligand windows. CLI (added before any counted run, after a smoke run): the base options live on the `run` group (aminx run --checkpoint-id ... --chain-id ... --random-seed ... --max-length ... sample --inputs ...), which lane CLI now uses. PADDING (added before any counted run, after a timing probe): aminx pads to max_length (default 512) and the AR decode runs at the padded length, measured at ~86 s/sample on CPU for this 93-residue chain (4 samples ~345 s, warm or cold, so not compile time), which would make the 512-draw lane ~12 h per cell. All cells therefore run at max_length=96 (smallest multiple of 32 that fits chain C); the default 512 is covered by one protein_mpnn cell (pmpnn__pad512, lanes T and C at 4 samples, no distributional lane). Claims from the 96-padded cells say so. Oracle: upstream LigandMPNN run.py executed in-process with its own argument parsing (REFERENCE_PATH=/home/solab/bv/ref/LigandMPNN), ProteinMPNN.sample wrapped only to inject the decoding-order randn (seed 7) and capture the feature dict/outputs. aminx receives the reference's decoding order through decoding_order_fn and its fixed/bias configuration is DERIVED from the reference feature dict, so both sides share one source of truth. RNG streams are never matched seed-for-seed. Knob-effect visibility differs by lane (stored logits are bias-free, so lane T cannot see temperature/omit/bias; lane D and C can). Declared unvaried (knobs_declared_unvaried): batch_size, number_of_batches, symmetry, per-residue bias/omit, chains_to_design, ligand cutoff/atom-context/side-chain-context, side-chain packing, membrane labels, soluble/membrane checkpoints, other structures. Through the CLI only temperature/num_samples/chain_id/checkpoint/seed are reachable (bias, fixed positions, fixed tokens are non-serializable per the CLI's own docstring); lane CLI checks only those. Reference fixtures (randn, S, log_probs, sampling_probs, decoding order, masks, bias) are persisted per cell under fixtures/ with sha256 in the cell record. Resume: one process per cell, hash-verified .started/.done stamps, reuse only on matching inputs hash. A spike (uncounted, no sidecar) on one structure preceded this registration; it showed lane T agrees to 4e-5 and lane S to 2e-5 on the base configuration and fixed the conventions above, so those two base cells are expected to pass and the experiment's information is in the knob, ligand and control cells. No timing is a claim."
