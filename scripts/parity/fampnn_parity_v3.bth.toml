[data]
registered = """
Registered 261105 before the graded run of scripts/parity/fampnn_parity_v3.py. Bands, hashes and the pass rule are
fixed here and are not edited after the run.
"""
vehicle_change = """
v3 changes the vehicle, not the bands. Final review of PR #269 found (1) fampnn_parity.py turned NaN into inf and
counted inf as a negative-control trip, although a control must trip only on a FINITE over-band diff or a discrete
flip; (2) a shape mismatch in a clean or held-out arm was recorded but never counted (fails open). Now non-finite
values and shape mismatches are separate row kinds, counted per arm (n_nonfinite_*, n_shape_mismatch_*), any of them
in a clean arm fails clean, a control trips only on a finite diff above 1e-4 or a discrete flip, and a crashed control
is recorded (n_crashed) and required to be 0. Every band, hash and fixture is unchanged from v2.
"""
v2_disclosure = """
v2 (fampnn_parity_v2.bth.toml) was graded PASS (bth-recorded run, titanix, output dir bth-bd5b12ba, 9 of 9 controls
tripped, clean pass) before these counters existed. Checked from v2's recorded result JSON: every control's
max_abs_diff is finite (3.26 to 44.0), so none tripped through NaN or inf (a non-finite row would have made the
maximum inf), and the v2 claim stood on that point; the remaining trip evidence is unchanged. v2's clean arms were
not checked for non-finite or mis-shaped values by construction (v3 does). Development runs of the v3 code saw numbers
before this sidecar was committed; no band or hash was changed in response to any of them.
"""
revision_history = """
v1 (scripts/parity/fampnn_parity.bth.toml, registered 261104; not reproducible after the f8dcb58c frame fix; superseded by v2, then v3) graded the loop stages at a flat 2e-6 float64 band
that assumed upstream's float32 trig floor (about 4e-8) is amplified 10 to 15 times by the EDM loop and sampler.
Its registered run graded FAIL on exactly one held-out float64 check: 3e1r sample D_churn_hot psce_t_traj,
3.11e-6 against 2e-6. That sidecar and its recorded FAIL stay as they are. A review found the band rationale weak:
the amplification had already measured about 44x on the dev fixtures and about 78x on 3e1r, and a candidate
porting cause (positional_embedding_table rounding) was untested. v2 follows the diagnosis below (plain
diagnostic runs, not pre-registered findings: scripts/parity/fampnn_diag_floor.py and
dump_fampnn_oracle_f64tables.py). The 3.11e-6 value is not used to set any band here.
"""
diagnosis = """
(a) Positional table, aminx vs upstream torch float32 (4080 entries = 255 offsets x 16): max abs diff 5.96e-8 (one
float32 ulp) in 196 of 4080 entries (4.8 percent), flat across |offset| bins 0-20, 21-40, 41-60, 61-79, 80-100,
101-127. Both tables differ from the float64 truth by the same amount, which grows with |offset| (2.0e-7 at 0-20 to
1.7e-6 at 101-127): upstream builds the angles in float32 (data.py:427-442) and aminx reproduces that rounding. The
hypothesis that aminx's own error scales with offset is not supported; the offset dependence is upstream's and is
shared. Timestep frequencies: max abs diff 3.0e-8 in 3 of 128 entries.
(b) The sealed upstream float64 vs the same run with its two trig tables in float64 (a separate dump,
dump_fampnn_oracle_f64tables.py): 3e1r sample psce_t_traj moves by 1.49e-5, 4.8 times aminx's 3.11e-6 miss.
aminx fed upstream's torch float32 table values reproduced the sealed dump to 1.3e-6 on that array before, and to at
most 1.6e-12 on every array and fixture after, one real porting fix: f8dcb58c (upstream's Rigid forces the
local-to-global frame to float32, rigid_utils.py:320-322, 860; aminx now rounds it likewise). That fix does not
change the shipped-arm number (3.11e-6 before and after). Cause of the v1 miss: intrinsic amplification by the loop
of float32 trig-table rounding in the ORACLE, with aminx's correctly rounded table differing from torch's by one ulp
in 4.8 percent of entries. Not a logic defect in the tables.
"""
bands = """
float64 identity arm (aminx fed upstream's torch float32 tables): 1e-9 absolute on every continuous array of enc,
scn1, edm and sample (observed at most 1.6e-12). float64 shipped arm: 1e-7 on parse, enc and scn1 stages; on edm and
sample stages the band of each (checkpoint, stage) is the sealed upstream's own sensitivity to its float32 tables,
max over continuous arrays of |sealed f64 - f64-table oracle|, floored at 1e-7 (computed at run time, reported as
band_f64_<stage>_<checkpoint>; development-run values for fampnn_0_3 / fampnn_0_3_cath: edm 3.46e-6 / 7.24e-7,
sample 1.49e-5 / 1.59e-6). float32: max(1e-4, 10 x floor), floor = |sealed f32 - sealed f64| per array; the
development run's worst float32 deviation was 0.95 of its band, which is tight and is disclosed. Discrete arrays
exact. A negative control is tripped when its targeted stage exceeds 1e-4 in float64 or flips a discrete value
(smallest development-run deviation 3.26). The shipped-arm loop band is deliberately the reference's own table
sensitivity; the parity claim rests on the identity arm.
"""
upstream = "~/repos/fampnn @ aaf788b (titanix /home/solab/repos/fampnn); fampnn code imported unmodified"
