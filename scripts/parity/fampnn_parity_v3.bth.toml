[metadata]
title = "FAMPNN parity v3: v2 bands with non-finite, shape and crash accounting"
created = "261105"
schema_version = "0.3"

[experiment]
hypothesis = "(1) IDENTITY ARM. aminx FAMPNN (fampnn_0_0, fampnn_0_3, fampnn_0_3_cath; 1ubq, two-chain 1ubq, held-out 3e1r), run in float64 with its two float32 trig tables (positional embedding, sinusoidal timestep) replaced by the values the real upstream code computed in torch float32 (diag_tables.npz, sealed), reproduces the sealed float64 upstream dump on every continuous array of the encoder, single-denoiser-call, EDM-loop and sampler stages within 1e-9 absolute (a previous diagnostic run saw at most 1.7e-12), and every discrete array exactly. (2) SHIPPED ARM. aminx as shipped (correctly rounded float32 tables) stays within 1e-7 absolute of the sealed float64 dump on the parse, encoder and single-call stages, within the sealed upstream's own sensitivity to the same tables on the EDM-loop and sampler stages (per checkpoint and stage, max |sealed f64 - f64-table oracle|, floor 1e-7), and within max(1e-4, 10 x float32-vs-float64 floor) in float32. (3) Each of nine aminx-side code perturbations leaves the float64 band by more than 1e-4 (finite diff) or flips a discrete value; a non-finite value, shape mismatch or crash never counts as a trip. (4) No clean arm (f64, f32, id64, held-out included) holds a non-finite value or a shape mismatch, and no negative control crashes."
stage_name = "validation"
novel = false

[outcomes.pass]
condition = "clean = 'pass' AND band_rule = 'floor' AND oracle_sealed = 1 AND oracle_f32_content_sha256 = 'ce11f3f60846d243df1f28cb8d46f7b9cd9c7fba3b4b6637ffe48d8250a238fb' AND oracle_f64_content_sha256 = '3c46bff41a0c7cbc6d0a6184288d8290d885a8c26c823d5f286b4ee6779882dd' AND f64tab_sealed = 1 AND tables_sha_ok = 1 AND weights_sha_ok = 1 AND fixture_sha_ok = 1 AND weight_source = 'upstream_checkpoint' AND leaf_provenance_max_abs = 0.0 AND identity_n_checks > 0 AND identity_n_over_band = 0 AND identity_discrete_mismatches = 0 AND identity_worst_max_abs <= 1e-9 AND heldout_identity_n_over_band = 0 AND f64_n_over_band = 0 AND f32_n_over_band = 0 AND f64_discrete_mismatches = 0 AND f32_discrete_mismatches = 0 AND parse_discrete_mismatches = 0 AND fixed_pos_mismatches = 0 AND heldout_n_checks > 0 AND heldout_f64_n_over_band = 0 AND heldout_f32_n_over_band = 0 AND heldout_discrete_mismatches = 0 AND n_listed = 9 AND n_failed = n_listed AND n_crashed = 0 AND n_nonfinite_f64 = 0 AND n_nonfinite_f32 = 0 AND n_nonfinite_id64 = 0 AND n_shape_mismatch_f64 = 0 AND n_shape_mismatch_f32 = 0 AND n_shape_mismatch_id64 = 0 AND heldout_n_nonfinite = 0 AND heldout_n_shape_mismatch = 0"
decision = "FAMPNN parity (v3) holds against the real upstream; the float64 deviation on the loop stages is attributed to rounding of torch's float32 trig tables, not to a porting difference. The alias_map and branch_manifest rows for this vehicle may enter a ledger wave."
reasoning = "With upstream's own tables aminx matches upstream to 1e-9 on every stage, so no logic differs; with the shipped tables it moves by no more than the upstream itself moves under the same table change; all nine negative controls trip on finite diffs or discrete flips, none crashed, and no clean-arm value was NaN, inf or mis-shaped."
is_residual = false
adversarial_check = "NOT (clean = 'pass' AND band_rule = 'floor' AND oracle_sealed = 1 AND f64tab_sealed = 1 AND weights_sha_ok = 1 AND identity_n_checks > 0 AND identity_n_over_band = 0 AND heldout_n_checks > 0 AND heldout_f64_n_over_band = 0 AND n_listed = 9 AND n_failed = n_listed AND n_crashed = 0 AND n_nonfinite_f64 = 0 AND n_nonfinite_f32 = 0 AND n_nonfinite_id64 = 0 AND n_shape_mismatch_f64 = 0 AND n_shape_mismatch_f32 = 0 AND n_shape_mismatch_id64 = 0 AND heldout_n_nonfinite = 0 AND heldout_n_shape_mismatch = 0)"

[outcomes.fail]
condition = "NOT (clean = 'pass' AND band_rule = 'floor' AND oracle_sealed = 1 AND oracle_f32_content_sha256 = 'ce11f3f60846d243df1f28cb8d46f7b9cd9c7fba3b4b6637ffe48d8250a238fb' AND oracle_f64_content_sha256 = '3c46bff41a0c7cbc6d0a6184288d8290d885a8c26c823d5f286b4ee6779882dd' AND f64tab_sealed = 1 AND tables_sha_ok = 1 AND weights_sha_ok = 1 AND fixture_sha_ok = 1 AND weight_source = 'upstream_checkpoint' AND leaf_provenance_max_abs = 0.0 AND identity_n_checks > 0 AND identity_n_over_band = 0 AND identity_discrete_mismatches = 0 AND identity_worst_max_abs <= 1e-9 AND heldout_identity_n_over_band = 0 AND f64_n_over_band = 0 AND f32_n_over_band = 0 AND f64_discrete_mismatches = 0 AND f32_discrete_mismatches = 0 AND parse_discrete_mismatches = 0 AND fixed_pos_mismatches = 0 AND heldout_n_checks > 0 AND heldout_f64_n_over_band = 0 AND heldout_f32_n_over_band = 0 AND heldout_discrete_mismatches = 0 AND n_listed = 9 AND n_failed = n_listed AND n_crashed = 0 AND n_nonfinite_f64 = 0 AND n_nonfinite_f32 = 0 AND n_nonfinite_id64 = 0 AND n_shape_mismatch_f64 = 0 AND n_shape_mismatch_f32 = 0 AND n_shape_mismatch_id64 = 0 AND heldout_n_nonfinite = 0 AND heldout_n_shape_mismatch = 0)"
decision = "Do not claim FAMPNN parity. If identity_n_over_band > 0 there is a real porting discrepancy (read the .rows.json breakdown, arm id64); if only the shipped f64 or f32 arms fail, the table-rounding explanation is incomplete."
reasoning = "Any non-finite or mis-shaped clean-arm value, any crashed control, any identity-arm array outside 1e-9, a shipped-arm array outside its band, a discrete mismatch, an unsealed oracle or table dump, wrong weights, a live random leaf, or a control that fails to trip falsifies the vehicle."
is_residual = true
adversarial_check = "clean = 'pass' AND band_rule = 'floor' AND oracle_sealed = 1 AND f64tab_sealed = 1 AND weights_sha_ok = 1 AND identity_n_checks > 0 AND identity_n_over_band = 0 AND heldout_n_checks > 0 AND heldout_f64_n_over_band = 0 AND n_listed = 9 AND n_failed = n_listed AND n_crashed = 0 AND n_nonfinite_f64 = 0 AND n_nonfinite_f32 = 0 AND n_nonfinite_id64 = 0 AND n_shape_mismatch_f64 = 0 AND n_shape_mismatch_f32 = 0 AND n_shape_mismatch_id64 = 0 AND heldout_n_nonfinite = 0 AND heldout_n_shape_mismatch = 0"

