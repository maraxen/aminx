# AntiBMPNN parity vehicle v3 -- task 261104_p4-final-review-fixes. Supersedes antibmpnn_parity_v2.bth.toml (v2; its
# [outcomes], vehicle and run record stay untouched) and, through it, antibmpnn_parity.bth.toml (v1).
#
# WHY v3 EXISTS. Final review of PR #269 found that antibmpnn_parity_v2.py had no finiteness handling: _grade_cells used
# `gap_f64 > tol`, which is False for NaN, so a NaN clean float32 or entry cell would PASS; python max() over NaN is
# order dependent; and only the sampler-token path could trip a mutant on something other than a finite gap. v3 adopts
# the rule already used by caliby_parity_v2.py: NaN/inf, shape mismatch and arm crash are recorded separately
# (`nonfinite`, `n_shape_mismatch`, `n_crashed`); a non-finite or shape-mismatched clean-arm cell fails the clean
# verdict; a mutant is tripped only by a FINITE over-band diff or a discrete flip. The numerical comparison (bands,
# floors, stages, mutants, sealed inputs) is unchanged from v2.
#
# DISCLOSURE ABOUT v2 AND ABOUT WHAT WAS SEEN FIRST (read before the outcomes):
#  * The v2 vehicle was run (bth run d2be3ca9, graded on titanix). Its payloads (work_v2, one JSON per arm) were read
#    BEFORE this sidecar was written, to answer one question: did any v2 mutant trip only through NaN/inf? Answer: no.
#    No v2 payload contains a NaN or Infinity token; every designated-stage value was finite and far over 1e-3 (e.g.
#    entry_ar_mask_transposed entry 3.63, offset_shift features 17.1, parser_wrong_atom_order parse 1.485, lehninger csv
#    0.13 / direct 2.64 / ph 1.30, omit_penalty_dropped sampler 1.0 with 8 token flips); the clean arm was finite
#    everywhere. Limit of that check: v2 aggregated parse/sampler/descriptor maxima with python max(), which would hide
#    a NaN, so for those three scalars absence of NaN is inferred from the finite, distinct values, not observed.
#  * The numbers v2 produced (aminx-vs-upstream gaps at every stage, and which mutants tripped) were therefore known to
#    the author when v3's outcomes were fixed. v3 changes grading code, not bands: its [outcomes] below are v2's
#    thresholds plus finiteness/crash counters. v3 is NOT a blind pre-registration; it is a re-grade of the same
#    comparison under a stricter finiteness rule, and the v2 record is the first look at the numbers.
#  * The earlier disclosure paragraphs of v2 (v1 numbers seen; v2 upstream-vs-upstream floors seen; knob-semantics
#    leakage finding; conditional_probs proxy-floor rule; flat-1e-4 not used for f32 cells) apply unchanged and are
#    repeated below.
#
# EARLIER (v2) DISCLOSURE, UNCHANGED.
# DISCLOSURE (read before the outcomes). Everything below this paragraph was committed BEFORE the first run of
# antibmpnn_parity_v2.py, but it was NOT written blind:
#  * The v1 vehicle was run before (clean arm and mutants, v1 dump), so the author had seen: f64 gaps ~1e-13,
#    aminx-f32 vs upstream-f32 features 6.2e-5 / encoder 5.6e-5 / logits 1.68e-4 (checkpoint 000), sampler 3.3e-5,
#    all 7 v1 mutants failing by >= 1.4 (sampler: token mismatch). Those are aminx-vs-upstream numbers.
#  * A review found the v1 dump invalid for cross-precision comparison (randn drawn under the float64 default dtype;
#    f64 and f32 orders differ at 120/121 positions). The v2 dump fixes that. Before this sidecar the author read
#    only UPSTREAM-vs-UPSTREAM numbers from the v2 dump (the conditioning floor, no aminx involved): float32 vs
#    float64 upstream at checkpoint 000 is features 2.3e-4, encoder node 7.7e-5, encoder edge 1.2e-4, logits 2.79e-4;
#    at checkpoints 050/100 logits 3.5e-6..6e-6. One throwaway spike ran aminx runner.score at checkpoints 000 and 030
#    on the cdr5 order and saw log-prob gaps vs the float64 upstream of 4.3e-4 and 6.4e-6 (plus 1.6e-4 and 8e-6 vs the
#    float32 upstream); no other aminx-vs-v2-dump number had been seen when the rule below was fixed.
#  * A knob-semantics test run (not against the dump) showed that under the default ar_mask=None, changing the residue
#    at j moves the aminx logits AT j (2-hop leakage through later layers), so aminx's default full-context score is not
#    upstream's conditional_probs estimand (which decodes the probed position last). The entry stage therefore feeds
#    runner.score a per-position ar_mask (probed position last, built from the dump's stored randn) for conditional_probs.
#  * The conditional_probs cells (entry_cond_full over 13 probed positions, entry_cond_backbone over all 121) compare aminx
#    float32 with the upstream float32 (the dump has no float64 conditional_probs; gap_f64 is set equal to gap_same) and use
#    the knobs-config teacher-forced float32-vs-float64 floor of checkpoint 000 as the proxy floor, so for those two cells
#    the rule is "within max(3 x proxy floor, 2e-5)", not strictly the float64-truth rule of the other cells.
#  * The float32 rule below is derived from the floor, not from any aminx value: a tolerance scaled by the
#    measured upstream f32-vs-f64 gap for that (checkpoint, stage), because two independent float32
#    implementations each sit about one floor from the truth. The multipliers (3 pass, 10 marginal) and absolute
#    terms (2e-5 / 1e-4) were chosen as round numbers from that argument. The flat 1e-4 float32 band of the P4 brief
#    is NOT used for the hand-composed or entry stages because it is below the upstream's own float32 noise at
#    checkpoint 000 (floor 2.8e-4); the sampler-probability and descriptor bands stay at the brief's flat 1e-4.
#
# WALL TIME (estimate, unchanged from v2: the v2 graded run is the evidence, titanix CPU, JAX_PLATFORMS=cpu, OMP_NUM_THREADS=4): the v1 clean arm took ~46 s and each v1
# mutant arm 20-26 s; v2 adds the runner.score entry stage: 4 teacher-forced calls + 14 conditional_probs calls in the
# clean arm (a score() call costs several seconds; the narrow knob test suite, ~40 score/sample calls, took ~9 min), so
# the clean arm is estimated at 5-10 min, each mutant arm 1-2 min (the 14 conditional_probs calls run only in the
# entry mutant), whole run 20-30 min. Each arm is its own interpreter with its own 3600 s timeout; nothing is long
# enough to need preemption-safe resume (inputs are sha256-pinned, so a rerun cannot silently grade different bytes).

[metadata]
title = "AntiBMPNN parity v3: v2 comparison with finiteness/crash accounting (NaN cannot pass, only finite diffs trip mutants)"
created = "261105"
schema_version = "0.3"

[experiment]
hypothesis = "aminx (JAX) matches the real AntiBMPNN upstream (protein_mpnn_utils.py + antibmpnn_{000..100}.pt on inputs/HuJ3/HuJ3.pdb, sealed v2 dump with one shared float32 decoding order): PDB parse exact (<1e-9); neighbour indices E_idx identical in float32 and float64; float64 edge features / encoder / teacher-forced log-probs within 1e-7 for all 11 checkpoints; float32 gaps to the float64 upstream within max(3 x floor, 2e-5) per (checkpoint, stage) where floor is the upstream's own float32-vs-float64 gap; the real entry point runner.score (ar_mask + return_logits, published antibmpnn_v_48_{000,010,020,030} weights) within the same rule for teacher-forced log-probs and for upstream conditional_probs (full-context and backbone-only, checkpoint 000); per-position sampling distribution within 1e-4 with zero Gumbel-token mismatches; descriptors (PD1, PD2, Lehninger charge) within 1e-4 of peptides 0.5.0 as called by parsing_design_result.py; and each of seven code-level aminx perturbations drives its designated stage above 1e-3 by a FINITE diff or a discrete flip (two weight-level controls are also run and reported separately); additionally no clean-arm cell is non-finite or shape-mismatched (nonfinite == 0, n_shape_mismatch == 0) and no arm crashed (n_crashed == 0)."
stage_name = "validation"
novel = false

[controls]
positive_outcome = ["pass"]
negative_outcome = ["fail", "marginal"]

[outcomes.pass]
condition = "nonfinite == 0 AND n_shape_mismatch == 0 AND n_crashed == 0 AND weight_source == 'upstream_checkpoint' AND oracle_verified == 1 AND max_abs_f64 < 1e-7 AND f32_pass_violations == 0 AND entry_pass_violations == 0 AND nbr_mismatch == 0 AND parse_max_abs < 1e-9 AND sampler_f32 < 1e-4 AND sampler_token_mismatch == 0 AND descriptors_max < 1e-4 AND n_checkpoints == 11 AND entry_n_cells == 6 AND n_code_level == 7 AND n_code_level_failed == n_code_level AND n_failed == n_listed"
decision = "AntiBMPNN is at numerical parity with the real upstream through both the hand-composed forward and the runner.score entry point; record the sidecar in the AntiBMPNN ledger shard."
reasoning = "No cell is non-finite or shape-mismatched and no arm crashed, every float32 cell is within 3 x its conditioning floor of the float64 upstream (floor measured on the upstream itself), float64 is inside 1e-7, neighbour indices and sampler tokens agree exactly, and every code-level negative control leaves the pass region."
is_residual = false

[outcomes.marginal]
condition = "nonfinite == 0 AND n_shape_mismatch == 0 AND n_crashed == 0 AND weight_source == 'upstream_checkpoint' AND oracle_verified == 1 AND max_abs_f64 < 1e-5 AND f32_marginal_violations == 0 AND entry_marginal_violations == 0 AND nbr_mismatch == 0 AND parse_max_abs < 1e-9 AND sampler_f32 < 1e-3 AND sampler_token_mismatch == 0 AND descriptors_max < 1e-3 AND (max_abs_f64 >= 1e-7 OR f32_pass_violations > 0 OR entry_pass_violations > 0 OR sampler_f32 >= 1e-4 OR descriptors_max >= 1e-4) AND n_checkpoints == 11 AND entry_n_cells == 6 AND n_code_level == 7 AND n_code_level_failed == n_code_level AND n_failed == n_listed"
decision = "Do not claim the tight band; report the cells above 3 x floor (decomposition.per_cell_*) and rely on the float64 result for algorithmic equality."
reasoning = "The comparison is alive (negative controls trip, indices and tokens agree) but at least one float32 cell sits between 3 x floor and 10 x floor, or float64 is in [1e-7, 1e-5), or the sampler/descriptor gap is in [1e-4, 1e-3)."
is_residual = false

[outcomes.fail]
condition = "NOT (nonfinite == 0 AND n_shape_mismatch == 0 AND n_crashed == 0 AND weight_source == 'upstream_checkpoint' AND oracle_verified == 1 AND max_abs_f64 < 1e-5 AND f32_marginal_violations == 0 AND entry_marginal_violations == 0 AND nbr_mismatch == 0 AND parse_max_abs < 1e-9 AND sampler_f32 < 1e-3 AND sampler_token_mismatch == 0 AND descriptors_max < 1e-3 AND n_checkpoints == 11 AND entry_n_cells == 6 AND n_code_level == 7 AND n_code_level_failed == n_code_level AND n_failed == n_listed)"
decision = "Block: a stage disagrees with the real upstream, an oracle or weight hash did not verify, an index mismatched, or a negative control did not trip."
reasoning = "Anything outside the marginal envelope, a non-finite or shape-mismatched cell, an arm crash, a missing checkpoint or entry cell, a token or index mismatch, an unverified sealed input, or a surviving mutant falsifies the vehicle."
is_residual = true

[breakdown]
waive = "One fixture (HuJ3 chain B, 121 residues) and one precision-pair per cell: the per-unit worst cases are already carried as decomposition.per_cell_f32 / per_cell_entry (checkpoint x stage, gap and floor); the gated scalars are maxima over those cells plus counts, not an aggregate that hides a per-unit tail."

