[experiment]
hypothesis = "JAX implementations of AbMPNN, HyperMPNN (002, 010, 020, 030), and CyclicMPNN match their upstream PyTorch references within 1e-7 in float64 and 1e-4 in float32 on 1ubq.pdb, and fail decisively (> 1e-2) under all five structural/algebraic negative controls."
stage_name = "validation"

[reproduction]
reproduces_paper = "doi:10.1101/2023.07.18.549552"

[controls]
positive_outcome = ["pass"]
negative_outcome = ["fail", "marginal"]

[requires.waiver]
reason = "CPU parity verification vehicle against upstream PyTorch checkpoints"

[outcomes.pass]
condition = "weight_source == 'upstream_checkpoint' AND f64_max_abs_diff < 1e-7 AND f32_max_abs_diff < 1e-4 AND neg_ctrl_min_max_abs_diff > 1e-2 AND n_listed > 0 AND n_failed == n_listed"
decision = "Promote Tier 1 MPNN variants (AbMPNN, HyperMPNN, CyclicMPNN) JAX ports and converted weights."
reasoning = "All Tier 1 models match upstream PyTorch checkpoints within 1e-7 in float64 and 1e-4 in float32, and all five negative controls trip decisively."
is_residual = false

[outcomes.marginal]
condition = "weight_source == 'upstream_checkpoint' AND f64_max_abs_diff < 1e-5 AND f32_max_abs_diff < 1e-3 AND (f64_max_abs_diff >= 1e-7 OR f32_max_abs_diff >= 1e-4) AND neg_ctrl_min_max_abs_diff > 1e-2 AND n_listed > 0 AND n_failed == n_listed"
decision = "Investigate numerical drift between PyTorch and JAX before promoting."
reasoning = "Forward outputs are close to PyTorch and negative controls trip, but tolerances exceed the strict 1e-7 / 1e-4 bar."
is_residual = false

[outcomes.fail]
condition = "weight_source != 'upstream_checkpoint' OR f64_max_abs_diff >= 1e-5 OR f32_max_abs_diff >= 1e-3 OR neg_ctrl_min_max_abs_diff <= 1e-2 OR n_failed != n_listed OR n_listed == 0 OR f64_max_abs_diff IS NULL OR f32_max_abs_diff IS NULL OR neg_ctrl_min_max_abs_diff IS NULL"
decision = "Block promotion and debug Tier 1 MPNN architecture, featurizer, or weights conversion."
reasoning = "Run used synthetic weights, parity error exceeds tolerance, or a negative control failed to trip."
is_residual = true

[result_schema]
clean = "str"
n_listed = "int"
n_failed = "int"
weight_source = "str"
f64_max_abs_diff = "float"
f32_max_abs_diff = "float"
neg_ctrl_reversed_hidden_diff = "float"
neg_ctrl_zero_edge_features_diff = "float"
neg_ctrl_permuted_output_weights_diff = "float"
neg_ctrl_shifted_decoding_order_diff = "float"
neg_ctrl_linear_offsets_on_cyclic_diff = "float"
neg_ctrl_min_max_abs_diff = "float"
