[metadata]
title = "protonpotts_sample wave: aminx sample_rows (the engine's mpnn_sample: N batched decodes, binder chain designed) against upstream, per step"
created = "261009"
schema_version = "0.3"

[experiment]
hypothesis = """
`aminx.families.protonpotts_mpnn.decode.sample_rows` -- N independent `ProtonPottsARDecode` calls over ONE structure's shared encoder
states, one per (uniforms row, decoding-order row), with only the binder chain designed -- built from the converted v6 checkpoint and
fed the sealed feature dumps, reproduces upstream's batched call as dumped by P4i (`dump_protonpotts_sample.py`: the engine's
`mpnn_sample`, potts_mpnn_ph.py:1226-1231, prepared with `designed_chains=[binder]`, `repeat_sample_num = 3`, `torch.multinomial`
replaced by inverse-CDF on injected uniforms[row, step]) for four cells (1BVC chain A, 6m0j chain E, 1OLR chain A, 1EL1 chain A), in
float64 and float32. Spec §55; debt #2617. Layer a (the single-row decoder against upstream) is the protonpotts_decoder wave.

Per cell, precision and row, in a FORCED-TOKEN replay (the dump's sampled tokens as the prefix, so one fragile draw cannot cascade into
the rest): logits, log_probs and the renormalised probs_sample at every position, against the dump, in aminx's token order; every
step's own draw (drawn_token) except at FRAGILE positions (the smallest distance of the draw to a CDF boundary, relative to the mass,
below 1e-5; counted and reported). In the FREE-RUNNING decode (no forced tokens): the sampled sequence, exact, except that a row with a
fragile draw is exempt from this one comparison (counted and reported). NON-DESIGNED positions: the sampled sequence equals the native
sequence at every position outside the binder chain, in every row.

Inputs: the dump's decoding orders and uniforms (replay), its designed mask, the prepared features' per-residue temperature
(float32 0.1 cast to the run's dtype, the P4h finding) and zero bias; the cdf accumulates in upstream's token order (`cdf_order`).

TOLERANCES, fixed before any run. float64: max|aminx - upstream| <= 1e-9 absolute on every array. float32: 10 x the measured
f32-vs-f64 spread of that array in that cell, minimum 1e-6 (the P4h decision). Tokens, orders and draws: exact.

CONTROLS -- eight deliberate errors, on the 6m0j cell (the largest binder) in float64, each of which must make the SAME comparison fail:
  shared_order_across_rows     every row replays row 0's decoding order
  uniforms_rows_swapped        rows 0 and 1 exchange their uniforms
  all_residues_designed        the whole chain designed instead of the binder
  cdf_in_aminx_order           the inverse CDF accumulates in aminx's token order
  uniforms_shifted_one_step    every row's uniforms rolled by one step
  single_row_repeated          row 0's order and uniforms used for all rows
  temperature_one              temperature 1.0 instead of the prepared 0.1
  nudged_4x_band               log_probs shifted by 4 x the float64 band
A control that is not rejected means the comparison cannot discriminate that error; the wave then FAILS by rule and the instrument is
improved (not the criterion relaxed), as was done for x_not_zeroed in the decoder wave.

PREDICTION, stated before the run so it can be wrong: all four cells agree in both precisions and all eight controls are rejected.
The specific risk is discrimination at temperature 0.1: the distributions are sharp, so a rolled-uniforms control may flip few draws
on a small binder (hence the 6m0j control cell). Another risk is that vmap changes reduction order enough to move f32 results beyond
the single-row floor; that would show as an f32 array outside its band, named.
"""
stage_name = "confirmation"
novel = false

[outcomes.pass]
condition = "clean = 'pass' AND n_cells = 4 AND f64_in_band AND f32_in_band AND draws_exact AND sequences_exact AND nondesigned_hold AND checkpoint_matches AND n_listed = 8 AND n_failed = n_listed"
decision = "protonpotts_sample is graded: the aminx N-row sampler reproduces upstream's batched mpnn_sample call per step in both precisions and every error is rejected."
reasoning = "All arrays are within their bands, every non-fragile draw and sequence is exact, non-designed positions hold, the weights came from the dumped checkpoint, and all eight controls fail."
is_residual = false
adversarial_check = "NOT (clean = 'pass' AND n_cells = 4 AND f64_in_band AND f32_in_band AND draws_exact AND sequences_exact AND nondesigned_hold AND checkpoint_matches AND n_listed = 8 AND n_failed = n_listed)"

[outcomes.fail]
condition = "NOT (clean = 'pass' AND n_cells = 4 AND f64_in_band AND f32_in_band AND draws_exact AND sequences_exact AND nondesigned_hold AND checkpoint_matches AND n_listed = 8 AND n_failed = n_listed)"
decision = "Do not treat mpnn_sample as graded. Read per_cell: an array outside its band names the stage; a draw or sequence miss with the arrays in band names the sampling convention; an undetected error means the comparison cannot discriminate it."
reasoning = "Either an array is outside its band, a non-fragile draw or sequence differs, non-designed positions moved, the checkpoint does not match the dump, or a control was not rejected."
is_residual = true
adversarial_check = "clean = 'pass' AND n_cells = 4 AND f64_in_band AND f32_in_band AND draws_exact AND sequences_exact AND nondesigned_hold AND checkpoint_matches AND n_listed = 8 AND n_failed = n_listed"

[result_schema]
clean = "str"
n_cells = "int"
f64_in_band = "bool"
f32_in_band = "bool"
draws_exact = "bool"
sequences_exact = "bool"
nondesigned_hold = "bool"
checkpoint_matches = "bool"
n_fragile_steps = "int"
n_rows_exempt_from_free_run = "int"
worst_over_band = "float"
n_listed = "int"
n_failed = "int"
mutants = "dict"
undetected = "list"
per_cell = "dict"

[dependencies]
aminx_version = { type = "git_sha", required = true, doc = "aminx commit SHA" }

[data]
oracle = "P4i N-row dump (dump_protonpotts_sample.py), upstream ProtonPottsMPNN @ 09682abf; the dump's own graded run is recorded in the spec"
features = "sealed P4b/P4c/P4d feature dumps"
checkpoint = "potts_v6_afdb_edge_his0.3_acid0.06/epoch-0125.ckpt via the converted state"
tolerances = "f64 1e-9 abs; f32 10x measured f32-vs-f64 spread per array, min 1e-6; draws exact except fragile (margin < 1e-5), reported"

[provenance]
note = "Pre-registered at the commit that adds this file, before protonpotts_sample_parity.py exists and before the P4i dump has been run. Graded invocation: bth run --project-slug aminx -- uv run --no-sync python scripts/parity/protonpotts_sample_parity.py --state-npz <v6_state.npz> --sample-dir <dir holding protonpotts_v6_sample/ and sample_manifest.json> --features-dir ~/projects/aminx-oracles-protonpotts"
