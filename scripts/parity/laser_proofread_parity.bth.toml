[metadata]
title = "LASErMPNN proofread parity"
created = "260930"
schema_version = "0.3"

[experiment]
hypothesis = "On five complexes with injected scalar-dropout masks, n_orders=2 and n_dropouts=1, aminx proofread mean and ddof=1 std match upstream within 1e-4."
stage_name = "confirmation"
novel = false

[outcomes.pass]
condition = "clean = 'pass' AND n_listed > 0 AND n_failed = n_listed"
decision = "Proofread mean and std are inside the pre-registered pass band, and every negative control failed."
reasoning = "max |delta mean| and max |delta std| are both <= 1e-4, and reduction swap, ddof=0, scalar dropout off and vector dropout on all land in fail."
is_residual = false
adversarial_check = "NOT (clean = 'pass' AND n_listed > 0 AND n_failed = n_listed)"

[outcomes.inconclusive]
condition = "clean = 'inconclusive' AND n_listed > 0 AND n_failed = n_listed"
decision = "The clean arm is inside the inconclusive band and every negative control failed."
reasoning = "The worse of max |delta mean| and max |delta std| is in (1e-4, 1e-3], with all four controls in fail."
is_residual = true
adversarial_check = "NOT (clean = 'inconclusive' AND n_listed > 0 AND n_failed = n_listed)"

[outcomes.fail]
condition = "NOT (clean IN ('pass', 'inconclusive') AND n_listed > 0 AND n_failed = n_listed)"
decision = "Do not treat proofreading as parity; the band or a negative control failed."
reasoning = "A miss above 1e-3, a non-finite std, an empty mutant list, or a negative control that does not fail falsifies the vehicle."
is_residual = true
adversarial_check = "clean IN ('pass', 'inconclusive') AND n_listed > 0 AND n_failed = n_listed"

[result_schema]
clean = "str"
n_listed = "int"
n_failed = "int"
max_abs_mean = "float"
max_abs_std = "float"

[dependencies]
aminx_version = { type = "git_sha", required = true, doc = "aminx commit SHA" }

[data]
laser_root_env = "AMINX_LASER_ROOT (defaults to ~/repos/LASErMPNN)"
example_pdb = "example_pdbs/4jnj-1_prot.pdb"
example_sha256 = "0a933729c4915cfee14ff34408a57e1d65fd98845df189ba79ad4f4d8470ae7e"
checkpoint = "model_weights/laser_weights_0p1A_nothing_heldout.pt"
checkpoint_sha256 = "304fe02a4807c310bdd9d68c988ae87619da3cf2025d5c223fb31030aa411173"
fixtures = "4jnj-1_prot.pdb plus 101m_1, 102m_1, 103m_1, 104m_1"
pass_rule = "max |delta mean| <= 1e-4 AND max |delta std| <= 1e-4"
inconclusive_band = "(1e-4, 1e-3]"
fail_rule = "> 1e-3"
negative_controls = "reduction swap (std over reps) -> fail; ddof=0 -> fail; scalar dropout off -> |delta mean| > 1e-3; vector dropout on -> fail"
"101m_1.pdb" = "5ee11918c0c71703859cc057cd3225583fb397909ba0e294c1f97f8e39448a9f"
"102m_1.pdb" = "cfb756a7e48b87344d4c9fb76ff93b29596f6b400c207a0e45f53066358e6ee4"
"103m_1.pdb" = "f8edd971b7754e0c30f7e3ae56fa64ad120338d50708873aa4019f180210201d"
"104m_1.pdb" = "44f0347958f06f13b8bd7f171d94cb54d3665c419539247eb21a127a1ef98ed8"

[provenance]
note = "Graded invocation: uv run --no-sync python3 scripts/parity/laser_proofread_parity.py --mutants reduction_swap,ddof_0,scalar_off,vector_on --controls-out $SC/laser_proofread_parity/<git-sha8>/branch_controls.json. Pass is the spec line 1181 pre-registration (max |delta mean| and max |delta std| <= 1e-4; inconclusive (1e-4, 1e-3]; fail > 1e-3) and is not adjustable. The clean arm and each mutant arm run in a fresh subprocess. Not run by the B7 fixer."
