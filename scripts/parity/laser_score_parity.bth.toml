[metadata]
title = "LASErMPNN score log-prob parity"
created = "260930"
schema_version = "0.3"

[experiment]
hypothesis = "LaserDriver score:nll matches upstream per-position sequence log-probabilities on 4jnj-1_prot.pdb and the 20 pinned complexes, with max |delta log-prob| <= 1e-4."
stage_name = "confirmation"
novel = false

[outcomes.pass]
condition = "clean = 'pass' AND n_listed > 0 AND n_failed = n_listed"
decision = "Log-prob parity is inside the pass band and permute_decoder_layer failed."
reasoning = "Every |delta log-prob| is at most 1e-4, and the decoder-layer permutation is outside 1e-3."
is_residual = false
adversarial_check = "NOT (clean = 'pass' AND n_listed > 0 AND n_failed = n_listed)"

[outcomes.inconclusive]
condition = "clean = 'inconclusive' AND n_listed > 0 AND n_failed = n_listed"
decision = "Log-probs sit in (1e-4, 1e-3]; do not claim the pass band."
reasoning = "The negative control still fails, so the comparison is alive, but at least one position is above 1e-4 and at most 1e-3."
is_residual = false
adversarial_check = "NOT (clean = 'inconclusive' AND n_listed > 0 AND n_failed = n_listed)"

[outcomes.fail]
condition = "NOT (clean IN ('pass', 'inconclusive') AND n_listed > 0 AND n_failed = n_listed)"
decision = "Do not treat score:nll as parity; the band or the negative control failed."
reasoning = "A deviation above 1e-3, an empty mutant list, or a negative control that does not fail falsifies the vehicle."
is_residual = true
adversarial_check = "clean IN ('pass', 'inconclusive') AND n_listed > 0 AND n_failed = n_listed"

[result_schema]
clean = "str"
n_listed = "int"
n_failed = "int"
max_abs_delta = "float"

[dependencies]
aminx_version = { type = "git_sha", required = true, doc = "aminx commit SHA" }

