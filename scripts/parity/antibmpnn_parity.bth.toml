# AntiBMPNN parity vehicle -- P4 redo (task 261104_p4-antibmpnn). Replaces the PR #261 sidecar, whose clean
# arm diffed aminx against aminx and whose weights were never loaded.
#
# DISCLOSURE (before this file was committed): the harness was debugged by running the clean arm and the seven
# mutant arms once against the sealed dump, so the author had seen the stage magnitudes: f64 ~1e-13, f32 features
# 6.2e-5 / encoder 5.6e-5 / logits 1.68e-4 (above the 1e-4 pass band, so a MARGINAL clean verdict is the expected
# result), and that the earlier hand-typed PD1/PD2 table in aminx.model.cdr_bias disagreed with
# peptides.tables.PHYSICAL_DESCRIPTORS (fixed in the same commit as this sidecar). No band below was chosen from
# those numbers: f64 1e-7 and f32 1e-4 are the bands the P4 brief fixes, the (1e-4, 1e-3] marginal band and the
# >1e-3 fail band are the LASEr/thermo convention.
#
# WALL TIME (measured on titanix CPU, JAX_PLATFORMS=cpu, OMP_NUM_THREADS=4): clean arm ~46 s, each mutant arm
# ~20-26 s, whole run ~4 min. Each arm is its own interpreter with its own 3600 s timeout, nothing is long enough
# to need preemption-safe resume; a failed run is simply re-run (inputs are sha256-pinned below, so a rerun cannot
# silently grade different bytes). Nothing resume-related changes [outcomes].

[metadata]
title = "AntiBMPNN parity against a sealed real-upstream dump"
created = "261104"
schema_version = "0.3"

[experiment]
hypothesis = "aminx (JAX) matches the real AntiBMPNN upstream (protein_mpnn_utils.py + antibmpnn_{000..100}.pt on inputs/HuJ3/HuJ3.pdb, sealed dump) at every stage: PDB parse exact (<1e-9), edge features / encoder / teacher-forced log-probs within 1e-7 in float64 and 1e-4 in float32 for all 11 checkpoints, per-position sampling distribution and Gumbel-drawn tokens for two sampler configurations (cdr5, knobs) within 1e-4 with zero token mismatches, the shipped antibmpnn_v_48_{000,010,020,030} Hub weights equal to the .pt, and the design descriptors (PD1, PD2, Lehninger charge) equal to peptides 0.5.0 as called by helper_scripts/parsing_design_result.py; and each of seven aminx-side code perturbations drives its designated stage above 1e-3."
stage_name = "validation"
novel = false

[controls]
positive_outcome = ["pass"]
negative_outcome = ["fail", "marginal"]

[outcomes.pass]
condition = "clean == 'pass' AND weight_source == 'upstream_checkpoint' AND oracle_verified == 1 AND max_abs_f64 < 1e-7 AND max_abs_f32 < 1e-4 AND parse_max_abs < 1e-9 AND sampler_token_mismatch == 0 AND n_checkpoints == 11 AND n_listed == 7 AND n_failed == n_listed"
decision = "AntiBMPNN is at numerical parity with the real upstream; record the sidecar in the AntiBMPNN ledger shard."
reasoning = "Every stage is inside the f64 1e-7 / f32 1e-4 band against the sealed dump of the real code and weights, sampler tokens agree exactly, and all seven negative controls leave the fail band."
is_residual = false

[outcomes.marginal]
condition = "weight_source == 'upstream_checkpoint' AND oracle_verified == 1 AND max_abs_f64 < 1e-5 AND max_abs_f32 < 1e-3 AND (max_abs_f64 >= 1e-7 OR max_abs_f32 >= 1e-4) AND parse_max_abs < 1e-9 AND sampler_token_mismatch == 0 AND n_checkpoints == 11 AND n_listed == 7 AND n_failed == n_listed"
decision = "Do not claim the 1e-4 float32 band; report float32 drift as measured and rely on the float64 result for algorithmic equality."
reasoning = "The comparison is alive (negative controls all fail, tokens agree, f64 is inside its band) but at least one float32 gap is in [1e-4, 1e-3) or one float64 gap is in [1e-7, 1e-5)."
is_residual = false

[outcomes.fail]
condition = "NOT (weight_source == 'upstream_checkpoint' AND oracle_verified == 1 AND max_abs_f64 < 1e-5 AND max_abs_f32 < 1e-3 AND parse_max_abs < 1e-9 AND sampler_token_mismatch == 0 AND n_checkpoints == 11 AND n_listed == 7 AND n_failed == n_listed)"
decision = "Block: a stage disagrees with the real upstream, an oracle or weight hash did not verify, or a negative control did not trip."
reasoning = "Anything outside the marginal envelope, a missing checkpoint, a token mismatch, an unverified sealed input, or a surviving mutant falsifies the vehicle."
is_residual = true

[result_schema]
clean = "str"
n_listed = "int"
n_failed = "int"
oracle_verified = "int"
weight_source = "str"
n_checkpoints = "int"
max_abs_f64 = "float"
max_abs_f32 = "float"
parse_max_abs = "float"
features_f32 = "float"
encoder_f32 = "float"
logits_f32 = "float"
sampler_f32 = "float"
published_f32 = "float"
descriptors_csv = "float"
descriptors_direct = "float"
descriptors_ph_sweep = "float"
sampler_token_mismatch = "int"
mutant_values = "dict"

