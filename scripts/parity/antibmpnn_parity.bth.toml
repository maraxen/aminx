[provenance]
note = "Graded invocation on titanix: bth run -- uv run --no-sync python scripts/parity/antibmpnn_parity.py --oracle-dir $ANTIBMPNN_ORACLE_DIR --antibmpnn-root /home/solab/repos/AntiBMPNN --mutants reversed_ar_mask,zero_edge_embedding,swap_checkpoint_noise,omit_penalty_dropped,lehninger_pka_shifted,barley_tables_swapped,parser_wrong_atom_order --controls-out $SC/antibmpnn_parity/<git-sha8>/branch_controls.json. Injection points: decoding order via the randn argument of ProteinMPNN.forward/sample (protein_mpnn_utils.py:1057,1104), categorical draw via torch.multinomial at :1180 replaced by a Gumbel-max on stored noise, float64 via a torch.Tensor.float patch (upstream hard-codes .float() at :734,:1084,:1121; no source edit). Float64 sampler is not graded: upstream allocates all_probs as float32 (:1130)."
