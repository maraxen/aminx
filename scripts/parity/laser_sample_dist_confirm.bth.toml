[metadata]
title = "LASEr distributional CONFIRMATORY -- min_p cells the LASEr pilot derives (aminx production sampler vs upstream)"
created = "261004"
schema_version = "0.3"

[experiment]
hypothesis = "aminx's production LASErMPNN sampler (LaserDriver sample purpose, float32, its own jax.random keys) draws per-position amino-acid distributions AND chi1 distributions indistinguishable from upstream LASErMPNN within the pilot-derived margins, for every cell among min_p0@0.3, min_p0@1.0, min_p0.05@0.3 that the LASEr pilot derives with shim_ok, on the confirmatory structures 4jnj-1_prot and laser_score_parity entries 3-6 (103m_1, 104m_1, 105m_1, 106m_1). Spec rule per cell and per metric (sequence TV at delta; chi1 TV over 36x10deg bins at modal-AA chi1 positions, at delta_chi = 0.05): pooled Delta_bar = mean_s [D(A,U1) - D(U2,U1)]; pass = 95% one-sided bootstrap upper bound < margin AND max_s Delta_s < 2 margin; fail = 90% CI lower bound > margin; else inconclusive. A cell's verdict is the worse of its sequence and chi1 verdicts (fail > inconclusive > pass); sidecar pass iff every selected cell passes. The instrument must also discriminate: the negative control for every cell (aminx at m*T, chi temperature scaled the same way) must grade 'fail' on sequence or chi1 under the same rule."
stage_name = "confirmatory"
novel = true

[outcomes.pass]
condition = "sidecar_verdict = 'pass' AND controls_all_fail = true AND smoke = false"
decision = "List laser_sample_dist (the selected cells) as passing in the distributional tier; min_p0@0.1 waits on the user's decision doc and any pilot cell that did not derive cleanly stays unlisted."
reasoning = "Every selected cell sits inside its pre-registered sequence and chi1 margins, and every negative control was detected, so the test had power to see a near-margin defect."
is_residual = false
adversarial_check = "NOT (sidecar_verdict = 'pass' AND controls_all_fail = true AND smoke = false)"

[outcomes.fail]
condition = "sidecar_verdict = 'fail' AND controls_all_fail = true AND smoke = false"
decision = "aminx's LASEr sampling distribution differs from upstream beyond a margin in at least one cell: open a debt item naming the cell, the metric (sequence or chi1) and its per-structure Delta_s, and investigate before any listing."
reasoning = "The instrument discriminates (controls fail) and a selected cell's 90% lower bound exceeds its margin."
is_residual = false
adversarial_check = "NOT (sidecar_verdict = 'fail' AND controls_all_fail = true AND smoke = false)"

[outcomes.instrument_invalid]
condition = "controls_all_fail = false AND smoke = false"
decision = "A negative control did not grade 'fail', so a pass here would mean nothing: report which control and cell; no listing."
reasoning = "Spec: negative controls must fail."
is_residual = true
adversarial_check = "NOT (controls_all_fail = false AND smoke = false)"

[outcomes.inconclusive]
condition = "sidecar_verdict = 'inconclusive' AND controls_all_fail = true AND smoke = false"
decision = "Report per cell and metric; no listing and no failure claim. Any n escalation is a NEW pre-registration."
reasoning = "Spec: neither the pass nor the fail bound is met."
is_residual = true
adversarial_check = "NOT (sidecar_verdict = 'inconclusive' AND controls_all_fail = true AND smoke = false)"

[outcomes.smoke]
condition = "smoke = true"
decision = "Plumbing check only (cell min_p0@1.0, n=50, B=50, structure 103m_1, fixed smoke-only constants); cites nothing."
reasoning = "A smoke run is not the confirmatory test."
is_residual = true
adversarial_check = "NOT (smoke = true)"

[result_schema]
sidecar_verdict = "str"
controls_all_fail = "bool"
n_controls = "int"
cells = "dict"
cells_selected = "list"
structures = "dict"
pilot_run_id = "str"
n_reused = "int"
n_computed = "int"
script_sha256 = "str"
smoke = "bool"

[data]
pilot = "The LASEr pilot (scripts/parity/laser_sample_dist_pilot.py @ 96a148ba, cells min_p0@0.3, min_p0@1.0, min_p0.05@0.3, structures 101m_1 and 102m_1) is still running when this is written. Its bathos run id becomes the driver's PILOT_RUN_ID, which the result echoes as pilot_run_id. Only cells the pilot derives with shim_ok are carried forward; a cell the pilot marks instrument_invalid or not_derived is excluded and named in the commit that fills the constants."
constants = "Per cell: delta, delta_chi, m, h_hat, n, copied verbatim from the pilot's bathos record into the driver's CELLS module constant in a commit made BEFORE any non-smoke run and never recomputed. B = 2000. The outcome rules above do not depend on their values; the driver refuses a non-smoke run while PILOT_RUN_ID is unset or a selected cell is missing from CELLS."
excluded = "min_p0@0.1: pending user decision .praxia/docs/decisions/261004_sample-dist-pilot-fixtures-and-low-t.md; the driver refuses it. This run says nothing about it."
structures = "4jnj-1_prot (0a933729...) plus laser_score_parity entries 3-6: 103m_1 (f8edd971...), 104m_1 (44f03479...), 105m_1 (b5a7cc4d...), 106m_1 (394e9198...), pinned by SHA-256 in the driver. Never seen by the pilot."
arms = "A and CTRL_m: aminx production LaserDriver sample purpose via runner.sample (model_family lasermpnn), float32 asserted, jax.random keys from the unit seed, no injected uniforms. U1: upstream with iid-uniform shim. U2: upstream unshimmed. Both upstream arms via the pilot's worker on the CPU-only oracle venv. Seeds disjoint across all units and from the pilot's."
resume = "Every (cell, structure, run) unit persisted with a completion stamp via graded_resume and reused only on matching input/checkpoint/script SHA-256; aminx units run one subprocess each with a per-unit timeout; no whole-run timeout."
prior_exposure = "No confirmatory-structure samples from either sampler have been seen. A --smoke run (smoke=true, its own outcome) may precede this to check plumbing."
