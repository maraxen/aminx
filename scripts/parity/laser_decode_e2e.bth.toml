[provenance]
note = "Graded invocation: uv run --no-sync python3 scripts/parity/laser_decode_e2e.py --mutants reversed_order,chi_bin_plus_one,offset_zero,chi2_equals_chi1,lambda_on_logits --controls-out $SC/laser_decode_e2e/<git-sha8>/branch_controls.json. Pass is the spec §7.3 line 1179 pre-registration (exact sequence, chi-bin 1.0, max circular |delta chi_deg| <= 1e-6 degrees on chi_mask, plus the tied fixture) and is not adjustable. There is no inconclusive band. The clean arm and each mutant arm run in a fresh subprocess. Not run by the B7 fixer."
