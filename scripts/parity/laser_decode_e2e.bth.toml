[metadata]
title = "LASErMPNN joint decode end-to-end parity"
created = "260930"
schema_version = "0.3"

[experiment]
hypothesis = "On the 21 laser_score fixtures, an injected decoding order and argmax for sequence and chi, aminx matches upstream exactly in sequence and chi-bin (agreement 1.0) and max circular |delta chi_deg| <= 1e-6 degrees (f64) on chi_mask."
stage_name = "confirmation"
novel = false

[outcomes.pass]
condition = "clean = 'pass' AND n_listed > 0 AND n_failed = n_listed"
decision = "Sequence, chi-bin and circular chi degrees are inside the pre-registered pass band, and every negative control failed."
reasoning = "Exact sequence, chi-bin agreement 1.0 and max circular |delta chi_deg| <= 1e-6 degrees on chi_mask, with reversed order, chi bin +1, offset := 0, tied chi2 := chi1 and lambda on logits all in the fail band."
is_residual = false
adversarial_check = "NOT (clean = 'pass' AND n_listed > 0 AND n_failed = n_listed)"

[outcomes.fail]
condition = "NOT (clean = 'pass' AND n_listed > 0 AND n_failed = n_listed)"
decision = "Do not treat joint decode as parity; the band or a negative control failed."
reasoning = "There is no inconclusive band. Any miss of exact sequence, chi-bin 1.0 or 1e-6 degrees, an empty mutant list, or a negative control that does not fail falsifies the vehicle."
is_residual = true
adversarial_check = "clean = 'pass' AND n_listed > 0 AND n_failed = n_listed"

[result_schema]
clean = "str"
n_listed = "int"
n_failed = "int"
sequence_agreement = "float"
chi_bin_agreement = "float"
max_circular_delta = "float"

[dependencies]
aminx_version = { type = "git_sha", required = true, doc = "aminx commit SHA" }

[data]
laser_root_env = "AMINX_LASER_ROOT (defaults to ~/repos/LASErMPNN)"
