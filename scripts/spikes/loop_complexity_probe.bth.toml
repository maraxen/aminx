[experiment]
hypothesis = "Trace-only jaxpr work ratios (xtrax loop_bodies; extent_scaling_report on the scan self-test only) reproduce spec 261124 D2/D5 before any graded run. Criterion A clean loops stay under 1.5 (ligand tiling and its multi and ragged extents, score_pairs over K and over C, kernel_dispatch chunked seam, Scan dispatch, encode scan over S). Criterion B clean loops stay under 3.0 (STEDecode untied and tied, optimize_ste, score_pairs over L, encode scan over L). Whole-body fold mutants are at least 1.7 on A and above 3.5 on B, including the optimize_ste and Scan mutants. The Q2 per-pair re-encode mutant stays under 1.5 over K (criterion A cannot see it) and inflates per-iteration work by more than 1.05. The instrument self-test is an O(1) scan body with ratio in (0.8, 1.2) and an (L, d) recompute with ratio in [1.7, 2.5)."
question = "Do the pre-registered clean and fold-mutant work-ratio bounds hold on the in-scope loops, and does the instrument fire only on the recomputing toy?"
stage_name = "exploration"
novel = true

[observe]
outputs = ["clean A/B ratios", "fold-mutant ratios", "per-pair re-encode inflation", "instrument self-test"]
looking_for = "Clean A ratios under 1.5, clean B under 3.0, A mutants at or above 1.7, B mutants above 3.5, re-encode inflation above 1.05 with K-extent ratio still under 1.5, and a self-test that passes only when both controls land."
sanity = ["elapsed_s >= 0"]

[outcomes.instrument_self_test]
condition = """
mode = 'self_test'
AND refused = false
AND self_test_o1_ratio > 0.8
AND self_test_o1_ratio < 1.2
AND self_test_fold_ratio >= 1.7
AND self_test_fold_ratio < 2.5
"""
decision = "Instrument controls passed: O(1) body near 1.0 (must not fire) and (L, d) recompute near 2 (must fire)."
reasoning = "Thresholds are the spec D2 split (1.5) with a tighter window around the two synthetic ratios. This branch is the self-test path only."
source = "provisional:spec 261124 D2/D5 thresholds fixed before the graded probe run"
is_residual = false

[outcomes.pass]
condition = """
mode = 'probe'
AND refused = false
AND sentinels_fired = true
AND self_test_o1_ratio > 0.8
AND self_test_o1_ratio < 1.2
AND self_test_fold_ratio >= 1.7
AND self_test_fold_ratio < 2.5
AND tiling_clean_r1 < 1.5 AND tiling_clean_r2 < 1.5
AND tiling_multi_clean_r1 < 1.5 AND tiling_multi_clean_r2 < 1.5
AND tiling_ragged_clean_r1 < 1.5 AND tiling_ragged_clean_r2 < 1.5
AND tiling_multi_ragged_clean_r1 < 1.5 AND tiling_multi_ragged_clean_r2 < 1.5
AND score_k_clean_r1 < 1.5 AND score_k_clean_r2 < 1.5
AND score_c_clean_r1 < 1.5 AND score_c_clean_r2 < 1.5
AND seam_clean_r1 < 1.5 AND seam_clean_r2 < 1.5
AND scan_clean_r1 < 1.5 AND scan_clean_r2 < 1.5
AND encode_s_clean_r1 < 1.5 AND encode_s_clean_r2 < 1.5
AND ste_untied_clean_r1 < 3.0 AND ste_untied_clean_r2 < 3.0
AND ste_tied_clean_r1 < 3.0 AND ste_tied_clean_r2 < 3.0
AND optimize_ste_clean_r1 < 3.0 AND optimize_ste_clean_r2 < 3.0
AND score_l_clean_r1 < 3.0 AND score_l_clean_r2 < 3.0
AND encode_l_clean_r1 < 3.0 AND encode_l_clean_r2 < 3.0
AND tiling_mut_r1 >= 1.7 AND tiling_mut_r2 >= 1.7
AND score_k_mut_r1 >= 1.7 AND score_k_mut_r2 >= 1.7
AND score_c_mut_r1 >= 1.7 AND score_c_mut_r2 >= 1.7
AND seam_mut_r1 >= 1.7 AND seam_mut_r2 >= 1.7
AND scan_mut_r1 >= 1.7 AND scan_mut_r2 >= 1.7
AND encode_s_mut_r1 >= 1.7 AND encode_s_mut_r2 >= 1.7
AND ste_untied_mut_r1 > 3.5 AND ste_untied_mut_r2 > 3.5
AND ste_tied_mut_r1 > 3.5 AND ste_tied_mut_r2 > 3.5
AND optimize_ste_mut_r1 > 3.5 AND optimize_ste_mut_r2 > 3.5
AND score_reencode_k_r1 < 1.5 AND score_reencode_k_r2 < 1.5
AND score_reencode_inflation > 1.05
"""
decision = "Clean ratios sit under the spec bounds and every whole-body fold mutant clears its margin."
reasoning = "A clean < 1.5, B clean < 3.0, A mutant >= 1.7, B mutant > 3.5, as fixed in spec 261124 D2/D5. Both consecutive extent ratios must clear the bound. The Q2 re-encode mutant must inflate work and still look flat over K."
source = "provisional:spec 261124 D2/D5 thresholds fixed before the graded probe run"
is_residual = false

[outcomes.fail]
condition = """
NOT (
  mode = 'self_test'
  AND refused = false
  AND self_test_o1_ratio > 0.8
  AND self_test_o1_ratio < 1.2
  AND self_test_fold_ratio >= 1.7
  AND self_test_fold_ratio < 2.5
)
"""
decision = "The probe missed a pre-registered bound, the instrument failed, or the run refused."
reasoning = "Catch-all for a completed probe that misses D2/D5, a self-test whose controls miss their windows, and any refusal payload. Evaluated after instrument_self_test and pass."
source = "provisional:spec 261124 D2/D5 thresholds fixed before the graded probe run"
is_residual = true

