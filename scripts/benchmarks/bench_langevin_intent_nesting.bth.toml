[result_schema.provenance]
hardware_targets = ["Engaging pi_so3 node4007/node4008 (NVIDIA RTX PRO 6000 Blackwell, SM120, 96 GB), XLA_FLAGS=--xla_gpu_shard_autotuning=false"]
hazard_source = "aminx .praxia/docs/audits/260716_proteinebm-parity-report.md:545-557 and scripts/ebm/benchmarks/langevin_benchmark.py:_chunked_vmap: SafeMap (jax.lax.map) around run_langevin_equilibration's while_loop hung >1 h compiling the L=128/batch=400 cell on node4008 (SLURM 18182309); the Python-chunked vmap fix (commit 0faa1d0) ran the full cell in 104 s (18192077). This run uses batch 64 (the largest batch vmap is confirmed safe at for L=128, SAFE_TRAJECTORY_BATCH_BY_LENGTH) so that the vmap arm and intent's Vmap resolution both fit."
intent_rule = "xtrax src/xtrax/intent/resolve.py: HAZARDS scan_around_while (severity error) on backends {cuda, gpu}, 'accepted for both until measured otherwise'; _with_hazards moves a ChunkedMap outer map back to Vmap when Vmap fits the budget, else raises UnsatisfiableContextError. compile.py _posthoc rejects any executed scan that encloses a while on those backends. With no memory budget, intent.map plans Vmap without consulting the rule; the intent_tight cell exercises the budgeted path."
metric_notes = "grad_rel_l2_global = ||g_ref - g_intent|| / ||g_ref|| over all parameter and coordinate leaves together. The per-leaf maximum is reported, not gated: in the CPU smoke a LayerNorm bias the loss is invariant to had true gradient ~2e-10 of the global norm, and per-leaf relative L2 compared rounding noise to rounding noise (0.48 with a 1e-30 floor, 4e-4 with a 1e-6-of-global floor) while every other leaf was bit-exact. intent_vs_vmap_compile includes intent.compile's planning pass (primal and diff traces, once per signature); intent_first_call_vs_vmap_compile excludes it and is reported only. The 1.5x bound (vs 1.25x for the AR workload's plain intent sites) allows for that pass."
xtrax_rev = "126bf5c (xtrax main 7329b1e + PR #229), pinned in pyproject [tool.uv.sources]"
resume = "Each (form, kind) cell runs in its own process (--cell-timeout-s 3600; the safemap_while and intent_tight cells --hazard-timeout-s 2400, recorded as censored on timeout rather than failing the run) and writes <out>_cells/<form>_<kind>.json atomically, stamped with the config sha256 (shapes, chunk, repeats, seed, model) and the git hash; a rerun reuses a cell only when both match, censored cells included, and logs which cells it reused. Each primal and plan cell writes <cell>.pre.json (jaxpr nesting flags, budget) before compiling, so a censored cell keeps them."
wall_estimate = "Bounded by the two hazard cells (2 x 2400 s worst case) plus four cells of a few minutes each (model init and vmap/scan compiles of a depth-16 trunk; not profiled at production shape beforehand, since compile time is the measured quantity): 0.5-1.7 h. Submitted with a 4 h walltime."
task_id = "261023_equinox-decouple-pallas (xtrax); aminx backlog #6105"
contention = "Every cell records load_1m (start, end) and nvidia-smi utilization/memory of its GPU; max_load_1m is reported and NOT gated. On Engaging the node is shared with other jobs on its other GPU. A fail on a timing ratio is read against these records before it is attributed to xtrax.intent."
notes = "CPU smoke with --model tiny at L=16/batch 8 (untracked, 261025) ran all 6 cells, resumed with all 6 reused, and aggregated; its numbers are not findings. It confirmed the hazard arm's jaxpr nests a while inside a scan, intent's does not and resolves the outer map to Vmap, and the tight-budget cell refuses (on CPU via the budget, before the hazard rule). It also produced the per-leaf gradient artifact described in metric_notes, bisected before registration: plain intent.map/intent.loop, vmap(intent.loop) and intent.map(lax.scan) gradients are bit-exact against the reference; under intent.compile only the invariant LayerNorm bias leaf differs, at ~1e-10 absolute."

[dependencies]
aminx_version = { type = "git_sha", required = true }
jax_version = { type = "string", required = true }
