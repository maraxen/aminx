[metadata]
title = "Langevin trajectories under an outer map on SM120: does xtrax.intent avoid the while-under-scan compile hazard, refuse quickly when it cannot, and differentiate exactly"
created = "261025"
schema_version = "0.3"

[experiment]
hypothesis = "On Blackwell (SM120) at production EBM shapes (token_s 256, token_z 128, depth 16, heads 8; L=128, 64 trajectories, 20 Langevin steps, chunk 16), jax.lax.map around run_langevin_equilibration's while_loop compiles at least 10x slower than jax.vmap around it (or does not finish within 2400 s). xtrax.intent.compile of intent.map around intent.loop resolves the outer map to Vmap, emits no while inside a scan, matches the vmap form's outputs (max abs <= 1e-5) at <= 1.5x its compile time including planning and <= 1.10x its median step, with zero steady-state recompiles. Planned under a memory budget of half the vmap estimate, it refuses (UnsatisfiableContextError) within 600 s instead of compiling the hazard. Under grad (L=64, 4 trajectories, 4 steps) it matches a hand-written vmap/lax.scan reference (global relative L2 <= 1e-4) with no while in the gradient program, at <= 1.10x the reference's peak device memory. This is xtrax.intent MVP criterion 8, second workload (spec .praxia/docs/superpowers/specs/261023_intent-resolution-design.md in xtrax, section 5), registered after the AR-decode workload (bench_ar_intent_loop, bathos run 3b93937a) returned no_contrast."
stage_name = "validation"
novel = true

[controls]
# Instrument validity, checked first: the hazard arm must actually place a while inside a scan
# (read from its jaxpr before compiling) and must compile at least 10x slower than the vmap arm,
# or time out. Without that, there is no hazard for the resolved form to avoid.
positive_outcome = ["pass"]
negative_outcome = ["no_contrast", "resolved_ok_planner_hazard", "fail"]

[outcomes.no_contrast]
condition = "NOT (hazard_scan_encloses_while = true AND (hazard_timed_out = true OR compile_contrast >= 10.0))"
decision = "Do not interpret the intent criteria: on this hardware and JAX version, lax.map around the while_loop does not compile meaningfully slower than vmap around it (or the hazard arm did not nest). The scan_around_while rule is then unmeasured; criterion 8 stays open and xtrax.intent stays experimental."
reasoning = "Pairs the positive result with a control that must show the effect being avoided. Prior record: SLURM 18182309 (lax.map form) did not finish compiling in 1 h; 18192077 (Python-chunked vmap) finished the whole cell in 104 s."
is_residual = false

[outcomes.pass]
condition = "hazard_scan_encloses_while = true AND (hazard_timed_out = true OR compile_contrast >= 10.0) AND intent_scan_encloses_while = false AND intent_outer_strategy = 'Vmap' AND intent_vs_vmap_max_abs <= 1e-5 AND intent_vs_vmap_compile <= 1.5 AND intent_vs_vmap_step <= 1.10 AND intent_steady_recompiles = 0 AND grad_nonzero = true AND grad_rel_l2_global <= 1e-4 AND intent_grad_has_while = false AND intent_vs_ref_grad_peak > 0 AND intent_vs_ref_grad_peak <= 1.10 AND tight_timed_out = false AND tight_plan_s <= 600 AND starts_with(tight_result, 'unsat:')"
decision = "Criterion 8 passes on the hazard workload: xtrax.intent may leave experimental (skill decision trees go intent-first, backlog #6091), with the skills stating that the AR-decode workload showed no compile contrast to recover."
reasoning = "The intent layer's promise for nested loops on GPU: never emit the hazard, run as fast as the hand fix, refuse loudly instead of hanging, and differentiate exactly."
is_residual = false

[outcomes.resolved_ok_planner_hazard]
condition = "hazard_scan_encloses_while = true AND (hazard_timed_out = true OR compile_contrast >= 10.0) AND intent_scan_encloses_while = false AND intent_outer_strategy = 'Vmap' AND intent_vs_vmap_max_abs <= 1e-5 AND intent_vs_vmap_compile <= 1.5 AND intent_vs_vmap_step <= 1.10 AND intent_steady_recompiles = 0 AND grad_nonzero = true AND grad_rel_l2_global <= 1e-4 AND intent_grad_has_while = false AND intent_vs_ref_grad_peak > 0 AND intent_vs_ref_grad_peak <= 1.10 AND NOT (tight_timed_out = false AND tight_plan_s <= 600 AND starts_with(tight_result, 'unsat:'))"
decision = "The resolved programs avoid the hazard, but planning under a memory budget does not: default_estimator compiles chunked_map around the while to price ChunkedMap, which is the hazard itself. Fix the estimator (do not compile a ChunkedMap estimate around a StaticWhile on a scan_around_while backend) and re-run the intent_tight cell alone (resume reuses the other cells only if the git hash is unchanged, so this is a new registration) before criterion 8 is cited. Stage 2 (#6091) waits for that re-run."
reasoning = "Predicted from reading xtrax resolve.py/estimators.py at registration: lowered_memory_estimate does a real AOT compile of each candidate strategy."
is_residual = false

[outcomes.fail]
condition = "hazard_scan_encloses_while = true AND (hazard_timed_out = true OR compile_contrast >= 10.0) AND NOT (intent_scan_encloses_while = false AND intent_outer_strategy = 'Vmap' AND intent_vs_vmap_max_abs <= 1e-5 AND intent_vs_vmap_compile <= 1.5 AND intent_vs_vmap_step <= 1.10 AND intent_steady_recompiles = 0 AND grad_nonzero = true AND grad_rel_l2_global <= 1e-4 AND intent_grad_has_while = false AND intent_vs_ref_grad_peak > 0 AND intent_vs_ref_grad_peak <= 1.10)"
decision = "Criterion 8 fails on the hazard workload: xtrax.intent stays experimental; investigate the failing criterion (a resolved nesting, non-equivalence, a compile or step regression, a recompile, a gradient or memory regression, or missing peak-memory stats) before any skill or default change."
reasoning = "Residual catch-all."
is_residual = true

