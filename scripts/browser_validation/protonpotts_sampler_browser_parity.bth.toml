[metadata]
title = "X8c browser parity: the shipping ProtonPotts sampler page in headless Chromium vs the unpadded eager decoder, at 1 and 4 threads"
created = "261009"
schema_version = "0.3"

[experiment]
hypothesis = """
The shipping page browser/protonpotts-scorer/sampler_index.html + sampler_page.mjs -- which runs `ProtonPottsSampler.sample` from PDB text
(featurization and padding in JS, encode graph, decode graph with injected noise and uniforms, trimming) -- served over HTTP with COOP/COEP
and driven in headless Chromium through browser/layer_c/run_p07.mjs unchanged, reproduces aminx's eager decoder run UNPADDED
(make_encode / make_decode on the unpadded structure) on the twelve cases of the Node sampler gate (protonpotts_sampler_gate, X8b:
4 structures x default / bias_temp / fixed): sequences and decoding orders exactly, log-probabilities max|d|/max|ref| <= 1e-4 (fragile
cases, measured on the reference as a draw within 1e-5 of a CDF boundary, exempt on sequence and reported); at numThreads 1 AND 4. The
cases, seeds, streams and comparator are the Node gate's, so the records grade the same inputs. Seeded path, per structure: seed 11 twice
identical, seeds 11 and 12 different (as X8b), at both thread settings.

crossOriginIsolated and the effective thread count as ORT reports it after init are recorded per run. The decoder graphs are the X8a
artifacts (manifest sha256 bacf2245...8c6b, verified); X8a found them bit-identical over five default-thread CPU runs, and this is the
end-to-end check that multi-threaded wasm in a browser also reproduces the reference.

Controls, per thread setting (each must make the SAME comparator fail): TOKENS -- the page with uniforms rolled by one position (bias_temp
cases, T >= 0.3) against the reference; FLOAT -- the reference rerun with perturbed decoder weights compared on log-probabilities.

PREDICTION, stated before the run so it can be wrong: all twelve cases agree at both thread settings, seeded checks hold, both controls
fire. Risks: (a) the 1024-bucket decode loop is slow enough to approach the harness timeout in wasm; that shows as an incomplete run, not
a disagreement; (b) a 4-thread reduction-order difference flipping a near-tied draw that is not caught by the fragile margin, which would
show as a named sequence mismatch.
"""
stage_name = "validation"
novel = true
# No [reproduction]: novel. Mirrors protonpotts_ph_browser_parity (X7c) and protonpotts_sampler_gate (X8b).

[controls]
positive_outcome = ["pass"]
negative_outcome = ["error", "not_isolated", "instrument_unverified", "fail"]

# Declaration ORDER is load-bearing: bathos takes the FIRST matching branch.

[outcomes.error]
condition = "jax_arm_ok = false OR artifacts_verified = false OR browser_complete = false"
decision = "The reference arm, the artifact check, or the browser run at one of the two thread settings did not complete at full size. Nothing was compared against a complete browser run; cite nothing."
reasoning = "A partial browser run must not borrow the authority of a complete one."
is_residual = true

[outcomes.not_isolated]
condition = "browser_complete = true AND isolated_at_4 = false"
decision = "The page ran at 4 requested threads without crossOriginIsolated. Results from this run are not a threading result."
reasoning = "SharedArrayBuffer-backed multithreaded wasm needs COOP/COEP; otherwise ORT silently falls back to one thread."
is_residual = true

[outcomes.instrument_unverified]
condition = "browser_complete = true AND isolated_at_4 = true AND NOT (control_tokens_detected = true AND control_float_detected = true)"
decision = "At one thread setting a planted difference (rolled uniforms, perturbed weights) was not flagged. Passes from this run are not evidence."
reasoning = "A comparator that cannot see these differences would also pass a broken page."
is_residual = true

[outcomes.fail]
condition = "browser_complete = true AND isolated_at_4 = true AND control_tokens_detected = true AND control_float_detected = true AND NOT (all_exact = true AND seeded_ok = true)"
decision = "At least one case or seeded check disagrees at one thread setting. The per-case record names the case, thread setting and field."
reasoning = "The Node gate agrees, so a disagreement localises to the browser environment or the page plumbing."
is_residual = true

[outcomes.pass]
condition = "browser_complete = true AND isolated_at_4 = true AND control_tokens_detected = true AND control_float_detected = true AND all_exact = true AND seeded_ok = true"
decision = "The shipping page reproduces the unpadded eager decoder on all twelve cases at 1 and 4 threads, with live controls and crossOriginIsolated at 4 threads. 30-token sampling is validated in headless Chromium for these cases."
reasoning = "Agreement from a real page at both thread settings with sensitive controls licenses 'validated'. It licenses nothing about WebGPU, other browsers, other structures, speed, or statistical properties of the seeded generator."
is_residual = false

