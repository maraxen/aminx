# v1 finding (teacher-forced <= 1e-4 nats, recovery TOST delta 0.01 AND excess-JS
# 95% upper bound < committed m_l, IUT alpha 0.05 per lane, zero omitted-AA and
# zero X tokens, posctl_detected >= 18/20, negctl_fp <= 3/20, P09-s fusion
# control, lanes including P11-s) is the pre-draft text of THIS file. Recover it
# from git history (branch feat/sampling-v2d-cursor at 68f33c78 and its parents).
# That finding now lives in layer_a_sampling_merge.bth.toml. LigandMPNN / P11-s
# is deferred by user decision 2026-09-28. This sidecar is the v2 SHARD contract.

[metadata]
title = "Layer (a) sampling v2 shard: one deterministic slice of V2_LANES"
created = "260925"
schema_version = "0.3"

[experiment]
hypothesis = "This shard drew every unit the deterministic planner assigned it, from a clean tree, with prerequisites met."
stage_name = "validation"

[reproduction]
reproduces_paper = "dauparas/LigandMPNN@26ec57ac976ade5379920dbd43c7f97a91cf82de (reference code; Mode A). P11-s / LigandMPNN is deferred by user decision 2026-09-28 and is not a v2 shard lane."
# no requires_pass_stem; prereq_check() against layer_a_sampling_calibrate replaces it

[controls]
positive_outcome = ["pass"]
negative_outcome = ["incomplete"]

# [differential] stays on this file because layer_a_sampling_validate.py --dry-run
# reads [differential].min_effect from its own sidecar. The finding's differential
# is the merge sidecar. min_effect 0.0 remains the placeholder until the params commit.
[differential]
knob = "AMINX_BV_SAMPLING_BIAS"   # 1 = calibrated +beta on alanine, MAIN aminx arm
off = "0"
on = "1"
expect = "differs"
metric = "main_js_vs_ref"         # pooled-composition JS, main aminx arm vs reference arm, reduced subset
min_effect = 0.0                  # PLACEHOLDER: set to sampling.min_effect (> 0) in the params commit, BEFORE any validate smoke (R3-C9); --dry-run fails on 0.0

# Declaration order is load-bearing (first match wins). A path that did not draw
# emits units_assigned <= 0, which is incomplete rather than a vacuous pass.

[outcomes.incomplete]
condition = "units_assigned <= 0 OR units_drawn <> units_assigned OR NOT prereq_ok OR NOT git_clean OR n_shards < 1 OR shard_index < 0 OR shard_index >= n_shards"
decision = "This shard did not draw every unit the planner assigned, a prerequisite failed, or the tree was dirty; the partial proves nothing."
reasoning = "A short shard, a failed calibrate prerequisite, a dirty tree, or a shard index outside 0..n_shards-1 means the slice did not run under the conditions the merge finding requires."
is_residual = true

[outcomes.pass]
condition = "units_assigned > 0 AND units_drawn = units_assigned AND prereq_ok AND git_clean AND n_shards >= 1 AND shard_index >= 0 AND shard_index < n_shards"
decision = "This shard drew every assigned unit from a clean tree with prerequisites met; eligible to be merged."
reasoning = "units_drawn matching units_assigned, with prereq_ok and git_clean, is the evidence that this slice is a complete partition element."
is_residual = false

[result_schema]
units_assigned = "int"
units_drawn = "int"
prereq_ok = "bool"
git_clean = "bool"
n_shards = "int"
shard_index = "int"
records_path = "str"
git_hash = "str"

[dependencies]
aminx_version = { type = "git_sha", required = true }
jax_version = { type = "string", required = true }
torch_version = { type = "string", required = true }
