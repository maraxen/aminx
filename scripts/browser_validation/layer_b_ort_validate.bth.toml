[metadata]
title = "Layer (b): ORT-CPU validate on held-out fixture set B (W/P27/b-ORT, 3 planted controls)"
created = "260927"
schema_version = "0.3"

[experiment]
hypothesis = "On held-out fixture set B (6MRR, 1BC8, 3HTN, 4YOW), at every export bucket >= each fixture's own, the RNG-free P03/P04 export wrappers (T1) match ONNX Runtime's CPU execution provider on the already-converted, sha256-verified T2 artifacts (neighbour indices EXACT with the near-tie exclusion; P03 edge features and P04 log-probs TOL; P04 argmax EXACT), the wrapper itself matches the native aminx kernel within a tight bound when called UNPADDED (W, D-H), and P04 additionally matches the native kernel called on the unpadded structure when the wrapper is padded to its own export bucket (P27, D-H). Every b-ORT/P27 cell is gated against the T3a-committed calibration headroom state (not_advanced cells are reported excluded_not_advanced and never gated, capping the outcome at partial_headroom); a bucket T3a never measured (256) inherits the nearest larger measured bucket's state. The two refusal probes (2GFB oversize, 5L33[:40] undersize) are re-checked. Three planted controls -- the T3a-sized P04 log-prob bias, the T3a-sized P03 edge-projection bias, and the T2-built index-slot swap -- are each detected."
stage_name = "validation"
claim_discriminates = ["H_b_ort_within_bar", "H_null_misspec"]
claim_isolates = ["C_artifact_provenance"]

[reproduction]
novel = true
# No external paper/reference codebase is being reproduced here (unlike layer_a_exact_validate's
# LigandMPNN@26ec57ac target): this is an internal ORT-artifact-vs-JAX-wrapper consistency check,
# so `novel = true` replaces [reproduction], mirroring layer_b_ort_calibrate.bth.toml's own choice.

[controls]
positive_outcome = ["pass"]
negative_outcome = ["incomplete", "ctrl_blind", "fail"]

[differential]
knob = "AMINX_BV_LAYERB_ORT_VALIDATE_PERTURB"   # read via BTH_DIFFERENTIAL_VALUE; 1 = apply T3a's
                                                 # committed delta_b04/delta_b03 on 5L33@128
off = "0"
on = "1"
expect = "differs"
metric = "ctrl_ratio_min"        # min(P04 log-prob ratio-to-bar, P03 edge ratio-to-bar) on 5L33@128
min_effect = 5.054473876953125   # PINNED: min(ctrl_effect.p04 / 1e-4, ctrl_effect.p03 / 2e-5) from
                                  # the T3a-committed preregistered_params.json (effect in bar units;
                                  # ctrl_effect.p04=0.0005602836608886719/1e-4=5.602836608886719,
                                  # ctrl_effect.p03=0.00010108947753906251/2e-5=5.054473876953125,
                                  # min = 5.054473876953125). No placeholder; the same deterministic
                                  # JAX computation as T3a's own sizing search, so the "on" arm's
                                  # ctrl_ratio_min should reproduce this value.

# Declaration order matters (first matching branch wins): blocked, incomplete, ctrl_blind, fail,
# tie_unstable, partial_headroom, pass (task spec's own ordering).

[outcomes.blocked]
condition = "n_paths_available = 0"
decision = "Neither P03 nor P04 has a clean converted artifact for every export bucket (T2 BLOCKED table); nothing in this task's comparisons could run, and the run is recorded as blocked rather than silently producing an empty pass."
reasoning = "T2's per-path BLOCKED table requires every downstream sidecar to declare blocked as its FIRST-matching outcome when n_paths_available == 0 (spec 'Referenced excerpt: Task 2 per-path BLOCKED table')."
is_residual = true

[outcomes.incomplete]
condition = "n_skipped > 0 OR NOT git_clean"
decision = "One or more (fixture, bucket) cells failed to compute (an ORT session/execution error or a fixture-level exception), or the run tree was dirty; this validate run proves nothing and must not be committed as a clean validation."
reasoning = "A skipped cell or a dirty tree means the comparisons this run would grade did not all run under the conditions the claim requires, regardless of what the computed rows say."
is_residual = true

[outcomes.ctrl_blind]
condition = "controls_detected < controls_total"
decision = "Instrument insensitive at the claimed resolution; no parity statement is permitted for this run."
reasoning = "A planted control (T3a-sized P04 bias, T3a-sized P03 edge bias, or the T2 index-slot swap) that fails to trip means the harness cannot be trusted to catch a real discrepancy of this or smaller magnitude on set B, so a clean row set is not evidence of parity."
is_residual = true

[outcomes.fail]
condition = "n_over_bar > 0"
decision = "At least one GATED row (not excluded_not_advanced) exceeds its bar with a non-near-tie mismatch or a TOL metric over bar: finding + DEVIATION."
reasoning = "Residual catch-all: a gated row's OWN measurement exceeding its bar, with sensitive controls and no calibration not_advanced/low_headroom cushion available, is a genuine divergence."
is_residual = true

[outcomes.tie_unstable]
condition = "n_over_bar = 0 AND n_tie_unstable > 0"
decision = "Every GATED index mismatch is confined to near-tie rows (pre-registered bars' Near-tie rule); the export/ORT pipeline is not shown to disagree with the wrapper on any geometrically well-separated row."
reasoning = "The near-tie rule exists precisely so that float32-evaluation-order-driven neighbour-slot swaps on genuinely tied rows are not mistaken for a real divergence; recording tie_unstable (rather than pass or fail) keeps that distinction visible."
is_residual = false

[outcomes.partial_headroom]
condition = "n_over_bar = 0 AND n_tie_unstable = 0 AND (n_excluded_not_advanced > 0 OR n_low_headroom > 0)"
decision = "Every gated row is within bar (or tie_unstable-excluded), but at least one cell was excluded as not_advanced (calibration headroom) or gated with only low_headroom margin; the excluded/low-headroom paths do not advance from this run."
reasoning = "Calibration's headroom rule (bar/2) already flagged these paths before this run (P03 edge_features/b_ort is not_advanced at every measured bucket in T3a); measuring and reporting them here without gating on them keeps the not_advanced/low_headroom accounting honest without conflating it with a fresh validation failure."
is_residual = false

[outcomes.pass]
condition = "n_over_bar = 0 AND n_tie_unstable = 0 AND n_excluded_not_advanced = 0 AND n_low_headroom = 0"
decision = "Every gated row is within bar, with full calibration headroom (advanced) on every measured/inherited bucket."
reasoning = "Zero over-bar rows, zero tie_unstable rows, and zero not_advanced/low_headroom cells, with every control detected, are the minimum evidence that every in-scope layer-(b) ORT-CPU path is parity-equivalent to the wrapper (and, via W/P27, to the native kernel) on the held-out set."
is_residual = false

[result_schema]
n_paths_available = "int"
converted_by_path = "dict"
controls_total = "int"
controls_detected = "int"
n_rows = "int"
n_skipped = "int"
n_excluded_not_advanced = "int"
n_low_headroom = "int"
n_over_bar = "int"
n_tie_unstable = "int"
length_probes_ok = "bool"
worst_ratio_to_bar = "float"
worst_path = "str"
max_p_before = "float"
n_dropout = "int"
git_hash = "str"
git_clean = "bool"
artifact_subdir = "str"
versions = "dict"
comparator_self_test_pass = "bool"
control_fixture = "str"
ctrl_ratio_min = "float"

[dependencies]
aminx_version = { type = "git_sha", required = true }
jax_version = { type = "string", required = true }
jax2onnx_version = { type = "string", required = true }
onnx_version = { type = "string", required = true }
onnxruntime_version = { type = "string", required = true }
