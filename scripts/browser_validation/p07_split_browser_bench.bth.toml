[metadata]
title = "G4b: per-design wall time in headless Chromium, with a browser timer control"
created = "260930"
schema_version = "0.3"

[experiment]
hypothesis = "With the page's own clock (performance.now) first shown to detect a deliberately planted delay, the median per-design wall time of the four-graph split can be measured in headless Chromium at a recorded thread count, together with per-graph session-creation cost, and reported as a measurement of that configuration. NO PERFORMANCE DIRECTION IS PRE-REGISTERED, exactly as in G4: this gate measures a quantity rather than testing a claim about it, and the graded pass/fail is MEASUREMENT VALIDITY. WHY IT EXISTS SEPARATELY FROM G4 (run be45e729): G4 validated process.hrtime under Node. The browser is a different runtime with a different clock, and performance.now has never been checked here, so the roughly 2.4x threading speedup visible between the browser parity runs (d6be02ea single-threaded against da02516e at four threads) is currently INDICATIVE ONLY -- those gates grade correctness and carry no timer control at all. Publishing that ratio as measured would repeat precisely the mistake that caused this project's first benchmark to be discarded. The one pre-registered pass/fail is the control: a planted delay measured through the same clock and the same await machinery as the real timings must return within [0.9x, planted + 2000 ms]. The lower bound catches a clock that does not advance, is coarsened for security, or measures a region that is not actually running; the upper catches a machine or browser too loaded for millisecond resolution. Outside that window the run grades `timer_blind` and no timing from it may be cited anywhere. Site assembly and cell construction are imported from the browser parity gate rather than duplicated, so both gates serve byte-identical sites and a timing difference cannot be an assembly difference. The effective thread count and crossOriginIsolated are recorded as the page reports them, not as requested, so a silently single-threaded or non-isolated run appears as data rather than being mistaken for a threading result."
stage_name = "validation"
claim_discriminates = ["H_browser_timer_sound", "H_browser_timer_blind"]
claim_isolates = ["C_browser_bench_instrument"]
novel = true
# No [reproduction]: novel = true replaces it (same convention as the sibling gates).

[controls]
positive_outcome = ["pass"]
negative_outcome = ["incomplete", "timer_blind"]

# First matching branch wins: incomplete, timer_blind, pass.

[outcomes.incomplete]
condition = "NOT bench_ok OR cells_total < 2 OR reps < 3 OR NOT git_clean OR failure <> ''"
decision = "The benchmark did not run to size: the browser harness failed, too few cells or repetitions completed, the tree was dirty in a code path, or an exception was raised. No timing may be quoted."
reasoning = "Three repetitions is the floor for reporting a median at all, and two cells the floor for the figure to describe more than a single knob. A partial run invites quoting whichever subset finished."
is_residual = true

[outcomes.timer_blind]
condition = "ctrl_measured_ms < 0.9 * planted_ms OR ctrl_measured_ms > planted_ms + 2000"
decision = "The page's clock did not see the planted delay, or the environment was too loaded for the measurement to mean anything. NO TIMING FROM THIS RUN MAY BE REPORTED OR CITED, and the indicative browser speedup stays indicative."
reasoning = "This is the gate's reason for existing. Browsers coarsen performance.now under some isolation and security settings, precisely the settings this harness enables, so assuming the clock is fine because it is fine under Node would be assuming away the specific risk."
is_residual = true

[outcomes.pass]
condition = "bench_ok AND ctrl_measured_ms >= 0.9 * planted_ms AND ctrl_measured_ms <= planted_ms + 2000"
decision = "The browser clock is demonstrably sensitive and every cell completed. The recorded medians and session-creation costs may be reported AS MEASUREMENTS OF THIS CONFIGURATION -- headless Chromium, the recorded thread count and isolation state, this machine."
reasoning = "A sound clock plus complete coverage is what licenses quoting a browser timing at all, and what would let the threading speedup move from indicative to measured. It licenses nothing about other browsers, other hardware, or WebGPU."
is_residual = false

[result_schema]
bucket = "int"
reps = "int"
planted_ms = "float"
ctrl_measured_ms = "float"
ctrl_ratio = "float"
cells_total = "int"
num_threads_requested = "int"
num_threads_effective = "int"
cross_origin_isolated = "bool"
chromium_version = "str"
median_ms = "float"
min_ms = "float"
max_ms = "float"
session_create_total_ms = "float"
bench_ok = "bool"
failure = "str"
git_hash = "str"
git_clean = "bool"

[dependencies]
aminx_version = { type = "git_sha", required = true }
onnxruntime_web_version = { type = "string", required = true }
playwright_version = { type = "string", required = true }
