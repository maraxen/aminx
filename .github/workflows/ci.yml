name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  epic-attribution-lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check decode-path commits reference an epic ID (backlog #2954)
        run: python3 scripts/check_epic_attribution.py "origin/${{ github.base_ref }}..HEAD"

  unit-tests:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: 1
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - name: Install ast-grep
        run: npm install -g @ast-grep/cli
      - name: Install dependencies and run tests
        run: |
          uv sync --extra cpu --extra dev --extra tests --extra onnx

          # The ONNX parity tests skip (rather than error) when the toolchain is absent, so a broken install
          # would quietly turn them into skips. Fail the job instead (aminx debt #2392).
          uv run python -c "import onnx, onnxruntime, jax2onnx; print('onnx', onnx.__version__, '| onnxruntime', onnxruntime.__version__, '| jax2onnx ok')"

          # Determine marker expression based on event type
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "Pull request: running fast tests (excluding slow, parity_heavy, parity_audit)."
            MARKER="not slow and not parity_heavy and not parity_audit"
          else
            echo "Push to main: excluding parity_heavy and parity_audit (run in parity workflows)."
            MARKER="not parity_heavy and not parity_audit"
          fi

          uv run pytest -n auto --cov=src --cov-report=xml --cov-report=term -m "$MARKER"
      - name: Upload coverage to Codecov
        if: github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
