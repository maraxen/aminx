name: Release

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # lfs: true -- without it the packaged ideal_geometry.npz is a Git LFS pointer, which is
      # exactly what the 0.5.3 wheel shipped (debt #3500).
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Build sdist and wheel
        run: uv build

      # Refuse to publish a wheel whose packaged data files are LFS pointers or unreadable.
      - name: Check packaged data files
        run: uv run --no-project --with numpy python scripts/release/check_wheel_data.py dist/*.whl

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
